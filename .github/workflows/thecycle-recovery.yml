name: TheCycle recovery tests
on:
  push:
    branches:
      - 'thecycle/**'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TheCycle tests
        run: node --test tests/thecycle-*.test.js
