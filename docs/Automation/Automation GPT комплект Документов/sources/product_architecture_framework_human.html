<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framework разработки архитектуры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f7f9; --panel:#fff; --panel2:#f9fafb; --text:#18212b; --muted:#66717f;
  --line:#d9e0e7; --line2:#c6d0db; --shadow:0 10px 28px rgba(26,35,45,.09);
  --product:#168b8f; --discovery:#b07a18; --generation:#5b52b9; --evidence:#ad5545;
  --producer:#3273dc; --reviewer:#a9632f; --synthesizer:#7351b8; --decision:#2f8d63; --verifier:#8c7a24; --owner:#515b66;
  --accent:#c52e6b; --danger:#c84b4b; --change:#3a73c7; --evidenceLine:#8b7a2d; --finding:#a65c2a; --authority:#2f8d63; --mode:#6c57b8; --baseline:#4d6876;
  --rowlabel:192px; --gap:44px; --stage:250px; --stageOpen:930px; --radius:12px;
}
html[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --panel2:#111820; --text:#e6ebf0; --muted:#99a5b2;
  --line:#2a3541; --line2:#394757; --shadow:0 14px 30px rgba(0,0,0,.28);
  --product:#31a8aa; --discovery:#d2a142; --generation:#8d83df; --evidence:#d27a68;
  --producer:#6ba2ef; --reviewer:#cf8a51; --synthesizer:#9c83d7; --decision:#63b68d; --verifier:#b9a956; --owner:#9ca6b0;
  --accent:#ee5b9b; --danger:#e57373; --change:#6a9ee6; --evidenceLine:#baa94c; --finding:#cd8451; --authority:#63b68d; --mode:#9c83d7; --baseline:#8fa5b2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{color:inherit}
.mono,pre,code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.app-header{
  position:sticky;top:0;z-index:80;background:color-mix(in srgb,var(--bg) 91%,transparent);
  backdrop-filter:blur(13px);border-bottom:1px solid var(--line);padding:10px 14px 9px;
}
.head-top{display:flex;align-items:center;gap:10px;min-height:38px}
h1{font-size:18px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.head-spacer{flex:1}
.toolbar{display:flex;align-items:center;gap:7px}
.icon-btn,.chip-btn,.phase-btn,.layer-btn,.principle-btn,.nav-btn,.tiny-btn{
  border:1px solid var(--line2);background:var(--panel);border-radius:9px;cursor:pointer;transition:.13s ease;
}
.icon-btn:hover,.chip-btn:hover,.phase-btn:hover,.layer-btn:hover,.principle-btn:hover,.nav-btn:hover,.tiny-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
 .icon-btn{width:34px;height:34px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.top-actions{display:flex;align-items:center;gap:6px}
.layer-menu-wrap{position:relative;display:flex;align-items:center}
.layer-menu{
  position:absolute;top:calc(100% + 7px);right:0;z-index:120;min-width:250px;max-height:min(520px,70vh);overflow:auto;
  padding:8px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);display:none
}
.layer-menu.open{display:block}
.layer-menu label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:11px;cursor:pointer;white-space:nowrap}
.layer-menu label:hover{background:var(--panel2)}
.layer-menu input{accent-color:var(--accent);margin:0}
.layer-menu .menu-title{padding:3px 8px 6px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.phase-separator{position:absolute;z-index:9;width:0;border-left:5px dashed var(--decision);opacity:.82;pointer-events:auto;cursor:help}
.phase-separator::after{
  content:attr(data-tooltip);position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:30;
  width:max-content;max-width:310px;padding:7px 9px;border:1px solid var(--line2);border-radius:8px;
  background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-size:10.5px;line-height:1.35;font-weight:500;
  white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease,visibility .12s ease
}
.phase-separator:hover::after{opacity:1;visibility:visible}
.search-wrap{display:flex;align-items:center;gap:6px;min-width:300px}
.search-wrap input{
  width:270px;height:34px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--text);padding:0 10px;outline:none
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search-count{font-size:11px;color:var(--muted);min-width:34px}
.head-row{display:flex;align-items:center;gap:7px;margin-top:7px;min-height:30px;overflow-x:auto;scrollbar-width:none}
.head-row::-webkit-scrollbar{display:none}
.row-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:62px}
.principle-btn,.layer-btn,.phase-btn,.chip-btn{padding:5px 9px;font-size:11px;white-space:nowrap}
.principle-btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.layer-btn.off{opacity:.43;text-decoration:line-through}
.phase-btn[data-phase="product"]{border-bottom:2px solid var(--product)}
.phase-btn[data-phase="discovery"]{border-bottom:2px solid var(--discovery)}
.phase-btn[data-phase="generation"]{border-bottom:2px solid var(--generation)}
.phase-btn[data-phase="evidence"]{border-bottom:2px solid var(--evidence)}
.nav-btn{width:30px;height:28px}
.position{width:180px;accent-color:var(--accent)}
.stage-indicator{font-size:11px;color:var(--muted);min-width:54px}
.timeline-shell{position:relative;overflow-x:auto;overflow-y:visible;scrollbar-width:none;cursor:grab}
.timeline-shell::-webkit-scrollbar{display:none}
.timeline-shell.dragging{cursor:grabbing;user-select:none}
.timeline{position:relative;padding:12px 18px 22px;min-width:max-content}
.phase-row,.grid-row{display:grid;column-gap:var(--gap);position:relative;align-items:start;transition:grid-template-columns .18s ease}
.phase-row{height:64px;align-items:stretch}
.phase-band{
  border-top:4px solid currentColor;border-radius:8px 8px 0 0;padding:8px 11px 0;background:linear-gradient(180deg,color-mix(in srgb,currentColor 7%,transparent),transparent);
  font-size:12px;font-weight:700
}
.phase-band span{display:block;font-weight:500;font-size:10px;color:var(--muted);margin-top:2px}
.phase-band.product{color:var(--product)} .phase-band.discovery{color:var(--discovery)}
.phase-band.generation{color:var(--generation)} .phase-band.evidence{color:var(--evidence)}
.grid-row{
  border-top:1px solid var(--line);min-height:64px;padding:9px 0 10px;
}
.grid-row.compact{min-height:50px;padding:7px 0}
.grid-row.stages-row{min-height:368px;padding-top:8px;padding-bottom:14px;border-top:0;border-bottom:0}
.grid-row.stages-row + .grid-row{border-top:0}
.grid-row.baselines-row{min-height:82px}
.grid-row.infra-head{min-height:56px;padding:7px 0;background:color-mix(in srgb,var(--baseline) 3%,transparent)}
.grid-row.infra-row{min-height:54px;padding:6px 0}
.grid-row.layer-collapsed{min-height:32px;height:32px;padding:3px 0;overflow:hidden}
.grid-row.layer-collapsed .node,.grid-row.layer-collapsed .baseline-segment,.grid-row.layer-collapsed .infra-note{display:none!important}
.grid-row.layer-hidden{display:none}
.layer-label{
  position:sticky;left:8px;z-index:18;align-self:start;justify-self:start;width:184px;min-height:28px;
  display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-left:4px solid var(--labelColor,var(--baseline));
  border-radius:8px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 4px 12px rgba(0,0,0,.04);cursor:pointer;
  user-select:none
}
.layer-label .caret{font-size:11px;color:var(--muted);width:10px}
.layer-label strong{display:block;font-size:10.5px;line-height:1.05}
.layer-label small{display:block;font-size:8.8px;color:var(--muted);line-height:1.1;margin-top:2px}
.layer-collapsed .layer-label small{display:none}
.layer-collapsed .layer-label{min-height:24px;padding-top:4px;padding-bottom:4px}
.node{
  position:relative;z-index:6;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.035);
  transition:opacity .14s ease,border-color .14s ease,box-shadow .14s ease,transform .14s ease
}
.node:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line2));box-shadow:0 7px 18px rgba(0,0,0,.09)}
.small-node{padding:7px 8px;font-size:10px;line-height:1.17;min-height:36px;align-self:start}
.compact-node{padding:6px 7px;font-size:10px;line-height:1.14;min-height:32px}
.authority-node{border-left:3px solid var(--authority)}
.mode-node{border-left:3px solid var(--mode);padding:7px 8px;font-size:9.5px;line-height:1.17}
.mode-node strong{font-size:10px;display:block;margin-bottom:4px}
.mode-line{display:grid;grid-template-columns:58px 1fr;gap:4px;margin-top:2px}
.mode-line span:first-child{color:var(--muted)}
.stage-card{
  padding:12px 12px 11px;border-top:4px solid var(--phaseColor);cursor:default;overflow:hidden;height:auto;
}
.stage-card:not(.expanded){height:var(--collapsed-stage-height,auto)}
.stage-card:focus{outline:2px solid var(--accent);outline-offset:2px}
.stage-prompt{
  position:absolute;right:8px;top:7px;z-index:9;width:25px;height:25px;padding:4px;border:1px solid var(--line2);border-radius:7px;
  display:grid;place-items:center;background:var(--panel);color:var(--muted);cursor:pointer
}
.stage-prompt:hover,.stage-prompt:focus-visible{color:var(--accent);border-color:var(--accent);outline:none}
.stage-prompt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stage-num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;color:var(--muted)}
.gate-badge,.multi-badge,.status-badge{
  padding:2px 6px;border:1px solid var(--line2);border-radius:999px;font-size:9px;font-weight:700;background:var(--panel2);cursor:pointer
}
.gate-badge{border-color:color-mix(in srgb,var(--accent) 65%,var(--line2));color:var(--accent)}
.multi-badge{color:var(--mode)}
.stage-title{font-weight:700;font-size:14px;line-height:1.18;margin:0 0 7px}
.stage-summary{font-size:10.5px;line-height:1.35;color:var(--muted)}
.stage-io-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.stage-io-block{min-width:0}
.stage-io-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.stage-io-value{font-size:10px;line-height:1.3;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.role-chip,.rule-chip,.object-chip{
  border:1px solid var(--line2);border-radius:999px;padding:3px 6px;background:var(--panel2);font-size:8.8px;line-height:1.1;cursor:pointer
}
.rule-chip{border-style:dashed;color:var(--muted)}
.role-chip[data-role="Producer"]{border-color:var(--producer);color:var(--producer)}
.role-chip[data-role="Reviewer"]{border-color:var(--reviewer);color:var(--reviewer)}
.role-chip[data-role="Synthesizer"]{border-color:var(--synthesizer);color:var(--synthesizer)}
.role-chip[data-role="Decision Closer"]{border-color:var(--decision);color:var(--decision)}
.role-chip[data-role="Verifier"]{border-color:var(--verifier);color:var(--verifier)}
.role-chip[data-role="Owner"]{border-color:var(--owner);color:var(--owner)}
.stage-hint{position:static;margin-top:9px;color:var(--muted);font-size:8.8px}
.stage-card.expanded{height:max-content}
.stage-card.expanded .stage-num{font-size:14px}
.stage-card.expanded .stage-title{font-size:18px;line-height:1.2;margin-bottom:9px}
.stage-card.expanded .stage-summary{min-height:0;font-size:13px;line-height:1.45}
.stage-card.expanded .stage-io-label{font-size:10.5px}
.stage-card.expanded .stage-io-value{font-size:12px;line-height:1.4}
.stage-card.expanded .role-chip,.stage-card.expanded .rule-chip{font-size:10.5px;padding:4px 7px}
.stage-card.expanded .stage-hint{font-size:10.5px}
.stage-card.expanded .detail-block h4{font-size:11px}
.stage-card.expanded .detail-block p,.stage-card.expanded .detail-block li{font-size:12px;line-height:1.45}
.stage-card.expanded .io-line{font-size:12px;line-height:1.55}
.stage-card.expanded .io-line b{font-size:10.5px;min-width:82px}
.stage-card.expanded .object-chip{font-size:10.5px;padding:4px 7px}
.stage-card.expanded .triad-box h4{font-size:10.5px}
.stage-card.expanded .triad-box li{font-size:11.5px;line-height:1.4}
.stage-card.expanded .contract summary{font-size:12px;padding:9px 10px}
.stage-card.expanded .contract pre{font-size:10px;line-height:1.45}
.stage-details{display:none;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.stage-card.expanded .stage-details{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.detail-block h4{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.detail-block p,.detail-block li{font-size:10px;line-height:1.35;margin:0}
.detail-block ul{margin:0;padding-left:16px}
.detail-block.full{grid-column:1/-1}
.io-line{font-size:10px;line-height:1.5;margin:2px 0}
.io-line b{font-size:9px;text-transform:uppercase;color:var(--muted);display:inline-block;min-width:66px}
.object-chip{font-size:9px;margin:2px 2px 2px 0;border-radius:6px}
.triad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.triad-box{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.triad-box h4{font-size:9px;margin:0 0 5px}
.triad-box ul{margin:0;padding-left:15px}.triad-box li{font-size:9.5px;line-height:1.32}
.contract{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.contract summary{padding:7px 8px;cursor:pointer;font-size:10px;font-weight:700}
.contract-inner{padding:0 8px 8px;position:relative}
.contract pre{white-space:pre-wrap;word-break:break-word;margin:0;max-height:320px;overflow:auto;font-size:8.5px;line-height:1.35;color:var(--text);background:var(--bg);border-radius:6px;padding:8px}
.copy-contract{position:absolute;right:14px;top:6px;padding:3px 7px;font-size:8.5px}
.decision-node{border-left:3px solid var(--decision)}
.finding-node{border-left:3px solid var(--finding)}
.evidence-node{border-left:3px solid var(--evidenceLine)}
.change-node{border-left:3px solid var(--change)}
.baseline-segment{
  position:relative;z-index:5;height:62px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--baseline) 7%,var(--panel)) 0 8px,color-mix(in srgb,var(--baseline) 12%,var(--panel)) 8px 16px)
}
.baseline-fill{height:100%;padding:8px 215px 8px 10px;font-size:9px;line-height:1.22;color:var(--muted)}
.baseline-head{
  position:absolute;right:0;top:0;bottom:0;width:205px;background:var(--panel);border-left:1px solid var(--line2);padding:7px 9px
}
.baseline-head strong{display:block;font-size:10.5px}
.baseline-head span{display:block;font-size:8.6px;color:var(--muted);margin-top:2px}
.baseline-head em{display:block;font-size:8px;color:var(--change);font-style:normal;margin-top:4px}
.infra-note{font-size:9.6px;color:var(--muted);padding:6px 0 2px;align-self:center}
.infra-node{font-size:9px;line-height:1.18;padding:6px 7px;border-radius:7px;cursor:pointer;background:var(--panel2)}
.infra-node:hover{transform:translateY(-1px)}
.infra-role{color:var(--muted);font-size:8.6px;margin-top:2px}
.reconstructed{font-size:7.6px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#links{position:absolute;left:18px;top:12px;pointer-events:none;z-index:4;overflow:visible}
#links path{fill:none;stroke-width:1.35;opacity:.72;transition:opacity .14s ease,stroke-width .14s ease}
#links path.main{stroke-width:2.2;opacity:.78}
#links path.return{stroke-width:1.8}
#links path.change{stroke-dasharray:5 4}
#links path.authority-chain{stroke-dasharray:4 4}
#links path.artifact{display:none}
#links path.claim{stroke-dasharray:4 3}
#links path.converge,#links path.authority-scope,#links path.reference{stroke-dasharray:4 4}
#links path.commit{stroke-width:1.8;opacity:.9}
body.has-highlight .node,body.has-highlight .baseline-segment{opacity:.16}
body.has-highlight .node.hl,body.has-highlight .baseline-segment.hl{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
body.has-highlight #links path{opacity:.08}
body.has-highlight #links path.hl{opacity:1;stroke-width:2.7}
.search-hit{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 42%,transparent)!important;border-color:var(--accent)!important}
.popup{
  position:fixed;z-index:150;width:min(420px,calc(100vw - 22px));max-height:min(580px,calc(100vh - 22px));overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:none
}
.popup.open{display:block}
.popup-close{position:absolute;right:8px;top:8px;z-index:3;width:27px;height:27px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:17px;pointer-events:auto}
.popup h3{font-size:13px;margin:0 30px 5px 0}
.popup .sub{font-size:9px;color:var(--muted);margin-bottom:10px}
.popup p,.popup li{font-size:10px;line-height:1.4}
.popup ul{padding-left:17px;margin:5px 0 9px}
.popup table{width:100%;border-collapse:collapse;font-size:9.5px}
.popup th,.popup td{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}
.popup .jump{color:var(--accent);text-decoration:underline;cursor:pointer}
.popup pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:7px;font-size:8.4px;line-height:1.3}
.popup.prompt-popup{width:min(720px,calc(100vw - 22px))}
.prompt-editor{width:100%;min-height:390px;resize:vertical;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--text);padding:10px;font:10.5px/1.45 "IBM Plex Mono",ui-monospace,monospace;outline:none}
.prompt-editor:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}
.prompt-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}
.prompt-actions button{padding:6px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font-size:9.5px;cursor:pointer}
.prompt-actions button.primary{border-color:var(--accent);color:var(--accent)}
.toast{
  position:fixed;right:14px;bottom:14px;z-index:200;background:var(--text);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:10px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease
}
.toast.show{opacity:1;transform:translateY(0)}

@media (prefers-color-scheme:dark){
  html:not([data-theme]){
    --bg:#0f141a; --panel:#161d25; --panel2:#111820; --text:#e6ebf0; --muted:#99a5b2;
    --line:#2a3541; --line2:#394757; --shadow:0 14px 30px rgba(0,0,0,.28);
    --product:#31a8aa; --discovery:#d2a142; --generation:#8d83df; --evidence:#d27a68;
    --producer:#6ba2ef; --reviewer:#cf8a51; --synthesizer:#9c83d7; --decision:#63b68d; --verifier:#b9a956; --owner:#9ca6b0;
    --accent:#ee5b9b; --danger:#e57373; --change:#6a9ee6; --evidenceLine:#baa94c; --finding:#cd8451; --authority:#63b68d; --mode:#9c83d7; --baseline:#8fa5b2;
  }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
@media (max-width:900px){
  .search-wrap{min-width:0}.search-wrap input{width:170px}.row-title{min-width:54px}.app-header{padding-left:8px;padding-right:8px}
}
</style>
</head>

<header class="app-header">

function loadState(){
  try{

    if(s.theme) document.documentElement.dataset.theme=s.theme;
    if(Array.isArray(s.hiddenLayers)) state.hiddenLayers=new Set(s.hiddenLayers);
    if(Array.isArray(s.collapsedLayers)) state.collapsedLayers=new Set(s.collapsedLayers);
    if(Number.isInteger(s.expandedStage)) state.expandedStage=s.expandedStage;
    if(Number.isInteger(s.currentStage)) state.currentStage=s.currentStage;
    if(s.prompts&&typeof s.prompts==="object"&&!Array.isArray(s.prompts)) state.prompts={...s.prompts};
    if(Number.isFinite(s.scrollLeft)) requestAnimationFrame(()=>document.getElementById("scroll").scrollLeft=s.scrollLeft);
  }catch(e){}

}

let edges=[];
function E(a,b,type="relation",opts={}){edges.push({a,b,type,...opts})}
function buildEdges(){
  edges.length=0;

  // Transfer artifacts are displayed inside stage cards; package dependencies connect producer stage directly to consumer stage.
  SYSTEM_MODEL.artifactRoutes.forEach(([a,b,label])=>E(`stage-${a}`,`stage-${b}`,"artifact",{relation:"transfers",label}));

  // Governance: one Decision Policy governs all later authority checkpoints; checkpoints govern their activities.
  const authNs=Object.keys(DATA.authority).map(Number);
  authNs.forEach(n=>E(`authority-${n}`,`stage-${n}`,"authority",{relation:"governs"}));
  authNs.filter(n=>n!==1).forEach(n=>E("authority-1",`authority-${n}`,"authority-scope",{relation:"policy_scope"}));

  // Independent execution is attached to its activity and explicitly converges later.
  Object.keys(DATA.modeInfo).forEach(n=>E(`mode-${n}`,`stage-${n}`,"mode",{relation:"execution_mode"}));
  Object.entries(SYSTEM_MODEL.modeConvergence).forEach(([a,b])=>E(`mode-${a}`,`stage-${b}`,"converge",{relation:"converges_at"}));

  // Persistent state writes.
  Object.keys(SYSTEM_MODEL.decisionBlocks).forEach(n=>E(`stage-${n}`,`decision-${n}`,"decision",{relation:"writes_decision_state"}));
  Object.keys(SYSTEM_MODEL.workBlocks).forEach(n=>E(`stage-${n}`,`finding-${n}`,"finding",{relation:"writes_work_state"}));
  Object.keys(SYSTEM_MODEL.claimBlocks).forEach(n=>E(`stage-${n}`,`claim-${n}`,"claim",{relation:"writes_epistemic_state"}));
  Object.keys(SYSTEM_MODEL.evidenceBlocks).forEach(n=>E(`stage-${n}`,`evidence-${n}`,"evidence",{relation:"records_evidence"}));
  Object.keys(SYSTEM_MODEL.changeBlocks).forEach(n=>E(`stage-${n}`,`change-${n}`,"change",{relation:"creates_or_applies_change"}));

  // State consumers and routes.
  SYSTEM_MODEL.decisionRoutes.forEach(([a,b])=>E(`decision-${a}`,`stage-${b}`,"decision",{relation:"decision_input"}));
  SYSTEM_MODEL.workRoutes.forEach(([a,b,t])=>E(`finding-${a}`,`stage-${b}`,t||"finding",{relation:t==="return"?"conditional_feedback":"work_route"}));
  SYSTEM_MODEL.claimRoutes.forEach(([a,b])=>E(`claim-${a}`,`stage-${b}`,"claim",{relation:"claim_input"}));
  SYSTEM_MODEL.evidenceRoutes.forEach(([a,b])=>E(`evidence-${a}`,typeof b==="string"?b:`stage-${b}`,"evidence",{relation:"validates_or_informs"}));
  SYSTEM_MODEL.changeRoutes.forEach(([a,b,t])=>E(`change-${a}`,b,t||"change",{relation:t==="return"?"reopen_or_regate":"change_target"}));

  // Baseline commits and downstream references. Formation windows are not treated as already-existing baselines.
  E("stage-13","baseline-PFB","commit",{relation:"commits"});
  E("stage-17","baseline-AIP","commit",{relation:"commits"});
  E("stage-30","baseline-CAB","commit",{relation:"commits"});
  SYSTEM_MODEL.baselineReferences.forEach(([a,b])=>E(a,b,"reference",{relation:"references_or_includes"}));
}
function nodeEl(id){return document.querySelector(`[data-node="${CSS.escape(id)}"]`)}
const edgeColors={relation:"var(--muted)",artifact:"var(--muted)",authority:"var(--authority)","authority-scope":"var(--authority)",mode:"var(--mode)",converge:"var(--mode)",decision:"var(--decision)",finding:"var(--finding)",claim:"var(--evidenceLine)",evidence:"var(--evidenceLine)",return:"var(--danger)",change:"var(--change)",commit:"var(--baseline)",reference:"var(--baseline)"};
function markerId(type){return "arrow-"+type.replace(/[^a-z]/g,"")}
function setupSvg(){
  const svg=document.getElementById("links");let defs="<defs>";
  Object.keys(edgeColors).forEach(t=>{defs+=`<marker id="${markerId(t)}" markerWidth="8" markerHeight="8" refX="6.6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="${edgeColors[t]}"/></marker>`});
  defs+="</defs>";svg.innerHTML=defs;
}
function rectInTimeline(el){
  if(el.classList?.contains("baseline-segment")) el=el.querySelector(".baseline-head")||el;
  const r=el.getBoundingClientRect(),t=document.getElementById("timeline").getBoundingClientRect();
  return {left:r.left-t.left,top:r.top-t.top,right:r.right-t.left,bottom:r.bottom-t.top,width:r.width,height:r.height,cx:(r.left+r.right)/2-t.left,cy:(r.top+r.bottom)/2-t.top}
}
function pathFor(a,b,type){
  const ra=rectInTimeline(a),rb=rectInTimeline(b);
  const aAbove=ra.cy<rb.cy;
  if(type==="authority"||type==="mode"){
    return `M ${ra.right-8} ${ra.bottom} V ${rb.top-8} Q ${ra.right-8} ${rb.top} ${ra.right-16} ${rb.top} H ${rb.right-8}`;
  }
  if(["artifact","decision","finding","claim","evidence","change","commit"].includes(type) && Math.abs(ra.cx-rb.cx)<80){
    const x=Math.min(ra.left,rb.left)-12;
    return `M ${ra.left+9} ${aAbove?ra.bottom:ra.top} H ${x} V ${aAbove?rb.top:rb.bottom} H ${rb.left+9}`;
  }
  const sy=aAbove?ra.bottom:ra.top, ey=aAbove?rb.top:rb.bottom;
  const sx=ra.cx, ex=rb.cx;
  const mid=(sx+ex)/2;
  return `M ${sx} ${sy} H ${mid} V ${ey} H ${ex}`;
}
function drawLinks(){
  const svg=document.getElementById("links"),tl=document.getElementById("timeline");if(!svg||!tl)return;
  svg.setAttribute("width",tl.scrollWidth);svg.setAttribute("height",tl.scrollHeight);
  svg.setAttribute("viewBox",`0 0 ${tl.scrollWidth} ${tl.scrollHeight}`);
  setupSvg();
  edges.forEach((e,i)=>{
    const a=nodeEl(e.a),b=nodeEl(e.b);if(!a||!b||a.offsetParent===null||b.offsetParent===null)return;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",pathFor(a,b,e.type));p.setAttribute("class",e.type);p.dataset.edge=String(i);
    p.style.stroke=edgeColors[e.type]||edgeColors.relation;p.setAttribute("marker-end",`url(#${markerId(e.type)})`);svg.appendChild(p)
  });
}

    state:{hiddenLayers:[...state.hiddenLayers],collapsedLayers:[...state.collapsedLayers],expandedStage:state.expandedStage,currentStage:state.currentStage,prompts:state.prompts,scrollLeft:document.getElementById("scroll").scrollLeft}
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="architecture-framework-project.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast("Проект экспортирован");
}
function importProjectState(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result),v=data?.state||data;
      if(Array.isArray(v.hiddenLayers)) state.hiddenLayers=new Set(v.hiddenLayers);
      if(Array.isArray(v.collapsedLayers)) state.collapsedLayers=new Set(v.collapsedLayers);
      if(Number.isInteger(v.expandedStage)) state.expandedStage=v.expandedStage;
      if(Number.isInteger(v.currentStage)) state.currentStage=Math.max(1,Math.min(30,v.currentStage));
      if(v.prompts&&typeof v.prompts==="object"&&!Array.isArray(v.prompts)) state.prompts={...v.prompts};
      renderRows();updatePosition();saveState();
      requestAnimationFrame(()=>{const sc=document.getElementById("scroll");if(Number.isFinite(v.scrollLeft))sc.scrollLeft=v.scrollLeft;drawLinks()});
      toast("Проект импортирован");
    }catch(_){toast("Не удалось импортировать проект")}
  };
  reader.readAsText(file);
}

  openPopup(`<h3>Семантика связей</h3><div class="sub">каждая стрелка означает один тип отношения; соседство этапов само по себе стрелку не создаёт</div>
    <table>
      <tr><th>Связь</th><th>Смысл</th></tr>
      <tr><td>Artifact dependency</td><td>activity создаёт output package; другой activity потребляет этот package.</td></tr>
      <tr><td>Decision / work / claim state</td><td>activity записывает persistent state; следующий activity читает или закрывает именно это состояние.</td></tr>
      <tr><td>Evidence → claim</td><td>evidence меняет epistemic status claim; consensus моделей этого не делает.</td></tr>
      <tr><td>Governance</td><td>Decision Policy и authority checkpoint ограничивают допустимую операцию, но не являются data flow.</td></tr>
      <tr><td>Convergence</td><td>показывает, где независимые результаты впервые разрешено сводить.</td></tr>
      <tr><td>Return</td><td>условный feedback: finding/blocker требует вернуться в конкретный closure/verification activity.</td></tr>
      <tr><td>CHG</td><td>target/propagation контролируемого изменения; стрелка не означает прямое редактирование baseline.</td></tr>
      <tr><td>Baseline commit/reference</td><td>baseline возникает на gate; последующие activities ссылаются на его конкретную версию.</td></tr>
    </table>`,anchor,"relation-legend");
}

function bindUI(){
  const popup=document.getElementById("popup");
  const popupClose=document.getElementById("popupClose");
  // Close immediately on pointer-down. This avoids click/double-click handlers
  // elsewhere in the diagram reopening or swallowing the close action.
  popupClose.addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopImmediatePropagation();
    closePopup();
  });
  popupClose.addEventListener("click",e=>{
    e.preventDefault();
    e.stopImmediatePropagation();
    closePopup();
  });
  document.getElementById("relationLegend").addEventListener("click",e=>{e.stopPropagation();openRelationLegend(e.currentTarget)});
  const layerButton=document.getElementById("layerMenuButton"),layerMenu=document.getElementById("layerMenu");
  layerButton.addEventListener("click",e=>{
    e.stopPropagation();const open=layerMenu.classList.toggle("open");layerButton.setAttribute("aria-expanded",String(open));
  });
  layerMenu.addEventListener("click",e=>e.stopPropagation());
  document.getElementById("timelineView").addEventListener("click",()=>{closePopup();document.getElementById("scroll").focus({preventScroll:true});scrollToStage(state.currentStage)});
  document.getElementById("overviewView").addEventListener("click",e=>{e.stopPropagation();openOverview(e.currentTarget)});
  document.getElementById("traceabilityView").addEventListener("click",e=>{e.stopPropagation();openTraceability(e.currentTarget)});
  document.getElementById("exportProject").addEventListener("click",exportProjectState);
  document.getElementById("importProject").addEventListener("click",()=>document.getElementById("importProjectFile").click());
  document.getElementById("importProjectFile").addEventListener("change",e=>{importProjectState(e.target.files?.[0]);e.target.value=""});
  // Capture-phase outside-close: works even when diagram controls stop bubbling.
  // Any pointer press outside the popup closes it; there are no anchor exceptions.
  document.addEventListener("pointerdown",e=>{
    const menuWrap=layerButton.closest(".layer-menu-wrap");
    if(menuWrap&&!menuWrap.contains(e.target)){layerMenu.classList.remove("open");layerButton.setAttribute("aria-expanded","false")}
    if(!popup.classList.contains("open"))return;
    if(e.target===popupClose||popupClose.contains(e.target))return;
    if(!popup.contains(e.target))closePopup();
  },true);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){closePopup();layerMenu.classList.remove("open");layerButton.setAttribute("aria-expanded","false");if(state.activePrinciple){state.activePrinciple=null;clearHighlight()}}
    if(e.key==="/"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById("search").focus()}
    if(e.key==="ArrowLeft"&&document.activeElement===document.body)scrollToStage(state.currentStage-1);
    if(e.key==="ArrowRight"&&document.activeElement===document.body)scrollToStage(state.currentStage+1);
  });
  const search=document.getElementById("search");let st;
  search.addEventListener("input",()=>{clearTimeout(st);st=setTimeout(()=>runSearch(search.value),120)});
  search.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();cycleSearch()}});
  const sc=document.getElementById("scroll");let sct;
  sc.addEventListener("scroll",()=>{closePopup();clearTimeout(sct);sct=setTimeout(()=>{updateCurrentFromScroll();saveState()},90);requestAnimationFrame(drawLinks)},{passive:true});
  sc.addEventListener("pointerdown",e=>{
    if(e.button!==0||e.target.closest("button,input,.node,.layer-label,summary,.popup"))return;
    state.drag={x:e.clientX,left:sc.scrollLeft};sc.classList.add("dragging");sc.setPointerCapture(e.pointerId)
  });
  sc.addEventListener("pointermove",e=>{if(!state.drag)return;sc.scrollLeft=state.drag.left-(e.clientX-state.drag.x)});
  sc.addEventListener("pointerup",e=>{state.drag=null;sc.classList.remove("dragging");try{sc.releasePointerCapture(e.pointerId)}catch(_){}});
  window.addEventListener("resize",()=>{placePopup(state.popupAnchor);requestAnimationFrame(()=>requestAnimationFrame(()=>{syncCollapsedStageHeights();positionPhaseSeparators();drawLinks()}))});
  if(document.fonts?.ready)document.fonts.ready.then(()=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{positionPhaseSeparators();drawLinks()}))});
  new ResizeObserver(()=>requestAnimationFrame(()=>{positionPhaseSeparators();drawLinks()})).observe(document.getElementById("timeline"));
}
function init(){
  loadState();renderHeader();buildEdges();renderRows();bindUI();updatePosition();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{syncCollapsedStageHeights();positionPhaseSeparators();drawLinks()}));
  if(document.fonts?.ready)document.fonts.ready.then(()=>requestAnimationFrame(()=>{syncCollapsedStageHeights();positionPhaseSeparators();drawLinks()}));
}
init();
</script>
