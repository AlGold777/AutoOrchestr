<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Опросник</title>
<style>
:root{color-scheme:light;--line:#dbe2ea;--ink:#1e293b;--blue:#356fe0;--bg:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto}.attachments{display:flex;align-items:center;gap:9px;margin:0 0 10px;cursor:pointer;width:max-content;padding:0 95px 8px}.attachments input,.mark input{position:absolute;opacity:0;width:1px;height:1px}
h1{max-width:940px;margin:0 auto 12px;font-size:18px;line-height:1.25;font-weight:700;color:var(--ink)}
.round{width:19px;height:19px;border:2px solid #94a3b8;border-radius:50%;display:inline-grid;place-items:center;flex:none}.round:after{content:"";width:9px;height:9px;border-radius:50%;background:transparent}.attachments input:checked+.round,.mark input:checked+.round{border-color:var(--blue)}.attachments input:checked+.round:after,.mark input:checked+.round:after{background:var(--blue)}
.table-wrap{max-width:940px;margin-inline:auto;overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:860px;table-layout:fixed;border-collapse:collapse}th,td{padding:7.5px 5px;border-bottom:1px solid var(--line);text-align:center}th{font-size:12px;line-height:1.2;color:#475569;vertical-align:bottom;overflow-wrap:anywhere}th:first-child,td:first-child{text-align:left;width:13%;padding-left:42px;overflow-wrap:anywhere}th:not(:first-child){width:12.4%}tr:last-child td{border-bottom:0}.mark{display:inline-flex;align-items:center;justify-content:center;min-width:25px;min-height:25px;cursor:pointer}.mark.issue{gap:5px;white-space:normal;font-size:11px}.mark .issue-label{display:none}.mark.issue input:checked~.issue-label{display:inline}.mark.issue input:checked~.dash{display:none}.dash{font-size:18px;color:#64748b}.footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:8px auto 0;max-width:1100px}.actions{display:flex;justify-content:center;align-items:center;gap:8px}.actions button{min-height:32px;padding:5px 15px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:var(--ink);font:700 14px system-ui;cursor:pointer}.actions .save{background:var(--blue);border-color:var(--blue);color:#fff}.actions .copy{padding:0 6px;border:0;border-radius:0;background:transparent;color:#475569;font:400 25px/1 system-ui;min-width:30px}.actions .copy:hover{color:var(--blue)}.actions .save:hover{filter:brightness(.96)}.actions button:focus-visible,.mark:focus-within,.attachments:focus-within{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Зафиксированные визуально проблемы</h1>
  <label class="attachments"><input id="attachments" type="checkbox"><span class="round"></span><span>Вложенные файлы</span></label>
  <div class="table-wrap"><table id="observations"><thead><tr><th>LLM</th><th>Запрос не вставился</th><th>Запрос не отправился</th><th>Модель не сгенерировала ответ</th><th>Ответ не вставился в карточку</th><th>Ответ обрезан</th><th>Вложения не вставились</th><th>Вставились не все вложения</th></tr></thead><tbody></tbody></table></div>
  <div class="footer"><span aria-hidden="true"></span><div class="actions"><button class="save" id="save" type="button">Save</button><button class="copy" id="copy" type="button" aria-label="Копировать Markdown" title="Копировать Markdown">⧉</button></div><span aria-hidden="true"></span></div>
</main>
<script>
(() => {
  const models=['GPT','Claude','Qwen','Z.ai','Kimi','Gemini','Grok','DeepSeek','Le Chat','Perplexity'];
  const stages=['Запрос не вставился','Запрос не отправился','Модель не сгенерировала ответ','Ответ не вставился в карточку','Ответ обрезан','Вложения не вставились','Вставились не все вложения'];
  const body=document.querySelector('#observations tbody');
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  models.forEach(model=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${escapeHtml(model)}</td>`+stages.map((stage,si)=>{
      const aria=escapeHtml(`${model}: ${stage}`);
      if(si===2)return `<td><label class="mark issue" aria-label="${aria}"><input type="checkbox" data-model="${escapeHtml(model)}" data-stage="${escapeHtml(stage)}"><span class="round"></span><span class="dash">-</span><span class="issue-label">проблема платформы</span></label></td>`;
      return `<td><label class="mark" aria-label="${aria}"><input type="checkbox" data-model="${escapeHtml(model)}" data-stage="${escapeHtml(stage)}"><span class="round"></span></label></td>`;
    }).join('');
    body.appendChild(tr);
  });
  const markdown=()=>{
    const headers=['LLM',...stages];
    const lines=[];
    if(document.getElementById('attachments').checked) lines.push('Вложенные файлы: Да','');
    lines.push('| '+headers.join(' | ')+' |','| '+headers.map(()=> '---').join(' | ')+' |');
    [...body.rows].forEach(row=>{
      const vals=[row.cells[0].textContent.trim()];
      stages.forEach((stage,si)=>{
        const input=row.cells[si+1].querySelector('input');
        vals.push(input.checked?(si===2?'проблема платформы':'Да'):'');
      });
      if(vals.some((value,index)=>index>0&&value)) lines.push('| '+vals.join(' | ')+' |');
    });
    return lines.join('\n')+'\n';
  };
  document.getElementById('save').addEventListener('click',()=>{
    const blob=new Blob([markdown()],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='visual-observation-questionnaire.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.getElementById('copy').addEventListener('click',async()=>{
    const text=markdown();
    try{
      if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return;}
    }catch(_){ }
    const temp=document.createElement('textarea');temp.value=text;temp.setAttribute('readonly','');temp.style.position='fixed';temp.style.opacity='0';document.body.appendChild(temp);temp.select();
    try{document.execCommand('copy');}finally{temp.remove();}
  });
})();
</script>
</body>
</html>
