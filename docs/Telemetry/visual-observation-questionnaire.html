<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Опросник</title>
<style>
:root{color-scheme:light;--line:#dbe2ea;--ink:#1e293b;--blue:#356fe0;--bg:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto}.attachments{display:flex;align-items:center;gap:9px;margin:0 0 10px;cursor:pointer;width:max-content}.attachments input,.mark input{position:absolute;opacity:0;width:1px;height:1px}
.round{width:19px;height:19px;border:2px solid #94a3b8;border-radius:50%;display:inline-grid;place-items:center;flex:none}.round:after{content:"";width:9px;height:9px;border-radius:50%;background:transparent}.attachments input:checked+.round,.mark input:checked+.round{border-color:var(--blue)}.attachments input:checked+.round:after,.mark input:checked+.round:after{background:var(--blue)}
.table-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:850px;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}th{font-size:12px;color:#475569;vertical-align:bottom}th:first-child,td:first-child{text-align:left;min-width:175px}tr:last-child td{border-bottom:0}.mark{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;cursor:pointer}.mark.issue{gap:7px;white-space:nowrap;font-size:12px}.mark .issue-label{display:none}.mark.issue input:checked~.issue-label{display:inline}.mark.issue input:checked~.dash{display:none}.dash{font-size:18px;color:#64748b}.download{display:block;margin:12px 0 0 auto;border:0;background:transparent;color:#475569;padding:8px;cursor:pointer;border-radius:7px}.download:hover{background:#e8edf5}.download svg{width:20px;height:20px;display:block}.download:focus-visible,.mark:focus-within,.attachments:focus-within{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <label class="attachments"><input id="attachments" type="checkbox"><span class="round"></span><span>Вложенные файлы</span></label>
  <div class="table-wrap"><table id="observations"><thead><tr><th>LLM / этап</th><th>Запрос вставился</th><th>Запрос отправился</th><th>Модель не сгенерировала ответ</th><th>Ответ не вставился в карточку</th><th>Ответ обрезан</th></tr></thead><tbody></tbody></table></div>
  <button class="download" id="save" aria-label="Скачать Markdown" title="Скачать Markdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg></button>
</main>
<script>
(() => {
  const models=['GPT','Claude','Qwen','Z.ai','Kimi','Gemini','Grok','DeepSeek','Le Chat','Perplexity','Pipeline'];
  const stages=['Запрос вставился','Запрос отправился','Модель не сгенерировала ответ','Ответ не вставился в карточку','Ответ обрезан'];
  const body=document.querySelector('#observations tbody');
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  models.forEach((model,mi)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${model==='Pipeline'?'Pipeline':escapeHtml(model)}</td>`+stages.map((stage,si)=>{
      const aria=escapeHtml(`${model}: ${stage}`);
      if(si===2)return `<td><label class="mark issue" aria-label="${aria}"><input type="checkbox" data-model="${escapeHtml(model)}" data-stage="${escapeHtml(stage)}"><span class="round"></span><span class="dash">-</span><span class="issue-label">проблема платформы</span></label></td>`;
      return `<td><label class="mark" aria-label="${aria}"><input type="checkbox" data-model="${escapeHtml(model)}" data-stage="${escapeHtml(stage)}"><span class="round"></span></label></td>`;
    }).join('');
    body.appendChild(tr);
  });
  document.getElementById('save').addEventListener('click',()=>{
    const headers=['LLM / этап',...stages];
    const lines=['| '+headers.join(' | ')+' |','| '+headers.map(()=> '---').join(' | ')+' |'];
    const attachment=document.getElementById('attachments').checked?'Да':'Нет';
    lines.push('| Вложенные файлы: '+attachment+' | '+stages.map(()=> '—').join(' | ')+' |');
    [...body.rows].forEach(row=>{
      const vals=[row.cells[0].textContent.trim()];
      stages.forEach((stage,si)=>{
        const input=row.cells[si+1].querySelector('input');
        vals.push(si===2?(input.checked?'проблема платформы':'-'):(input.checked?'Да':'Нет'));
      });
      lines.push('| '+vals.join(' | ')+' |');
    });
    const blob=new Blob(['\ufeff'+lines.join('\n')+'\n'],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='visual-observation-questionnaire.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
})();
</script>
</body>
</html>
