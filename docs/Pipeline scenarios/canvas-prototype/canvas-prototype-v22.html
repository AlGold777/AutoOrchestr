<style>
@import url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css");

@font-face {
    font-family: "tabler-icons-filled";
    font-style: normal;
    font-weight: 400;
    src: url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/fonts/tabler-icons-filled.woff2?v3.44.0") format("woff2"),
         url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/fonts/tabler-icons-filled.woff?v3.44.0") format("woff"),
         url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/fonts/tabler-icons-filled.ttf?v3.44.0") format("truetype");
}

button i.ti {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-size: 16px;
}

:root {
    --text-color: #1a1a1a;
    --text-secondary-color: #6c757d;
    --border-color: #dee2e6;
    --primary-button-bg: #1a1a1a;
    --primary-button-text: #ffffff;
    --secondary-button-bg: #ffffff;
    --secondary-button-border: #ced4da;
    --accent-color: #f7a032;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --layout-gap: 18px;
    --center-max-width: 980px;
    --sidebar-left-width: 280px;
    --sidebar-left-min: 280px;
    --sidebar-left-max: 520px;
    --sidebar-right-width: 260px;
    --sidebar-bg: #ffffff;
    --sidebar-border: #e5e7eb;
    --notes-panel: #ffffff;
    --notes-panel-2: #f3f6fb;
    --notes-text: #111827;
    --notes-muted: #5b677a;
    --notes-border: rgba(17, 24, 39, 0.1);
    --notes-border-strong: rgba(17, 24, 39, 0.14);
    --notes-row-height: 34px;
    --pipeline-bg: #f8fafc;
    --pipeline-card: #ffffff;
    --pipeline-border: #e2e8f0;
    --pipeline-text: #0f172a;
    --pipeline-muted: #64748b;
    --pipeline-blue: #2563eb;
    --pipeline-blue-soft: #dbeafe;
    --pipeline-purple: #8b5cf6;
    --pipeline-purple-soft: #f3e8ff;
    --pipeline-green: #22c55e;
    --pipeline-green-soft: #dcfce7;
    --pipeline-orange: #f59e0b;
    --pipeline-connector: #cbd5e1;
    --pipeline-block-height: 59.52px;
    --pipeline-block-gap: 11px;
}

html {
    scrollbar-gutter: stable;
    overscroll-behavior-y: none;
}

body {
    background-color: #F3F4F6;
    font-family: var(--font-family);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    overflow-y: scroll;
    overscroll-behavior-y: none;
}

body, button, input, select, textarea {
    font-family: var(--font-family);
}

body.modal-open {
    overflow: hidden;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    text-align: center; 
}

.app-shell {
    display: grid;
    grid-template-columns: 0 minmax(0, 1fr) var(--sidebar-right-width);
    column-gap: 0;
    row-gap: var(--layout-gap);
    align-items: start;
    padding: 12px var(--layout-gap) 40px;
}

body.left-sidebar-open .app-shell {
    grid-template-columns: var(--sidebar-left-width) minmax(0, 1fr) var(--sidebar-right-width);
    padding-top: 0;
    padding-left: 0;
}

body.right-sidebar-open,
body:not(.right-sidebar-open) {
    --sidebar-right-width: 0px;
}

.app-main {
    min-width: 0;
}

.main-inner {
    max-width: var(--center-max-width);
    margin: 0 auto;
    width: 100%;
    padding: 0 16px 40px;
    box-sizing: border-box;
}

.app-main .container {
    max-width: 100%;
    margin: 0;
    padding: 0;
}

.app-sidebar {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    box-sizing: border-box;
    background: var(--sidebar-bg);
    border: 1px solid var(--sidebar-border);
    border-radius: 16px;
    padding: 14px 18px 18px;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.app-sidebar-left {
    transition: opacity 0.2s ease, transform 0.2s ease;
    position: sticky;
    top: 0;
    max-height: 100vh;
    height: 100vh;
    background: rgba(255, 255, 255, 0.92);
    border: none;
    border-right: 1px solid var(--notes-border);
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    gap: 0;
    color: var(--notes-text);
    backdrop-filter: blur(10px);
    overflow: hidden;
}

body:not(.left-sidebar-open) .app-sidebar-left {
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-12px);
}

.app-sidebar-right {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-height: none;
    padding: 12px var(--layout-gap) 40px;
    box-sizing: border-box;
    background: var(--pipeline-card);
    border: none;
    box-shadow: none;
    display: flex;
    justify-content: center;
    align-items: stretch;
    transition: transform 0.35s ease, opacity 0.2s ease;
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
    z-index: 1400;
    overflow-x: hidden;
    overflow-y: auto;
}

body.right-sidebar-open .app-sidebar-right {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

body.right-sidebar-closing .app-sidebar-right {
    transform: translateX(100%);
    opacity: 1;
    pointer-events: none;
}

body.right-sidebar-reset .app-sidebar-right {
    transition: none;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #111827;
}

.app-sidebar-left .sidebar-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 56px;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.2px;
}

.app-sidebar-left .sidebar-title {
    border: none;
    background: transparent;
    color: #111827;
    cursor: pointer;
    justify-self: start;
    padding: 0;
    font-size: 15px;
    font-weight: 750;
    letter-spacing: 0.2px;
    font-family: var(--font-family);
    line-height: 1.2;
    white-space: nowrap;
    text-align: left;
}

.sidebar-header-actions {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 56px;
    width: 56px;
    height: 32px;
    position: relative;
    justify-self: end;
}

.notes-header-action {
    position: absolute;
    top: 50%;
    left: 50%;
    flex: 0 0 auto;
    transform: translate(-50%, -50%);
}

.notes-top {
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--notes-border);
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(255, 255, 255, 0.98);
}

.notes-tabs-bar {
    display: flex;
    align-items: flex-end;
    gap: 0;
    background: transparent;
    min-height: 26px;
    flex: 0 0 auto;
}

.notes-tabs {
    display: flex;
    align-items: flex-end;
    gap: 0;
    overflow-x: auto;
    padding: 0 1px 0;
    margin-top: 5px;
    background: transparent;
    scrollbar-width: thin;
    flex: 1 1 auto;
    min-width: 0;
}

.notes-tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    min-width: 72px;
    max-width: 180px;
    padding: 0 12px;
    margin: 0 0 0 -8px;
    border: 1px solid var(--notes-border-strong);
    border-bottom: none;
    background: var(--notes-panel-2);
    color: var(--notes-text);
    font-size: 13px;
    line-height: 26px;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    z-index: 1;
    box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.75) inset;
}

.notes-tab:first-child {
    margin-left: 0;
}

.notes-tab.is-active {
    background: var(--notes-panel);
    border-color: rgba(17, 24, 39, 0.18);
    z-index: 3;
}

.notes-tab::before,
.notes-tab::after {
    content: "";
    position: absolute;
    top: -1px;
    width: 12px;
    height: 27px;
    background: inherit;
    border: 1px solid var(--notes-border-strong);
    border-bottom: none;
    z-index: -1;
}

.notes-tab::before {
    left: -7px;
    border-top-left-radius: 12px;
    border-right: none;
    transform: skewX(-18deg);
}

.notes-tab::after {
    right: -7px;
    border-top-right-radius: 12px;
    border-left: none;
    transform: skewX(18deg);
}

.notes-tab.is-active::before,
.notes-tab.is-active::after {
    border-color: rgba(17, 24, 39, 0.18);
}

.notes-tab:not(.is-active):hover {
    background: #e9eef8;
}

.notes-tab-label {
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notes-tab-close {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    font-size: 14px;
    line-height: 1;
    color: var(--notes-muted);
    opacity: 0;
    cursor: pointer;
    padding: 0 2px;
    pointer-events: none;
}

.notes-tab.is-close-visible .notes-tab-close {
    opacity: 1;
    pointer-events: auto;
}

.notes-tab.is-close-visible .notes-tab-label {
    padding-right: 16px;
}

.notes-tab.is-close-visible .notes-tab-input {
    padding-right: 22px;
}

.notes-tab-close:hover {
    color: var(--notes-text);
}

.notes-tab-input {
    width: 100%;
    height: 20px;
    margin-top: 2px;
    border: 1px solid rgba(17, 24, 39, 0.18);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 750;
    font-family: var(--font-family);
    background: var(--notes-panel);
    color: var(--notes-text);
    outline: none;
}

.notes-tab-add {
    width: 26px;
    height: 26px;
    min-width: 26px;
    max-width: 26px;
    margin-left: -3px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--notes-text);
    line-height: 24px;
    text-align: center;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    overflow: visible;
    z-index: 6;
    flex: 0 0 auto;
}

.notes-tab-add:hover {
    background: rgba(17, 24, 39, 0.03);
}

.sessions-action-btn {
    border: none;
    background: none;
    color: var(--notes-text);
    font-size: 14px;
    height: 32px;
    min-width: 32px;
    padding: 0 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.sessions-action-btn:hover {
    background: rgba(17, 24, 39, 0.04);
}

.sessions-save-btn {
    justify-self: start;
    width: 52px;
    padding: 0;
}
.sessions-delete-btn {
    display: none;
}

#notes-sidebar.is-sessions-active .sessions-delete-btn {
    display: inline-flex;
}

.sessions-panel {
    display: none;
    padding: 6px 0 0;
}

.sessions-list {
    display: flex;
    flex-direction: column;
    gap: 0;
}

.sessions-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: var(--notes-row-height);
    padding: 0 10px;
    border-top: 1px solid var(--notes-border);
    border-bottom: 1px solid var(--notes-border);
    background: rgba(255, 255, 255, 0.92);
    color: var(--notes-text);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
}

.sessions-item.is-selected {
    background: rgba(59, 130, 246, 0.12);
}

.sessions-item-current {
    font-weight: 750;
    background: rgba(17, 24, 39, 0.04);
    border-color: rgba(17, 24, 39, 0.12);
}

.sessions-item-current .sessions-item-name {
    color: #111827;
}

.sessions-item.is-dragging {
    opacity: 0.6;
}

.sessions-item.is-drop-before::before,
.sessions-item.is-drop-after::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    border-top: 2px dashed rgba(37, 99, 235, 0.35);
}

.sessions-item.is-drop-before::before {
    top: 0;
}

.sessions-item.is-drop-after::after {
    bottom: 0;
}

.sessions-item-name {
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

 .sessions-item-run {
    margin-left: auto;
    border: none;
    background: transparent;
    color: #455161b7;
    font-weight: 600;
    font-size: 12px;
    line-height: 1;
    padding: 0 6px 0 20px;
    cursor: pointer;
    transition: color 0.2s ease;
    transform: translateX(8px);
}

.sessions-item-run:hover {
    color: #111827;
}

.sessions-item-run.is-delete-armed {
    color: #dc2626;
    font-weight: 700;
}

.sessions-item-run.is-delete-armed:hover {
    color: #b91c1c;
}

.sessions-item.is-delete-armed {
    background: rgba(220, 38, 38, 0.06);
}

.sessions-item-input {
    width: 100%;
    height: 20px;
    border: 1px solid rgba(17, 24, 39, 0.18);
    border-radius: 6px;
    padding: 0 6px;
    font-size: 12px;
    font-family: var(--font-family);
    outline: none;
}

.sessions-empty {
    font-size: 12px;
    color: var(--notes-muted);
    text-align: center;
    border: 1px dashed rgba(17, 24, 39, 0.14);
    border-radius: 12px;
    padding: 10px;
    background: rgba(17, 24, 39, 0.02);
    margin: 8px;
}

#notes-sidebar.is-sessions-active .notes-tree,
#notes-sidebar.is-sessions-active .notes-empty {
    display: none;
}

#notes-sidebar.is-sessions-active #notes-delete-btn,
#notes-sidebar.is-sessions-active .notes-tabs-bar {
    display: none;
}

#notes-sidebar:not(.is-sessions-active) #sessions-delete-btn {
    display: none;
}

#notes-sidebar.is-sessions-active #notes-add-root,
#notes-sidebar:not(.is-sessions-active) #sessions-save-btn {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#notes-sidebar.is-sessions-active .sessions-panel {
    display: block;
}

#notes-sidebar.is-sessions-active .sidebar-title {
    color: #111827;
}

.notes-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 12px 12px;
    padding-left: 6px;
}
.notes-panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: auto;
    min-height: 0;
}

.notes-search {
    width: min(240px, 100%);
    border: 1px solid var(--notes-border-strong);
    border-radius: 12px;
    padding: 8px 30px 8px 10px;
    font-size: 12px;
    font-family: var(--font-family);
    background: rgba(17, 24, 39, 0.03);
    color: var(--notes-text);
}

.notes-search-clear {
    position: absolute;
    right: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #6b7280;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
}

.notes-search-clear svg {
    width: 14px;
    height: 14px;
}

.notes-search-clear.is-visible {
    opacity: 1;
    pointer-events: auto;
}

.notes-search-clear:hover {
    color: #111827;
}

.notes-search:focus {
    outline: none;
    border-color: rgba(17, 24, 39, 0.22);
    box-shadow: none;
}

.notes-backup-export-btn,
.notes-backup-import-btn {
    border: 1px solid rgba(17, 24, 39, 0.16);
    background: #fff;
    color: var(--notes-text);
    border-radius: 8px;
    font-size: 14px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.notes-backup-export-btn:hover,
.notes-backup-import-btn:hover {
    background: rgba(17, 24, 39, 0.04);
}

.notes-action-btn {
    height: 32px;
    min-width: 32px;
    padding: 7px 9px;
    border: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
    color: var(--notes-text);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
    user-select: none;
}

.notes-action-btn:hover {
    filter: brightness(1.05);
}

.notes-action-btn:active {
    transform: translateY(1px);
}

.notes-action-btn.is-ghost {
    box-shadow: none;
}

.notes-action-btn.notes-delete-btn {
    width: 32px;
    padding: 0;
    border-radius: 12px;
    font-size: 14px;
    line-height: 32px;
    text-align: center;
}

#notes-add-root {
    width: 32px;
    padding: 0;
    border-radius: 999px;
    font-size: 16px;
    line-height: 32px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18);
}

.notes-header-action:active {
    transform: translate(-50%, -50%) translateY(1px);
}

#notes-delete-btn {
    border: none;
    box-shadow: none;
}

.notes-tree {
    padding: 2px 0 10px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1 1 auto;
    min-height: 0;
    border: none;
    background: transparent;
    scrollbar-width: none;
}

.notes-tree::-webkit-scrollbar {
    width: 0;
    height: 0;
}

.notes-tree::-webkit-scrollbar-track,
.notes-tree::-webkit-scrollbar-thumb {
    background: transparent;
}

.notes-date-separator {
    /*margin: 10px 0 4px;*/
    margin-left: 1ch;
    padding: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--notes-muted);
    background-color: #cccccc33;
}

.notes-tree.is-drop-root {
    outline: 2px dashed rgba(37, 99, 235, 0.35);
    outline-offset: 6px;
    border-radius: 12px;
    background: transparent;
}

.notes-tree-item {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    text-align: left;
    position: relative;
    border: none;
    border-radius: 0;
    padding: 0;
    background: transparent;
    cursor: default;
    user-select: none;
    touch-action: none;
}

.notes-tree-row {
    display: flex;
    align-items: center;
    gap: 2px;
    height: var(--notes-row-height);
    padding: 0;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: none;
    cursor: default;
    border-top: 1px solid var(--notes-border);
    border-bottom: 1px solid var(--notes-border);
    width: 100%;
    box-sizing: border-box;
}

.notes-tree-main {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
}

.notes-tree-toggle {
    width: 16px;
    height: 16px;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.notes-tree-toggle::before {
    content: '';
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 6px solid #9ca3af;
    transition: transform 0.15s ease, border-left-color 0.15s ease;
    transform-origin: 40% 50%;
}

.notes-tree-item[aria-expanded="true"] > .notes-tree-row .notes-tree-toggle::before {
    transform: rotate(90deg);
    border-left-color: #6b7280;
}

.notes-tree-item[data-has-children="false"] > .notes-tree-row .notes-tree-toggle {

.notes-tree-add:hover {

.notes-tree-row:hover {

.notes-tree-item.is-active > .notes-tree-row {

.notes-tree-item.is-selected:not(.is-active) > .notes-tree-row {

.notes-tree-item.is-editing > .notes-tree-row {

.notes-tree:focus {

.pipeline-flow {
    display: flex;

}

.pipeline-flow #connectorToSynthesis {
    align-self: center;
}

/* The column stays on the top line with the round badges; only its stack is centred against the models. */
.pipeline-flow #synthesisColumn .model-stack {
    transform: translateY(var(--pipeline-terminal-offset, 0px));
}

.synthesis-capable[hidden],
.synthesizer-capable[hidden],
.registry-capable[hidden] {
    display: none !important;
}

/* Run progress (results.js syncPipelineRunStateVisuals). Blocks: pipeline-run-pending (gray, as
   .model-block.inactive), pipeline-run-running (blue outline pulsing), pipeline-run-done (permanent
   blue outline). Links into a stage: pipeline-link-pending (gray), pipeline-link-running (orange
   pulse), pipeline-link-done (permanent orange). Before the run everything is pending (gray). */
.pipeline-flow .model-block.pipeline-run-pending {
    border-color: #cbd5e1;
    background: #ffffff;
}

.pipeline-flow .model-block.pipeline-run-pending .model-name {
    color: #64748b;
}

.pipeline-flow .model-block.pipeline-run-done {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
}

.pipeline-flow .model-block.pipeline-run-running {
    border-color: #2563eb;
    animation: pipelineBlockPulse 1.4s ease-in-out infinite;
}

@keyframes pipelineBlockPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14); }
    50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
}

.pipeline-flow .connector-group.pipeline-link-pending .connector-line,
.pipeline-flow .connector-group.pipeline-link-pending .merge-line {
    stroke: var(--pipeline-connector);
    opacity: 0.85;
    animation: none;
    stroke-dasharray: none;
}

.pipeline-flow .connector-group.pipeline-link-pending .arrow-head {
    fill: var(--pipeline-connector);
    opacity: 0.85;
}

.pipeline-flow .connector-group.pipeline-link-done .connector-line:not(.inactive),
.pipeline-flow .connector-group.pipeline-link-done .merge-line {
    stroke: var(--pipeline-orange);
    animation: none;
    stroke-dasharray: none;
}

.pipeline-flow .connector-group.pipeline-link-done .arrow-head:not(.inactive) {
    fill: var(--pipeline-orange);
    animation: none;
}

.pipeline-flow .connector-group.pipeline-link-running .connector-line:not(.inactive),
.pipeline-flow .connector-group.pipeline-link-running .merge-line {
    stroke: var(--pipeline-orange);
    stroke-dasharray: none;
    animation: pipelineLinkPulse 1.2s ease-in-out infinite;
}

.pipeline-flow .connector-group.pipeline-link-running .arrow-head:not(.inactive) {
    fill: var(--pipeline-orange);
    animation: pipelineLinkPulse 1.2s ease-in-out infinite;
}

@keyframes pipelineLinkPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
    .pipeline-flow .model-block.pipeline-run-running,
    .pipeline-flow .connector-group.pipeline-link-running .connector-line,
    .pipeline-flow .connector-group.pipeline-link-running .merge-line,
    .pipeline-flow .connector-group.pipeline-link-running .arrow-head {
        animation: none;
    }
}

.pipeline-page .llm-controls {
    margin-top: 15px;
}

body:not(.pipeline-page) .app-main .container + .llm-controls {
    margin-top: clamp(-230px, calc(30px - 30dvh), -90px);
}

body:not(.pipeline-page) .app-main .container:has(#prefix-container:not(:empty), #suffix-container:not(:empty)) + .llm-controls {
    margin-top: 20px;
}

body:not(.pipeline-page) .app-main .container:has(#prefix-container:not(:empty), #suffix-container:not(:empty)) .input-section {
    display: block;
    min-height: 0;
    padding-top: clamp(120px, calc(50dvh - 164px), 260px);
}

/* До отправки поле ввода центрируется по вертикали, а .llm-controls подтянут
   вверх отрицательным margin под фиксированную высоту маленького поля. Когда
   поле авто-разрослось (.is-prompt-autogrown), это «подтягивание» приводило к
   наезду растущего .prompt-container на блоки ниже. Переходим к естественному
   потоку — как в режиме с чипами. (После отправки действуют .prompt-submitted
   правила, поэтому ограничиваемся :not(.prompt-submitted).) */
body:not(.pipeline-page):not(.prompt-submitted) .app-main .container:has(.prompt-container.is-prompt-autogrown) + .llm-controls {
    margin-top: 20px;
}

body:not(.pipeline-page):not(.prompt-submitted) .app-main .container:has(.prompt-container.is-prompt-autogrown) .input-section {
    display: block;
    min-height: 0;
    padding-top: clamp(120px, calc(50dvh - 164px), 260px);
}

body.prompt-submitted:not(.pipeline-page) .app-main .input-section {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    min-height: 0;
    /* Keep the prompt close to the sticky header once response cards appear. */
    padding-top: 5px;
    overflow-anchor: none;
}

/* A selected model must use the same top-flow layout before submission.
   The alignment helper may scroll the page once, but the layout itself must
   remain anchored at the header when the user returns to scrollTop = 0. */
body:not(.pipeline-page) .app-main .input-section:has(.prompt-container.has-selected-models) {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    min-height: 0;
    padding-top: 5px;
    overflow-anchor: none;
}

body.prompt-submitted:not(.pipeline-page) .prompt-container.prompt-sandwich:not(.debate-composer) {
    min-height: 102px;
    height: auto;
    max-height: none;
    justify-content: flex-start;
    /* Compact the space around the textarea without constraining the footer. */
    gap: 0;
    padding-top: 0;
    padding-bottom: 0;
}

body:not(.pipeline-page) .app-main .input-section:has(.prompt-container.has-selected-models) .prompt-container.prompt-sandwich:not(.debate-composer) {
    min-height: 102px;
    height: auto;
    max-height: none;
    justify-content: flex-start;
    gap: 0;
    padding-top: 0;
    padding-bottom: 0;
}

body.prompt-submitted:not(.pipeline-page) .app-main .container + .llm-controls,
body:not(.pipeline-page) .app-main .container:has(.prompt-container.has-selected-models) + .llm-controls,
body.prompt-submitted:not(.pipeline-page) .app-main .container:has(#prefix-container:not(:empty), #suffix-container:not(:empty)) + .llm-controls {

   экрана. Остальные карточки перетекают на освободившееся место; при
   сворачивании карточка снова занимает своё штатное место в сетке.
   Панель Favourite живёт в отдельной секции — её не трогаем. */

/* Scroll-to-end jump buttons: translucent circular arrows that appear on
   hover once a response overflows its fixed-height card, letting the user
   jump to the bottom and back to the top without dragging the internal
   scrollbar. Positioned relative to .llm-panel (not .output) so they stay
   fixed on screen instead of scrolling away with the content. The down and
   up buttons are independent — once scrolled past a small fragment of the
   top, the up arrow appears above the down arrow, so both can be visible
   at once while mid-scroll. */
.output-scroll-jump-btn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  width: 28px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(17, 24, 39, 0.4);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease, background-color 0.15s ease;
}

.output-scroll-jump-btn:hover {
  background: rgba(17, 24, 39, 0.65);
}

.output-scroll-jump-btn i {
  font-size: 15px;
  line-height: 1;
}

  bottom: 10px;
}

.output-scroll-jump-btn-up {
  top: var(--output-scroll-btn-top, 44px);
}

.llm-panel.has-scrollable-output.output-scroll-can-down:hover .output-scroll-jump-btn-down,
.llm-panel.has-scrollable-output.output-scroll-can-up:hover .output-scroll-jump-btn-up {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.prompt-container.prompt-sandwich {
    position: relative;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    box-sizing: border-box;
}
.pipeline-page .prompt-container.prompt-sandwich {

}
.prompt-container.prompt-sandwich.debate-composer {
    --prompt-sandwich-top-bias: 34px;
    padding: calc(10px + var(--prompt-sandwich-top-bias)) 10px 10px;
    min-height: calc(100dvh - 320px);
    justify-content: center;
}
.prompt-sandwich #prefix-container { order: 0; }
.prompt-sandwich .debate-sel-toolbar { order: 1; }
.prompt-sandwich textarea#prompt-input { order: 2; }
.prompt-sandwich .prompt-note-view { order: 3; }
.prompt-sandwich .debate-session-bar { order: 4; }
.prompt-sandwich .debate-model-cards { order: 5; }
.prompt-sandwich .moderator-input { order: 6; }
.prompt-sandwich #suffix-container { order: 7; }
.prompt-container.prompt-sandwich .prompt-footer-actions { order: 8; }
.prompt-container.prompt-sandwich.debate-composer .debate-session-bar {
    transform: translateY(-10px);
}
.prompt-container.prompt-sandwich.debate-composer:not(.has-debate-feed) {
    --prompt-sandwich-top-bias: 0px;
    gap: 0;
    min-height: 122px;
    height: 122px;
    max-height: 122px;
    flex-grow: 0;
    padding: 0;
}
.prompt-container.prompt-sandwich.debate-composer:not(.has-debate-feed) .debate-session-bar,
.prompt-container.prompt-sandwich.debate-composer:not(.has-debate-feed) .debate-model-cards {

}

    display: none;
    width: 28px;
    height: 28px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #64748b;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color .12s, background .12s, transform .08s;
}
.debate-composer-clear-btn:hover {
    color: #1f2937;
    background: rgba(0, 0, 0, 0.05);
}
.debate-composer-clear-btn:active {
    transform: scale(.96);
}
.prompt-container.prompt-sandwich.debate-composer:not(.has-debate-feed) .debate-composer-clear-btn {
    display: inline-flex;
}
/* Закрытая лента: при авто-росте поля модератора контейнер расширяется вместе
   с textarea (как .prompt-container на главной), а не остаётся фиксированным на
   122px — иначе текст вылезает за рамку. Нижняя граница 122px держит дефолт. */
.prompt-container.prompt-sandwich.debate-composer.is-prompt-autogrown:not(.has-debate-feed) {
    height: auto;
    max-height: none;
    min-height: 122px;
}
.prompt-container.prompt-sandwich.debate-composer.has-debate-feed {
    --prompt-sandwich-top-bias: 0px;
    min-height: calc(100dvh - 120px);
    justify-content: flex-start;
}
.pipeline-page .prompt-container.prompt-sandwich.debate-composer.has-debate-feed {
    gap: 3px;
    height: calc(100dvh - 120px);
    max-height: none;
    box-sizing: border-box;
}

}

}

    position: fixed;

    left: 50%;

    width: min(var(--center-max-width), calc(100vw - 32px));
    max-width: var(--center-max-width);
    height: calc(100vh - 32px);
    min-height: 0;
    max-height: calc(100vh - 32px);

}

    position: absolute;
    right: 0;
    top: 0;
    border-top: 9px solid #fff;
    border-left: 9px solid #9fc2ff;
}
.pasted-text-details { display: grid; gap: 3px; min-width: 0; }
.pasted-text-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pasted-text-meta { font-size: 11px; color: #818692; }
.pasted-text-restore {
    justify-self: start;
    margin: 5px 0 0 43px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid currentColor;
    background: transparent;
    color: #818692;
    font-size: 13px;
    cursor: pointer;
}
.pasted-text-remove {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #818692;
    font-size: 20px;
    cursor: pointer;
}
.pasted-text-remove:hover { background: #f1f3f7; color: #15171c; }
.pasted-text-open:focus-visible, .pasted-text-restore:focus-visible, .pasted-text-remove:focus-visible {
    outline: 2px solid #4387fa;
    outline-offset: 3px;
}
.pasted-text-dialog {
    width: min(720px, calc(100vw - 32px));
    max-height: calc(100dvh - 32px);
    box-sizing: border-box;
    padding: 22px;
    border: 1px solid #dedfe3;
    border-radius: 20px;
    background: #fff;
    color: #15171c;
    box-shadow: 0 20px 80px rgba(0, 0, 0, .2);
}
.pasted-text-dialog::backdrop { background: rgba(20, 25, 35, .35); }
.pasted-text-dialog-title { margin: 0 0 16px; font-size: 18px; }
.pasted-text-editor {
    display: block;
    width: 100%;
    height: min(52dvh, 440px);
    min-height: 120px;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #d6d9e0;
    border-radius: 10px;
    background: #fafbfc;
    color: #15171c;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical;
}
.pasted-text-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.pasted-text-dialog-actions button { padding: 8px 18px; border: 1px solid #d6d9e0; border-radius: 8px; background: #fff; cursor: pointer; }
.pasted-text-dialog-actions .pasted-text-save { border-color: #4387fa; background: #4387fa; color: #fff; }

.modifier-chip {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background-color: transparent;
    border: none;
    border-radius: 0;
    padding: 3px 0 4px 0;
    font-size: 14px;
    color: #4b5563ad;
    line-height: 1.4;
    text-align: left;
    width: 100%;
    box-sizing: border-box;
    cursor: default;
}
.modifier-chip .chip-content {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    flex: 1;
    min-width: 0;
}
.chip-modifier-title {
    font-weight: 600;
    color: #4b5563;
    flex-shrink: 0;
}
.chip-modifier-text {
    font-size: 14px;
    color: #4b5563b3;
    flex: 1;
    min-height: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
}
.modifier-chip.is-expanded .chip-modifier-text {
    -webkit-line-clamp: unset;
    overflow: visible;
    display: block;
}
.modifier-chip-prefix {
    border-bottom: 1px solid #d1d5db;
}
.modifier-chip-suffix {
    border-top: 1px solid #d1d5db;
    padding-top: 6px;
}
.modifier-chip .modifier-tooltip {
    bottom: calc(100% + 10px);
}
.modifier-chip .chip-remove-btn {
    background: none; border: none; border-radius: 50%; color: #868e967d; cursor: pointer;
    width: 20px; height: 20px;  /*margin-right: 30px; margin-top:-2px;*/ font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: background-color 0.2s; flex-shrink: 0; 
}
.modifier-chip .chip-remove-btn:hover { background-color: rgba(0,0,0,0.1); }

/* --- 2. Стили для блока выбора модификаторов (колонки и карточки) --- */

.modifiers-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    width: 100%;
    margin-top: 0;
    overflow: visible;
    max-height: 0;
    opacity: 0;
    padding: 0;
    pointer-events: none;
    transition: none;
}
.modifiers-section.is-open .modifiers-container {
    max-height: 2000px;
    opacity: 1;
    margin-top: 0;
    padding: 10px 14px 8px;
    pointer-events: auto;
    transition: none;
}
.modifiers-column {
    flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 1px;
}
.modifiers-column-title {
    font-size: 14px; font-weight: 600; color: #6c757d; text-align: center;
    margin-top: -1px; padding-bottom: 6px; border-bottom: 1px solid #dee2e6;
}
/*-- 3.1. Обновляем стили для выравнивания и адаптивности колонок --*/
.modifier-cards-wrapper {
    display: grid;
    --modifier-card-gap: 8px;
    --modifier-card-width: calc((100% - (2 * var(--modifier-card-gap))) / 3);
    grid-template-columns: repeat(3, minmax(0, var(--modifier-card-width)));
    column-gap: var(--modifier-card-gap);
    row-gap: 6px;
    width: 100%;
    align-items: start; /* Выравнивание по верху */
    grid-auto-rows: 130px; /* уменьшенная базовая высота ряда */
}
.modifier-group-card {
    display: flex;
    flex-direction: column;
    gap: 5px; /* Уменьшаем отступ с 8px до 4px */
    height: auto;
    transition: opacity 0.2s ease;
}
.modifier-group-title {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 500; color: #343a40;
    margin: 0; padding-left: 5px; min-height: 22px;
}
.modifier-group-title.has-selection {
    color: #f59f00;
}

.modifier-options {
    display: flex;
    flex-direction: column;
    gap: 4px; /* Уменьшаем отступ с 8px до 4px */
}
.modifier-checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
    user-select: none;
    position: relative;
}
.modifier-tooltip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translate(calc(-50% + var(--tooltip-shift, 0px)), 0);
    background: #f6f7f9;
    color: #1f2933;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.45;
    border: 1px solid rgba(15, 23, 42, 0.08);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.08s ease;
    width: clamp(220px, 40vw, 320px);
    max-width: 92vw;
    text-align: left;
    z-index: 1200;
    box-shadow: 0 6px 24px rgba(15, 23, 42, 0.18);
    backdrop-filter: blur(4px);
    white-space: normal;
}
.modifier-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translate(calc(-50% + var(--tooltip-shift, 0px)), 0);
    border-width: 6px 6px 0 6px;
    border-style: solid;
    border-color: #f6f7f9 transparent transparent transparent;
    filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.14));
}
.modifier-tooltip[data-position="below"] {
    bottom: auto;
    top: calc(100% + 8px);
}
.modifier-tooltip[data-position="below"]::after {
    top: auto;
    bottom: 100%;
    border-width: 0 6px 6px 6px;
    border-color: transparent transparent #f6f7f9 transparent;
    transform: translate(calc(-50% + var(--tooltip-shift, 0px)), 0);
}
.modifier-checkbox-label:hover .modifier-tooltip {
    opacity: 1;
    visibility: visible;
}
.modifier-chip:hover .modifier-tooltip {
    opacity: 1;
    visibility: visible;
}
.modifier-tooltip-title {
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 4px;
}
.modifier-tooltip-body {
    font-size: 13px;
    color: #1f2933;
    white-space: pre-wrap;
}
.modifier-checkbox-label.is-hidden { display: none; }
.modifier-group-card.is-expanded .modifier-checkbox-label.is-hidden { display: flex; }
.modifier-checkbox-label:hover { background-color: #f1f3f5; }

/*-- 1.1. Стабилизируем размер чекбокса для предотвращения "дёргания" --*/
.modifier-checkbox-label input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background-color: #fffafafb;
    cursor: pointer;
    outline: none;
    transition: background-color 0.2s, border-color 0.2s;
    flex-shrink: 0;
    box-sizing: border-box; /* Гарантирует, что итоговый размер элемента 20x20px */
}

.modifier-checkbox-label input[type="checkbox"]:checked {
    background-color: var(--accent-color);
    border-color: var(--accent-color); /* Граница становится того же цвета, что и фон, сохраняя размер */
    background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/*-- 1.1. Запрещаем переносы в именах модификаторов (одна строка) --*/
.modifier-checkbox-label span {
    font-size: 14px;
    color: #343a40;
    
    /* Свойства для запрета переносов и обрезки по одной строке */
    display: block;
    white-space: nowrap;
    overflow-wrap: normal;
    word-break: normal;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4; /* Слегка увеличиваем межстрочный интервал для читаемости */
    min-height: 20px; /* Гарантируем минимальную высоту для одной строки */
}

/* Pipeline feed layout. Session tabs are hidden (state holder only); the bar keeps
   the session actions. */
.debate-session-left[hidden] {
    display: none;
}
/* Short live signal in the card header row: one line, never wraps over the answer. */
.debate-model-card-header .debate-model-card-printing {
    margin: 0;
    max-width: 72px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px !important;
    line-height: 1;
}
/* Step 1: the feed overflows -> the moderator input shrinks to one line
   (it still grows while the user is typing in it). */
.pipeline-page .prompt-container.prompt-sandwich.debate-composer.is-feed-input-compact .moderator-input textarea#modTa:not(:focus) {
    height: 20px !important;
    overflow-y: hidden;
}
/* Step 2: the feed overflows and is scrolled down -> compact top bar. The feed box
   grows by the height the bar gave up (--pipeline-top-gain, measured in JS). */
.pipeline-page.pipeline-top-collapsed .top-control-bar {
    padding-top: 4px;
    padding-bottom: 4px;
    /* 7px closer to the screen edge and 7px closer to the input section. */
    top: 5px;
    margin: -7px 0 -11px 0;
}
.pipeline-page.pipeline-top-collapsed .top-control-bar::before {
    top: -5px;
    height: 5px;
}
.pipeline-page.pipeline-top-collapsed .top-control-bar .logo-badge,
.pipeline-page.pipeline-top-collapsed .top-control-bar .llm-button-label {

}
.pipeline-page.pipeline-top-collapsed .top-control-bar .models-row-header .llm-buttons {

    margin-top: 0;
}

}
.pipeline-page.pipeline-top-collapsed .top-control-bar .top-bar-right {

}
.pipeline-page.pipeline-top-collapsed .debate-session-bar {
    display: none;
}
.pipeline-page.pipeline-top-collapsed .top-bar-right .debate-session-actions {
    margin-right: 14px;
}
.pipeline-page.pipeline-top-collapsed .prompt-container.prompt-sandwich.debate-composer.has-debate-feed {
    height: calc(100dvh - 120px + var(--pipeline-top-gain, 0px));
}
/* Compact moderator input: the message header gives up 4px of padding (top and bottom). */
.pipeline-page .prompt-container.prompt-sandwich.debate-composer.has-debate-feed.is-feed-input-compact .msg-header {
    padding-top: 2px;
    padding-bottom: 0;
}

/* Pipeline page: the composer (and the feed in it) has one width with the feed closed or
   open, so the outline stays at the moderator input and does not move away from it. It is
   centered on the .main-inner column and bounded by the page column (.app-main is a size
   container), so open sidebars cannot be overlapped. */
.pipeline-page {
    --pipeline-main-max-width: calc(var(--center-max-width) - 32px);
}
.pipeline-page .app-main {
    container-type: inline-size;
}
.pipeline-page .prompt-container.prompt-sandwich:not(.is-debate-feed-wide-expanded) {
    --pipeline-composer-width: min(var(--pipeline-main-max-width), calc(100cqw - 32px));
    width: var(--pipeline-composer-width);
    max-width: none;
    margin-left: calc((100% - var(--pipeline-composer-width)) / 2);
}

/* The moderator input keeps one width in every state (feed closed/open, wide-expanded,
   sidebars, resizing): the closed 948px column minus the open composer's 10px padding and
   1px border on each side, so it fits inside the open composer without shrinking. */
.pipeline-page .prompt-container.prompt-sandwich.debate-composer .moderator-input {
    box-sizing: border-box;
    flex: 0 0 auto;
    align-self: center;
    width: min(calc(var(--center-max-width) - 54px), calc(100cqw - 54px));
    min-width: 0;
    max-width: none;
}

/* The closed Pipeline composer mirrors .main-inner's 980px outer width and
   16px side padding. Its moderator frame supplies the single visible border. */
.pipeline-page .prompt-container.prompt-sandwich.debate-composer:not(.has-debate-feed) {
    --pipeline-composer-width: min(calc(var(--center-max-width) - 32px), calc(100cqw - 32px));
    border: 0;
}
/* The main page compresses to 70px editor + 32px footer + 2px border after

/* code-block:start */
.code-block{margin:8px 0;border:1px solid #d0d7de;border-radius:8px;background:#f6f8fa;overflow:hidden;text-align:left}
.code-block-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;background:#eaeef2;border-bottom:1px solid #d0d7de;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#57606a;white-space:normal}
.code-block-header::before{content:attr(data-lang);text-transform:lowercase}
.code-block-copy{appearance:none;border:1px solid #d0d7de;background:#fff;color:#24292f;border-radius:6px;padding:2px 10px;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.code-block-copy::before{content:"Copy"}
.code-block-open,.code-block-download{appearance:none;border:1px solid #d0d7de;background:#fff;color:#24292f;border-radius:6px;padding:2px 10px;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.code-block-open{margin-left:auto}
.code-block-open::before{content:"Просмотр"}
.code-block-download::before{content:"Скачать"}
.code-block-open:hover,.code-block-download:hover{background:#f3f4f6}
.code-block-download.is-downloaded::before{content:"Скачано"}
.code-block-download.is-failed::before{content:"Не удалось"}
.code-block-header{gap:6px}
.code-block-views{margin-left:auto}
.code-block-views+.code-block-open{margin-left:0}
.code-block pre{counter-reset:none}
.code-block pre code::before,.code-block pre code::after{content:none}
.code-block-copy:hover{background:#f3f4f6}
.code-block-copy.is-copied::before{content:"Скопировано"}
.code-block-copy.is-failed::before{content:"Не удалось"}
.code-block pre{margin:0;padding:12px;background:transparent;border-radius:0;white-space:pre;overflow-x:auto;word-wrap:normal;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code-block pre code{font:inherit;white-space:inherit;background:transparent;padding:0}
.code-block.is-diagram .code-block-header::before{text-transform:capitalize}
.code-block-views{display:inline-flex;gap:0;margin-left:auto;margin-right:8px}
.code-block-view{appearance:none;border:1px solid #d0d7de;background:#fff;color:#24292f;padding:2px 10px;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.code-block-view[data-view="diagram"]{border-radius:6px 0 0 6px}
.code-block-view[data-view="code"]{border-radius:0 6px 6px 0;border-left:0}
.code-block-view[data-view="diagram"]::before{content:"Диаграмма"}
.code-block-view[data-view="code"]::before{content:"Код"}
.code-block[data-mode="diagram"] .code-block-view[data-view="diagram"],.code-block[data-mode="code"] .code-block-view[data-view="code"]{background:#dbe9ff;border-color:#8bb4f0}
.code-block.is-diagram:not([data-diagram="ready"]) .code-block-views{display:none}
/* visually hidden, not display:none: the source stays in the card text (innerText), which is what is copied and handed over */
.code-block.is-diagram{position:relative}
.code-block.is-diagram[data-mode="diagram"] pre{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:pre}
.code-block.is-diagram[data-mode="code"] .code-block-diagram:not([data-failed]){display:none}
/* the panel of a diagram drawn from mermaid source: light grey, rounded, centered, no border (the look of the diagrams: results/code-blocks.js diagramConfig) */
.code-block.is-diagram{border:0;background:transparent}
.code-block.is-diagram .code-block-header{background:transparent;border-bottom:0;padding:2px 4px}
.code-block-diagram{padding:16px 20px;background:#f1f1f1;border-radius:8px;text-align:center}
.code-block.is-diagram[data-diagram-theme="dark"] .code-block-diagram:not([data-failed]){background:#2b2b2b}
.code-block-diagram img{max-width:100%;height:auto;display:inline-block}
.code-block-diagram[data-failed]{padding:6px 12px;background:#fff4e5;color:#8a4b00;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left;border-bottom:1px solid #f0c78a}
.code-block-diagram[data-failed]::before{content:attr(data-note)}
/* the viewer (modal) of a code block */
.code-viewer-overlay{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.code-viewer{display:flex;flex-direction:column;width:100%;height:100%;max-width:1400px;background:#fff;color:#24292f;border:1px solid #d0d7de;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.code-viewer-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#eaeef2;border-bottom:1px solid #d0d7de;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.code-viewer-lang{font-weight:600;text-transform:lowercase}
.code-viewer-controls{margin-left:auto;display:inline-flex;gap:6px;flex-wrap:wrap}
.code-viewer-btn{appearance:none;border:1px solid #d0d7de;background:#fff;color:#24292f;border-radius:6px;padding:3px 12px;font:inherit;cursor:pointer}
.code-viewer-btn:hover{background:#f3f4f6}
.code-viewer-btn[aria-pressed="true"]{background:#dbe9ff;border-color:#8bb4f0}
.code-viewer-btn.is-copied,.code-viewer-btn.is-downloaded{background:#dcffe4;border-color:#8ad19a}
.code-viewer-btn.is-failed{background:#ffe5e5;border-color:#e09a9a}
.code-viewer-body{flex:1;min-height:0;overflow:auto;background:#fff}
.code-viewer-code{margin:0;padding:16px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;min-height:100%;box-sizing:border-box}
.code-viewer-code code{font:inherit;background:transparent;padding:0;white-space:inherit}
.code-viewer-frame{width:100%;height:100%;border:0;background:#fff;display:block}
.code-viewer-img{display:block;max-width:100%;max-height:100%;margin:16px auto;object-fit:contain}
.code-viewer-md{padding:16px 24px;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
.code-viewer-table{border-collapse:collapse;margin:16px;font:13px/1.4 system-ui,sans-serif}
.code-viewer-table th,.code-viewer-table td{border:1px solid #d0d7de;padding:4px 10px;text-align:left}
.code-viewer-table th{background:#f1f3f5}
.code-viewer-note{padding:6px 16px;background:#fff4e5;color:#8a4b00;font:12px/1.4 system-ui,sans-serif}
/* code-block:end */

/* Choice dialog (results/choice-dialog.js): a modal with any number of buttons and an optional text field. */
.choice-dialog {
  width: min(520px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid var(--border-color, #d0d7de);
  border-radius: 10px;
  background: var(--surface-color, #fff);
  color: var(--text-color, #1f2328);
}
.choice-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
.choice-dialog-title { margin: 0 0 8px; font-size: 16px; }
.choice-dialog-message { margin: 0 0 12px; white-space: pre-line; font-size: 14px; max-height: 50vh; overflow: auto; }
.choice-dialog-text {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 12px;
  font: inherit;
  font-size: 14px;
}
.choice-dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.choice-dialog-actions button { padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
.choice-dialog-choice { border: 1px solid var(--accent-color, #0969da); background: var(--accent-color, #0969da); color: #fff; }
.choice-dialog-cancel { border: 1px solid var(--border-color, #d0d7de); background: transparent; color: inherit; }
@media (max-width: 600px) {
  .choice-dialog { padding: 16px; }
  .choice-dialog-actions button { flex: 1 1 100%; }
}

}

    grid-area: 1 / 1;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;

    min-height: 0;
    min-width: 0;
    padding: 0;

    overflow: hidden;
    z-index: var(--pipeline-cover-z);
    transform: translateY(var(--pipeline-cover-y, 0px));
}
.pipeline-cover-card[data-cover-state="hidden"] { visibility: hidden; }
.pipeline-cover-card[data-cover-state="moving"] { pointer-events: none; }
.pipeline-cover-host > .pipeline-cover-card.is-expanded .debate-model-card-output {

    max-height: none;
    overflow-y: auto;
    overscroll-behavior-y: auto;
}
.pipeline-cover-host > .pipeline-cover-card .debate-model-card-header { flex-shrink: 0; }

    { ref: 'r1', order: '', input: '', task: '', role: 'None', models: ['Claude', 'GPT', 'Gemini'].map(protoModel), intermediateSynthesis: null,
      artifacts: [{ id: 'a1', title: 'Карта функций', version: 1 }, { id: 'a2', title: 'Список рисков', version: 2 }] },
    { ref: 'r2', order: '', input: '', task: '', role: 'None', models: ['Claude', 'GPT', 'Gemini'].map(protoModel), intermediateSynthesis: null,
      artifacts: [{ id: 'a3', title: 'План работ', version: 1 }] }
  ],
  final: { on: true, model: 'Claude', task: '', discipline: emptyDiscipline() },
  emptyDiscipline,
  protoModel,
  onChange() {}
};

</script>
<script>
// Stage card: the dialog that opens on a round badge of the pipeline canvas.
// buildModel is pure (unit-tested); render writes it with textContent only.
(function initStageCard(root) {
  'use strict';

  const STATUS = {
    gate: 'Ворота: решает модератор',
    pending: 'Ожидает',
    running: 'Выполняется',
    awaiting_participant: 'Ждёт участника',
    completed: 'Выполнен',
    failed: 'Ошибка',
    cancelled: 'Отменён'
  };
  const PURPOSE = {
    position: 'позиция', response: 'ответ', critique: 'критика', verification: 'проверка',
    evidence_review: 'разбор доказательств', synthesis: 'синтез', audit: 'аудит', human_judgment: 'решение модератора'
  };
  const WHO = {
    all: 'все модели независимо', lead: 'ведущая модель', review: 'проверяющая модель', gate: 'моделей нет — ворота'
  };
  const list = (value) => (Array.isArray(value) ? value.filter(Boolean).map(String) : []);

  // round: canvas round number; templateStage: ArchitectureFramework stage or null;
  // participants: [{ name, send }] from the round's model stack; stageRun: the engine's
  // stage instance for this round (or null before / outside a run).
  // roleChoice (Custom rounds only): { prompts: [{ id, label }], roles: [prompt id or ''] per block,
  // disabled, roundPrompt } — one select for the whole round; mixed roles show 'разные' until chosen.
  // The round's text field shows only while 'custom' is selected.
  // roleChoice.settings (the round card of Basic): { order, input, task } the owner set ('' = not set, inherited),
  // inheritedTask (the text the round would take), first (the first round: nothing to feed in), disabled.
  // They give the order of work, the input and the round's task.
  function buildModel({ round, templateStage = null, participants = [], stageRun = null, roleChoice = null } = {}) {
    const working = list(participants.filter((item) => item && item.send).map((item) => item.name));
    const waiting = list(participants.filter((item) => item && !item.send).map((item) => item.name));
    const gate = templateStage?.who === 'gate';
    const statusCode = gate && !stageRun ? 'gate' : String(stageRun?.status || 'pending');
    const model = {
      round: Number(round) || 0,
      title: templateStage ? `Этап ${templateStage.n} · ${templateStage.titleRu}` : `Этап ${round}`,
      subtitle: templateStage ? `${templateStage.phaseRu} · ${templateStage.title}` : '',
      badges: [],
      status: { code: statusCode, label: STATUS[statusCode] || statusCode },
      participants: { working, waiting },
      sections: [],
      instruction: templateStage?.instruction || ''
    };
    if (!templateStage) {
      if (roleChoice) {
        const roles = (Array.isArray(roleChoice.roles) ? roleChoice.roles : []).map((item) => String(item || ''));
        const distinct = [...new Set(roles)];
        const mixed = distinct.length > 1;
        model.role = {
          value: mixed ? 'mixed' : (distinct[0] || ''),
          disabled: Boolean(roleChoice.disabled),
          text: String(roleChoice.roundPrompt || ''),
          options: [
            ...(mixed ? [{ value: 'mixed', label: 'разные', disabled: true }] : []),
            { value: '', label: 'None' },
            ...(Array.isArray(roleChoice.prompts) ? roleChoice.prompts : []).map((prompt) => ({ value: String(prompt.id), label: String(prompt.label || prompt.id) }))
          ]
        };
        if (roleChoice.settings) {
          model.settings = settingsModel(roleChoice.settings, { ...roleChoice, enabledCount: working.length });
          if (model.settings.owner.checked) model.badges.push('владелец: одобрение');
        }
        return model;
      }
      model.sections.push({ title: 'Участники раунда', items: working.length ? working : ['никто не отправляет'] });
      return model;
    }
    model.badges.push(PURPOSE[templateStage.purpose] || templateStage.purpose);
    model.badges.push(WHO[templateStage.who] || templateStage.who);
    if (templateStage.independent) model.badges.push('независимый');
    if (templateStage.gate) model.badges.push(`ворота ${templateStage.gate}`);
    list(templateStage.roles).forEach((role) => model.badges.push(role));
    [
      ['Входы', templateStage.inputs],
      ['Что нужно сделать', templateStage.allowed],
      ['Чего делать нельзя', templateStage.forbidden],
      ['Правила', templateStage.rules]
    ].forEach(([title, items]) => {
      if (list(items).length) model.sections.push({ title, items: list(items) });
    });
    const result = [
      list(templateStage.creates).length ? `создаёт: ${list(templateStage.creates).join(', ')}` : '',
      list(templateStage.modifies).length ? `изменяет: ${list(templateStage.modifies).join(', ')}` : ''
    ].filter(Boolean);
    if (result.length) model.sections.push({ title: 'Результат (объекты схемы)', items: result });
    return model;
  }

  const ORDER_LABELS = { parallel: 'Параллельно', sequential: 'По очереди' };
  const INPUT_LABELS = { none: 'Ничего', previous: 'Ответы предыдущего шага', all: 'Всё принятое за все предыдущие шаги' };
  const STEPS_LABEL = 'Выбранные этапы';
  const REQUIRE_LABELS = { any: 'Любой ответ', all: 'Все включённые', count: 'Число' };
  const isPlain = (value) => Boolean(value) && typeof value === 'object' && !Array.isArray(value);

  // The input «выбранные этапы» (4.3): the owner's list of step refs keeps its order; entries that are not step refs
  // (a participant, an artifact written in JSON) stay in place. Returns the new list for the step ref.
  function stepsAfterToggle(current, ref, checked) {
    const list = Array.isArray(current) ? current.slice() : [];
    const at = list.indexOf(ref);
    if (checked && at < 0) list.push(ref);
    if (!checked && at >= 0) list.splice(at, 1);
    return list;
  }

  // The owner's edit of the output: name, form, sections (non-empty lines) and strictLength replace their values;
  // the other fields (format, requiredFields, artifacts, revisionOf) stay as they are. A json format has no sections.
  function outputAfterEdit(current = {}, edited = {}) {
    const next = { ...(isPlain(current) ? current : {}) };
    ['name', 'form', 'sections', 'strictLength'].forEach((key) => delete next[key]);
    if (String(edited.name || '').trim()) next.name = String(edited.name);
    if (String(edited.form || '').trim()) next.form = String(edited.form);
    const sections = list(edited.sections).map((line) => line.trim()).filter(Boolean);
    if (sections.length && next.format !== 'json') next.sections = sections;
    if (edited.strictLength === true) next.strictLength = true;
    return next;
  }

  // The fields of a step the card shows: input, require, owner, output. A draft is a choice the owner made in the card
  // that the schema does not hold yet («выбранные этапы» without a step, the number of required answers).
  function stepRestModel(settings = {}, { enabledCount = 0, drafts = {} } = {}) {
    const req = settings.require;
    const requireValue = typeof req === 'number' ? 'count' : (req === 'any' || req === 'all' ? req : (drafts.require === 'count' ? 'count' : ''));
    const output = isPlain(settings.output) ? settings.output : {};
    return {
      require: {
        value: requireValue,
        count: typeof req === 'number' ? req : '',
        max: Number(enabledCount) || 0,
        options: [
          { value: '', label: 'По умолчанию (любой ответ)' },
          { value: 'any', label: REQUIRE_LABELS.any },
          { value: 'all', label: REQUIRE_LABELS.all },
          { value: 'count', label: REQUIRE_LABELS.count }
        ]
      },
      owner: { checked: settings.owner === 'approve' },
      output: {
        name: String(output.name || ''),
        form: String(output.form || ''),
        sections: Array.isArray(output.sections) ? output.sections.map(String).join('\n') : '',
        strictLength: output.strictLength === true,
        json: output.format === 'json'
      }
    };
  }

  // The input of a step: `first` (the first round has nothing to feed in) gives null. An array of refs or a drafted
  // «steps» shows the choice «выбранные этапы» with the earlier steps; `kind` decides the other options.
  function stepInputModel(settings = {}, { kind = 'round', first = false, earlier = [], drafts = {} } = {}) {
    if (first && kind === 'round') return null;
    const input = Array.isArray(settings.input) ? settings.input : String(settings.input || '');
    const picked = Array.isArray(input) ? input : [];
    const defaultInput = kind === 'round' && first ? 'none' : 'previous';
    const stepsMode = Array.isArray(input) || input === 'steps' || drafts.input === 'steps';
    const refs = picked.filter((item) => typeof item === 'string');
    const options = [
      { value: '', label: `По умолчанию (${INPUT_LABELS[defaultInput].toLowerCase()})` },
      ...(kind === 'round' ? Object.entries(INPUT_LABELS).map(([value, label]) => ({ value, label })) : [{ value: 'previous', label: INPUT_LABELS.previous }]),
      { value: 'steps', label: STEPS_LABEL }
    ];
    return {
      value: stepsMode ? 'steps' : input,
      options,
      steps: earlier.map((item) => {
        const at = refs.indexOf(item.ref);
        return { ref: item.ref, label: item.label, disabled: !item.enabled, checked: at >= 0, number: at >= 0 ? at + 1 : 0 };
      }),
      objectRefs: picked.length - refs.length
    };
  }

  // The fields of a synthesis (its window): input, require, owner, output. Settings are the step's own fields.
  function stepFieldsModel({ kind = 'round', settings = {}, earlier = [], enabledCount = 0, drafts = {}, disabled = false } = {}) {
    return {
      disabled: Boolean(disabled),
      input: stepInputModel(settings, { kind, earlier, drafts }),
      ...stepRestModel(settings, { enabledCount, drafts })
    };
  }

  // The order, the input and the task of a round card; `first` and `inheritedTask` as before. The input of a later round
  // is the previous step by default, the first round has no input (null).
  function settingsModel(settings, { first = false, inheritedTask = '', disabled = false, earlier = [], enabledCount = 0, drafts = {} } = {}) {
    const order = String(settings.order || '');
    const input = stepInputModel(settings, { kind: 'round', first, earlier, drafts });
    const stepsMode = input?.value === 'steps';
    const defaultInput = first ? 'none' : 'previous';
    const effectiveInput = stepsMode ? 'steps' : (input?.value || defaultInput);
    return {
      disabled: Boolean(disabled),
      order: { value: order, options: [{ value: '', label: `По умолчанию (${ORDER_LABELS.parallel.toLowerCase()})` }, ...Object.entries(ORDER_LABELS).map(([value, label]) => ({ value, label }))] },
      input,
      // The task is always shown. With the input nothing only the task written here is sent (the shared one is not), so the
      // placeholder of the shared task stays empty and the label says so. «выбранные этапы» sends the step's answers, so the task goes.
      task: { value: String(settings.task || ''), placeholder: effectiveInput === 'none' ? '' : String(inheritedTask || ''), sent: effectiveInput !== 'none' },
      ...stepRestModel(settings, { enabledCount, drafts })
    };
  }

  // A select row of a card (order, input): the choice goes to emit(field, value).
  function choiceRow(container, field, label, data, emit) {
    const doc = container.ownerDocument;
    const select = el(doc, 'select', `stage-card-${field}-select`);
    data.options.forEach((item) => { const option = el(doc, 'option', '', item.label); option.value = item.value; select.append(option); });
    select.value = data.value;
    select.disabled = Boolean(data.disabled);
    select.addEventListener('change', () => emit(field, select.value));
    const wrap = el(doc, 'label', `stage-card-setting stage-card-${field}`);
    wrap.append(doc.createTextNode(`${label} `), select);
    container.append(wrap);
  }

  // The list of steps of the input «выбранные этапы». emit('steps', { ref, checked }) — the page keeps the order of choice.
  // The number is the place of the step in the owner's list; a switched-off step is marked, not hidden.
  function renderSteps(container, input, emit, disabled = false) {
    const doc = container.ownerDocument;
    const box = el(doc, 'fieldset', 'stage-card-steps');
    box.append(el(doc, 'legend', '', 'Этапы для входа (номер — порядок выбора)'));
    if (!input.steps.length) box.append(el(doc, 'p', 'stage-card-muted', 'Раньше этих шагов нет.'));
    input.steps.forEach((item) => {
      const row = el(doc, 'label', 'stage-card-step-option');
      const check = el(doc, 'input');
      check.type = 'checkbox';
      check.checked = item.checked;
      check.disabled = Boolean(disabled);
      check.addEventListener('change', () => emit('steps', { ref: item.ref, checked: check.checked }));
      row.append(check, doc.createTextNode(` ${item.label}${item.disabled ? ' (выключен)' : ''}${item.number ? ` · ${item.number}` : ''}`));
      box.append(row);
    });
    if (input.objectRefs) box.append(el(doc, 'p', 'stage-card-muted', `Ссылки на участников и артефакты (${input.objectRefs}) заданы в JSON и сохраняются.`));
    container.append(box);
  }

  // The fields after the task: how many answers are needed, the owner's approval, the output of the step.
  // A number of answers goes to emit('require', n) only when it is typed; 'count' is the choice of a number.
  function renderRest(container, fields, emit) {
    const doc = container.ownerDocument;
    const disabled = Boolean(fields.disabled);
    const requireSelect = el(doc, 'select', 'stage-card-require-select');
    fields.require.options.forEach((item) => { const option = el(doc, 'option', '', item.label); option.value = item.value; requireSelect.append(option); });
    requireSelect.value = fields.require.value;
    requireSelect.disabled = disabled;
    requireSelect.addEventListener('change', () => emit('require', requireSelect.value));
    const requireWrap = el(doc, 'label', 'stage-card-setting stage-card-require');
    requireWrap.append(doc.createTextNode('Сколько ответов нужно '), requireSelect);
    if (fields.require.value === 'count') {
      const count = el(doc, 'input', 'stage-card-require-count');
      count.type = 'number';
      count.min = '1';
      count.max = String(fields.require.max);
      count.step = '1';
      count.value = fields.require.count === '' ? '' : String(fields.require.count);
      count.disabled = disabled;
      count.setAttribute('aria-label', 'Число ответов');
      count.addEventListener('change', () => { if (count.value !== '') emit('require', Number(count.value)); });
      requireWrap.append(count, doc.createTextNode(` из ${fields.require.max}`));
    }
    container.append(requireWrap);

    const ownerBox = el(doc, 'input', 'stage-card-owner-check');
    ownerBox.type = 'checkbox';
    ownerBox.checked = fields.owner.checked;
    ownerBox.disabled = disabled;
    ownerBox.addEventListener('change', () => emit('owner', ownerBox.checked ? 'approve' : ''));
    const ownerWrap = el(doc, 'label', 'stage-card-setting stage-card-owner');
    ownerWrap.append(ownerBox, doc.createTextNode(' Спросить владельца после этапа'));
    container.append(ownerWrap);

    const output = fields.output;
    const group = el(doc, 'section', 'stage-card-output');
    group.append(el(doc, 'h3', '', 'Выход этапа'));
    const nameInput = el(doc, 'input', 'stage-card-output-name');
    nameInput.type = 'text';
    nameInput.value = output.name;
    nameInput.disabled = disabled;
    nameInput.setAttribute('aria-label', 'Имя результата');
    const formArea = el(doc, 'textarea', 'stage-card-output-form');
    formArea.rows = 2;
    formArea.value = output.form;
    formArea.disabled = disabled;
    formArea.setAttribute('aria-label', 'Форма ответа');
    const sectionsArea = el(doc, 'textarea', 'stage-card-output-sections');
    sectionsArea.rows = 3;
    sectionsArea.value = output.sections;
    sectionsArea.disabled = disabled || output.json;
    sectionsArea.setAttribute('aria-label', 'Разделы ответа, по одному на строку');
    const strict = el(doc, 'input', 'stage-card-output-strict');
    strict.type = 'checkbox';
    strict.checked = output.strictLength;
    strict.disabled = disabled;
    const emitOutput = () => emit('output', { name: nameInput.value, form: formArea.value, sections: sectionsArea.value.split('\n'), strictLength: strict.checked });
    [[nameInput, 'Имя результата'], [formArea, 'Форма ответа'], [sectionsArea, 'Разделы ответа (по одному на строку)']].forEach(([node, text]) => {
      const wrap = el(doc, 'label', 'stage-card-output-field');
      wrap.append(doc.createTextNode(`${text} `), node);
      group.append(wrap);
      node.addEventListener('change', emitOutput);
    });
    const strictWrap = el(doc, 'label', 'stage-card-output-field');
    strictWrap.append(strict, doc.createTextNode(' Строгая длина (предел слов)'));
    group.append(strictWrap);
    strict.addEventListener('change', emitOutput);
    if (output.json) group.append(el(doc, 'p', 'stage-card-muted', 'Формат json: заголовки не проверяются, поля задаются в схеме (requiredFields).'));
    container.append(group);
  }

  // The window of a synthesis: its input (with the steps list), then the same fields as a round card has after its task.
  function renderStepFields(container, fields, onField) {
    const emit = (field, value) => { if (typeof onField === 'function') onField(field, value); };
    if (fields.input) {
      choiceRow(container, 'input', 'Вход синтеза', { ...fields.input, disabled: fields.disabled }, emit);
      if (fields.input.value === 'steps') renderSteps(container, fields.input, emit, fields.disabled);
    }
    renderRest(container, fields, emit);
  }

  const el = (documentRef, tag, className, text) => {
    const node = documentRef.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };

  function render(container, model, { onCopy = null, onRole = null, onRoundPrompt = null, onSetting = null, addControl = null } = {}) {
    const doc = container.ownerDocument;
    container.replaceChildren();
    if (model.subtitle) container.append(el(doc, 'p', 'stage-card-subtitle', model.subtitle));
    const meta = el(doc, 'div', 'stage-card-badges');
    model.badges.forEach((badge) => meta.append(el(doc, 'span', 'stage-card-badge', badge)));
    meta.append(el(doc, 'span', `stage-card-badge stage-card-status stage-card-status-${model.status.code}`, model.status.label));
    container.append(meta);

    if (model.role) {
      const select = el(doc, 'select', 'stage-card-role-select');
      model.role.options.forEach((item) => {
        const option = el(doc, 'option', '', item.label);
        option.value = item.value;
        option.disabled = Boolean(item.disabled);
        select.append(option);
      });
      select.value = model.role.value;
      select.disabled = model.role.disabled;
      const area = el(doc, 'textarea', 'stage-card-role-prompt');
      area.value = model.role.text;
      area.rows = 3;
      area.spellcheck = false;
      area.disabled = model.role.disabled;
      area.hidden = model.role.value !== 'custom';
      area.setAttribute('aria-label', 'Текст Custom для всех моделей раунда');
      area.addEventListener('change', () => { if (typeof onRoundPrompt === 'function') onRoundPrompt(area.value); });
      // The text field follows the choice; a replacement the owner cancels hides it again.
      select.addEventListener('change', async () => {
        area.hidden = select.value !== 'custom';
        if (typeof onRole === 'function') await onRole(select);
        area.hidden = select.value !== 'custom';
      });
      const row = el(doc, 'label', 'stage-card-role');
      row.append(doc.createTextNode('Роль для всех моделей раунда '), select);
      container.append(row, area);
      if (model.settings) {
        const settings = model.settings;
        const emit = (field, value) => { if (typeof onSetting === 'function') onSetting(field, value); };
        choiceRow(container, 'order', 'Порядок работы', { ...settings.order, disabled: settings.disabled }, emit);
        if (settings.input) choiceRow(container, 'input', 'Вход раунда', { ...settings.input, disabled: settings.disabled }, emit);
        if (settings.input?.value === 'steps') renderSteps(container, settings.input, emit, settings.disabled);
        if (settings.task) {
          const area = el(doc, 'textarea', 'stage-card-task');
          area.value = settings.task.value;
          area.placeholder = settings.task.placeholder;
          area.rows = 3;
          area.spellcheck = false;
          area.disabled = settings.disabled;
          area.setAttribute('aria-label', 'Задание раунда');
          area.addEventListener('change', () => emit('task', area.value));
          const wrap = el(doc, 'label', 'stage-card-setting stage-card-task-label');
          wrap.append(doc.createTextNode(settings.task.sent ? 'Задание раунда (пусто — общее) ' : 'Задание раунда (при входе «ничего» отправляется только оно) '), area);
          container.append(wrap);
        }
        renderRest(container, settings, emit);
        if (addControl) renderAddControl(container, addControl);
      }
    } else {
      const people = el(doc, 'div', 'stage-card-people');
      if (model.participants.working.length) {
        people.append(el(doc, 'strong', '', 'Работают: '), doc.createTextNode(model.participants.working.join(', ')));
      } else {
        people.append(el(doc, 'strong', '', 'Работают: '), doc.createTextNode('никто'));
      }
      if (model.participants.waiting.length) {
        people.append(doc.createElement('br'), el(doc, 'span', 'stage-card-muted', `Не участвуют: ${model.participants.waiting.join(', ')}`));
      }
      container.append(people);
    }

    model.sections.forEach((section) => {
      const block = el(doc, 'section', 'stage-card-section');
      block.append(el(doc, 'h3', '', section.title));
      const ul = el(doc, 'ul');
      section.items.forEach((item) => ul.append(el(doc, 'li', '', item)));
      block.append(ul);
      container.append(block);
    });

    if (model.instruction) {
      const block = el(doc, 'section', 'stage-card-section');
      const head = el(doc, 'h3', '', 'Задание, которое получает модель');
      block.append(head, el(doc, 'pre', 'stage-card-instruction', model.instruction));
      if (typeof onCopy === 'function') {
        const copy = el(doc, 'button', 'stage-card-copy', 'Копировать задание');
        copy.type = 'button';
        copy.addEventListener('click', () => onCopy(model.instruction));
        block.append(copy);
      }
      container.append(block);
    }
  }

  // The run feed of Basic (results.js): pure texts of the events and of the answer cards. Old events without the
  // new fields give the same text as before; a participant id equal to the model name is not repeated.
  const ROUTE_REASON = {
    rule: 'по правилу', otherwise: 'иначе', model: 'выбрала модель', owner: 'выбрал владелец',
    conflict_first: 'первый из подходящих', conflict_owner: 'выбрал владелец из подходящих',
    invalid_route: 'ответ модели не распознан, выбрал владелец'
  };
  const feed = Object.freeze({
    // The label of an answer card: the step, the participant (when it is not the model) and the visit (from the second).
    role({ label = '', modelName = '', participantId = '', visit = 1 } = {}) {
      const parts = [`Basic · ${label}`];
      if (participantId && participantId !== modelName) parts.push(`участник ${participantId}`);
      if (Number(visit) > 1) parts.push(`заход ${visit}`);
      return parts.join(' · ');
    },
    gate({ ref = '', pass = false, unmet = [] } = {}) {
      const head = `Проверка ${ref}: ${pass ? 'пройдена' : 'не пройдена'}`;
      return !pass && unmet.length ? `${head}. Не выполнено: ${unmet.join('; ')}` : head;
    },
    route({ ref = '', caseLabel = '', reason = '' } = {}) {
      return `Маршрут ${ref}: вариант «${caseLabel}», ${ROUTE_REASON[reason] || reason}`;
    },
    // stopText: the text of a stop reason (the engine's STOP_TEXT); a limit names its count.
    transition({ from = '', to = '', action = 'goto', count = null, maxLoops = null, reason = '' } = {}, stopText = (value) => value) {

    },
    // The title of an artifact in the registry: name, participant (owner for an owner step), visit, validity.
    artifactTitle({ name = '', source = {}, valid = true } = {}) {

  // Control steps (6.1–6.3 of the spec): a gate, a route and an owner are cards on the canvas. A window edits only the fields

  function transitionAfterEdit(current, edit = {}, kind = 'action') {

  // The window of a gate: criteria (one per line), its checkers (the available models; an unchecked one stays in the

  function gateWindowModel(step = {}, { names = [], refs = [], disabled = false } = {}) {

  // An edit of a gate: { field: 'criteria', value } | { field: 'checker', name, checked } | { field: 'pass', value } |

  function gateAfterEdit(step = {}, edit = {}) {

      else if (at >= 0) models[at].enabled = false;

  }

  // The window's controls: a select of a transition with its target (a ref of the canvas) and the number of loops.

  // The window of a gate. Every change goes to emit(edit) with the edit's field (see gateAfterEdit).

  // The window of a route (6.2). `by` rule reads the step's input (the sources numbered in the conditions); model gives the

  const ROUTE_BY_LABELS = [['', '— выберите —'], ['rule', 'По правилу (условие на данных)'], ['model', 'Выбирает модель'], ['owner', 'Выбирает владелец']];
  const ROUTE_CONFLICT_LABELS = [['', 'По умолчанию: остановить'], ['first', 'Первый подходящий'], ['owner', 'Выбирает владелец']];

  // The sources of a rule: the answers of the participants of the steps before this one (`earlier`: [{ ref, label,

  const isParticipantSource = (src) => isPlain(src) && typeof src.step === 'string' && 'participant' in src && !('artifact' in src);
  function routeWindowModel(step = {}, { names = [], refs = [], earlier = [], disabled = false } = {}) {

      ref: String(step.ref || ''),
      disabled: Boolean(disabled),
      refs: refs.map(String).filter((ref) => ref !== String(step.ref || '')),
      by: typeof select.by === 'string' ? select.by : '',

  // An edit of a route: { field: 'by', value } | { field: 'model', value } | { field: 'task', value } | { field: 'conflict', value } |
  // { field: 'source', step, participant, checked } | { field: 'otherwise', mode, goto, maxLoops, stop } | { field: 'caseAdd' } | { field: 'caseRemove', index } |
  // { field: 'case', index, id, label, when (null: none; undefined: kept), action: { mode, goto, maxLoops, stop } }.
  // Changing `by` drops what the new kind does not have: the conditions and the otherwise away from a rule, the models

  function routeAfterEdit(step = {}, edit = {}) {

    } else if (edit.field === 'case' && cases[Number(edit.index)]) {

      const current = cases[at];

      if (String(edit.label ?? '').trim()) updated.label = String(edit.label);
      if (current.when !== undefined) updated.when = current.when;
      if (edit.when === null) delete updated.when;
      else if (isPlain(edit.when)) {

        if (edit.when.op !== 'exists') cond.value = edit.when.op === 'in' ? parseList(edit.when.value) : parseValue(String(edit.when.value ?? ''));

      cases[at] = updated;

    next.select = select;
