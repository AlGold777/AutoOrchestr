  }
  // The window of a route: the choice, the model and the task (model), the conditions and the cases with their actions,

  function renderRouteWindow(container, model, emit) {

      if (!model.sources.length) sources.append(el(doc, 'p', 'stage-card-muted', 'Раньше нет участников с ответами.'));

        if (item.composite) box.append(el(doc, 'p', 'stage-card-muted', 'Составное условие (all/any): сохраняется как есть, в JSON.'));
        else {
          const when = item.when || { source: '', pointer: '', op: 'eq', value: '' };
          const source = el(doc, 'input', 'stage-card-case-source');
          source.type = 'number'; source.min = '0'; source.step = '1'; source.value = String(when.source); source.disabled = disabled;
          source.setAttribute('aria-label', 'Источник: номер входа');
          const pointer = el(doc, 'input', 'stage-card-case-pointer');
          pointer.type = 'text'; pointer.value = when.pointer; pointer.placeholder = '/route'; pointer.disabled = disabled;
          pointer.setAttribute('aria-label', 'Указатель JSON');
          const op = el(doc, 'select', 'stage-card-case-op');
          ROUTE_OPS.forEach((value) => { const option = el(doc, 'option', '', value); option.value = value; op.append(option); });
          op.value = when.op; op.disabled = disabled; op.setAttribute('aria-label', 'Оператор условия');
          const value = el(doc, 'input', 'stage-card-case-value');
          value.type = 'text'; value.value = when.value; value.disabled = disabled || when.op === 'exists';
          value.placeholder = when.op === 'in' ? 'значения через запятую' : 'значение (текст или JSON)';
          value.setAttribute('aria-label', 'Значение условия');
          const condition = () => ({ source: source.value, pointer: pointer.value, op: op.value, value: value.value });
          const onCondition = () => { state.when = condition(); value.disabled = op.value === 'exists'; sendCase(index, state); };
          source.addEventListener('change', onCondition);
          pointer.addEventListener('change', onCondition);
          op.addEventListener('change', onCondition);
          value.addEventListener('change', onCondition);
          box.append(source, pointer, op, value);
        }
      }
      renderTransition(box, { field: `case${index}`, label: 'Действие варианта', view: item.action, refs: model.refs, disabled, withStop: true,
        options: [{ value: 'goto', label: 'Перейти к шагу' }, { value: 'stop', label: 'Остановить прогон' }, { value: 'return', label: 'Вернуться' }],
        emit: (payload) => { state.action = { mode: payload.mode, goto: payload.goto, maxLoops: payload.maxLoops, stop: payload.stop }; sendCase(index, state); } });
      const remove = el(doc, 'button', 'stage-card-case-remove', '×');
      remove.type = 'button'; remove.disabled = disabled; remove.setAttribute('aria-label', 'Удалить вариант');
      remove.addEventListener('click', () => send({ field: 'caseRemove', index }));
      box.append(remove);
      cases.append(box);
    });
    const add = el(doc, 'button', 'stage-card-case-add', '+ вариант');
    add.type = 'button'; add.disabled = disabled;
    add.addEventListener('click', () => send({ field: 'caseAdd' }));
    cases.append(add);
    container.append(cases);
    if (model.by === 'rule') {
      renderTransition(container, { field: 'otherwise', label: 'Если ни один не подошёл', view: model.otherwise, refs: model.refs, disabled, withStop: true, emit: send,
        options: [{ value: 'none', label: 'Нет: ошибка маршрута' }, { value: 'goto', label: 'Перейти к шагу' }, { value: 'stop', label: 'Остановить прогон' }, { value: 'return', label: 'Вернуться' }] });
    }
  }

  // The window of an owner (6.1 of the spec, 8.1): the task the owner has to provide and the output of the step (as the round
  // windows have it). The input of an owner is not edited here; it stays as the schema has it.
  function ownerWindowModel(step = {}, { disabled = false } = {}) {
    const output = isPlain(step.output) ? step.output : {};
    return {
      ref: String(step.ref || ''),
      disabled: Boolean(disabled),
      task: typeof step.task === 'string' ? step.task : '',
      output: {
        name: String(output.name || ''),
        form: String(output.form || ''),
        sections: Array.isArray(output.sections) ? output.sections.map(String).join('\n') : '',
        strictLength: output.strictLength === true,
        json: output.format === 'json'
      }
    };
  }
  // An edit of an owner: { field: 'task', value } | { field: 'output', value: { name, form, sections (lines), strictLength } }.
  function ownerAfterEdit(step = {}, edit = {}) {
    const next = { ...step };
    if (edit.field === 'task') {
      if (String(edit.value || '').trim()) next.task = String(edit.value);
      else delete next.task;
    } else if (edit.field === 'output') {
      const output = outputAfterEdit(step.output, edit.value);
      if (Object.keys(output).length) next.output = output;
      else delete next.output;
    }
    return next;
  }
  // The window of an owner. A change goes to emit(edit) with the field (see ownerAfterEdit).
  function renderOwnerWindow(container, model, emit) {
    const doc = container.ownerDocument;
    const disabled = Boolean(model.disabled);
    const send = (edit) => { if (typeof emit === 'function') emit(edit); };
    const task = el(doc, 'textarea', 'stage-card-owner-task');
    task.rows = 4; task.value = model.task; task.disabled = disabled; task.spellcheck = false;
    task.setAttribute('aria-label', 'Что должен предоставить владелец');
    task.addEventListener('change', () => send({ field: 'task', value: task.value }));
    const taskWrap = el(doc, 'label', 'stage-card-setting stage-card-owner-task-label');
    taskWrap.append(doc.createTextNode('Что должен предоставить владелец '), task);
    container.append(taskWrap);

    const output = model.output;
    const group = el(doc, 'section', 'stage-card-output');
    group.append(el(doc, 'h3', '', 'Выход этапа'));
    const name = el(doc, 'input', 'stage-card-output-name');
    name.type = 'text'; name.value = output.name; name.disabled = disabled; name.setAttribute('aria-label', 'Имя результата');
    const form = el(doc, 'textarea', 'stage-card-output-form');
    form.rows = 2; form.value = output.form; form.disabled = disabled; form.setAttribute('aria-label', 'Форма ответа');
    const sections = el(doc, 'textarea', 'stage-card-output-sections');
    sections.rows = 3; sections.value = output.sections; sections.disabled = disabled || output.json;
    sections.setAttribute('aria-label', 'Разделы ответа, по одному на строку');
    const strict = el(doc, 'input', 'stage-card-output-strict');
    strict.type = 'checkbox'; strict.checked = output.strictLength; strict.disabled = disabled;
    const emitOutput = () => send({ field: 'output', value: { name: name.value, form: form.value, sections: sections.value.split('\n'), strictLength: strict.checked } });
    [[name, 'Имя результата'], [form, 'Форма ответа'], [sections, 'Разделы ответа (по одному на строку)']].forEach(([node, text]) => {
      const wrap = el(doc, 'label', 'stage-card-output-field');
      wrap.append(doc.createTextNode(`${text} `), node);
      group.append(wrap);
      node.addEventListener('change', emitOutput);
    });
    const strictWrap = el(doc, 'label', 'stage-card-output-field');
    strictWrap.append(strict, doc.createTextNode(' Строгая длина (предел слов)'));
    group.append(strictWrap);
    strict.addEventListener('change', emitOutput);
    container.append(group);
  }

  // The text of a control on its canvas card (the owner's words; a switched-off checker is not named).
  // «Шаг после этапа»: the way to add a gate, a route or an owner step lives in the card of the stage it follows.
  const ADD_CONTROL_OPTIONS = [['', '— нет —'], ['gate', 'Проверка (gate)'], ['route', 'Маршрут (route)'], ['owner', 'Владелец (owner)']];
  function renderAddControl(container, { disabled = false, note = '', onAdd = null } = {}) {
    const doc = container.ownerDocument;
    const select = el(doc, 'select', 'stage-card-add-control');
    ADD_CONTROL_OPTIONS.forEach(([value, label]) => {
      const option = el(doc, 'option', '', label);
      option.value = value;
      select.append(option);
    });
    select.disabled = Boolean(disabled);
    select.setAttribute('aria-label', 'Добавить шаг после этапа');
    select.addEventListener('change', () => {
      const kind = select.value;
      select.value = '';
      if (kind && typeof onAdd === 'function') onAdd(kind);
    });
    const row = el(doc, 'label', 'stage-card-setting stage-card-add-control-row');
    row.append(doc.createTextNode('Шаг после этого этапа '), select);
    container.append(row);
    if (disabled && note) container.append(el(doc, 'p', 'stage-card-muted', note));
    return select;
  }

  // The text of the owner window (N07): the task, what the owner was given (the input items of the engine) and the form of
  // the answer that is expected. A file item shows its name only: the page does not open files yet.
  const OWNER_ITEM_LIMIT = 6000;
  function ownerAskMessage({ task = '', input = [], output = null, reason = '', detail = '', reasonText = '' } = {}) {
    const parts = [String(task || '')];
    const items = Array.isArray(input) ? input : [];
    if (items.length) {
      parts.push('Вам передано:');
      items.forEach((item) => {
        const label = item.label || [item.step, item.participant].filter(Boolean).join(' / ') || 'источник';
        let body;
        if (item.file) body = `[файл${item.file.name ? ` «${item.file.name}»` : ''}]`;
        else {
          const text = String(item.text ?? '');
          body = text.length > OWNER_ITEM_LIMIT ? `${text.slice(0, OWNER_ITEM_LIMIT)}\n… (показано ${OWNER_ITEM_LIMIT} из ${text.length} символов)` : text;
        }
        parts.push(`— ${label}:\n${body}`);
      });
    }
    if (isPlain(output) && (output.name || output.form)) {
      parts.push(`Ожидается: ${[output.name, output.form].filter(Boolean).join(' — ')}`);
    }
    if (reason) parts.push(`Прошлый ответ не принят: ${reasonText || reason}${detail ? ` (${detail})` : ''}.`);
    return parts.filter(Boolean).join('\n');
  }

  function controlSummary(step = {}) {
    if (step.kind === 'gate') {
      const checkers = (Array.isArray(step.models) ? step.models : []).filter((model) => isPlain(model) && model.enabled !== false).map((model) => model.name);
      return `проверяют: ${checkers.length ? checkers.join(', ') : 'никто'}`;
    }
    if (step.kind === 'owner') return step.task ? `задание: ${String(step.task).split('\n')[0]}` : 'задание не задано';
    if (step.kind === 'route') {
      const by = isPlain(step.select) ? step.select.by : '';
      const count = isPlain(step.select) && Array.isArray(step.select.cases) ? step.select.cases.length : 0;
      const kind = { rule: 'по правилу', model: 'выбирает модель', owner: 'выбирает владелец' }[by] || 'вид не выбран';
      return `${kind}, вариантов: ${count}`;
    }
    return '';
  }

  const api = Object.freeze({ buildModel, render, renderStepFields, stepFieldsModel, stepsAfterToggle, outputAfterEdit, STATUS, feed,
    gateWindowModel, gateAfterEdit, renderGateWindow, controlSummary, transitionView, transitionAfterEdit,
    routeWindowModel, routeAfterEdit, renderRouteWindow, ownerWindowModel, ownerAfterEdit, renderOwnerWindow, renderAddControl, ownerAskMessage });
  root.StageCard = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// Окна прототипа холста Basic: ▶, раунд, модель, промежуточный и финальный синтез.
// Разметка и классы — как в results.js (renderCustomBlockInspector) и results/stage-card.js;
// стили — только настоящие (styles.css проекта). Данные — window.ProtoState (CONTRACT.md).
(function initProtoCards(root) {
  'use strict';

  const base = (document.currentScript && document.currentScript.src) || root.location.href;
  const projectUrl = (path) => { const m = /icons\/models\/([a-z_]+)\.svg/.exec(path); return m ? (window.__PROTO_ICONS__[m[1]] || '') : path; };

  // Тексты Basic: из disput/basic-schema.js, если он загружен, иначе их копия.
  const BASIC = {
    roundTask: 'Учти ответы предыдущего шага и дай свой улучшенный ответ на задачу.',
    synthesisTask: 'Сведи эти ответы в один итоговый ответ на задачу.',
    discipline: {
      limit: '[RESPONSE_LIMIT] Объём ответа: {от}-{слов} слов, не больше.',
      content: 'Сосредоточься на ясной концепции и ключевых идеях; убери повторы, длинные пересказы и второстепенные детали.',
      delivery: 'Последней строкой ответа напиши только метку {метка}',
      correction: 'Твой предыдущий ответ {причина}. Дай ответ на задание полностью.'
    }
  };
  const basic = () => root.BasicSchema?.DEFAULTS || BASIC;

  // Роли (results.js, DEFAULT_JUDGE_SYSTEM_PROMPTS) и пункт Custom движка Basic.
  const ROLES = [
    { id: 'interaction_meta_synthesis', label: 'Synthes', text: 'Построй собственное экспертное решение, используя представленные версии как сырьё, а не как источник консенсуса. Возьми из них только идеи, которые усиливают твоё решение; слабые отбрось, даже если они встречаются во всех версиях. Проверяй заимствованное на фактическую точность. Результат — новый цельный ответ, а не пересказ и не компиляция.' },
    { id: 'interaction_critical_audit', label: 'Critique', text: 'Проведи экспертный аудит ответов и покажи то, что все пропустили:\n1. Слепые зоны — важные аспекты и следствия, которые никто не назвал.\n2. Ошибки — фактические неточности, логические противоречия, ложные причинно-следственные связи.\n3. Методология — неподходящие критерии и фреймворки, неучтённые ограничения и риски.\nКаждый пункт: конкретный пример → общий паттерн. Без вступлений, сразу к сути.' },
    { id: 'interaction_select_ideas', label: 'Select ideas', text: 'Извлеки из материала все уникальные идеи, включая слабые и спорные. Раздроби ответы до атомарных идей (одна идея = один пункт), объедини дубли, но сохрани отдельно варианты с разным подходом, акцентом или контекстом. Выдай нумерованный список, ранжированный по значимости. Начни сразу с пункта 1, без пояснений.' },
    { id: 'interaction_pattern_clustering', label: 'Clustering', text: 'Сгруппируй идеи по сути подхода, а не по формальным признакам. Для каждого кластера дай: концептуальное название (жирным), суть подхода одним предложением, список входящих идей. Идеи, не вписавшиеся ни в один кластер, вынеси отдельным блоком. Без преамбулы.' },
    { id: 'custom', label: 'Custom', text: '' }
  ];
  const ICONS = { Claude: 'claude', GPT: 'openai', Gemini: 'gemini', Grok: 'grok', 'Le Chat': 'le_chat', Qwen: 'qwen', DeepSeek: 'deepseek', Perplexity: 'perplexity', 'Z.ai': 'zai', Kimi: 'kimi' };
  const PLACEHOLDER = {
    previous: '‹ответы предыдущего шага появятся при запуске›',
    all: '‹все принятые ответы предыдущих шагов появятся при запуске›',
    earlier: '‹ответы моделей, работающих до тебя в этом раунде, появятся при запуске›'
  };
  const DISCIPLINE_KEYS = ['limit', 'content', 'delivery', 'correction'];
  const DISCIPLINE_ROWS = [['limit', 'Длина'], ['content', 'Требования к содержанию'], ['delivery', 'Доставка'], ['correction', 'Повторный запрос']];

  const S = () => root.ProtoState || {};
  const own = (value) => typeof value === 'string' && Boolean(value.trim());
  const first = (...values) => values.find(own);
  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const roleId = (value) => (!value || value === 'None' ? '' : String(value));
  const roleState = (value) => value || 'None';
  const notify = () => { try { S().onChange?.(); } catch (error) { console.error(error); } };
  const general = () => Number(S().run?.maxWords) || 300;
  const lengthInstruction = (template, words) => String(template).replace(/\{от\}|\{слов\}/g, (key) => String(key === '{от}' ? Math.max(1, words - 50) : words));
  const flash = (button) => {
    button.classList.remove('btn-flash-success');
    void button.offsetWidth;
    button.classList.add('btn-flash-success');
    setTimeout(() => button.classList.remove('btn-flash-success'), 420);
  };
  const copyText = async (button, text) => {
    try { await navigator.clipboard.writeText(text); flash(button); } catch (_) { console.warn('Не удалось скопировать текст.'); }
  };

  // ---- Данные шага: раунд или синтез, с наследованием модель → раунд → ▶ → Basic ----
  const defaults = () => {
    const state = S();
    if (!state.defaults) state.defaults = {};
    const d = state.defaults;
    if (!d.discipline) d.discipline = { limit: '', content: '', delivery: '', correction: '', lines: [] };
    if (!d.modelNotes) d.modelNotes = {};
    if (!d.roundPrompts) d.roundPrompts = {};
    return d;
  };
  const roundInput = (round, index) => round.input || (index === 0 ? 'none' : 'previous');
  const roleText = (role, ref) => {
    const id = roleId(role);
    if (id === 'custom') return defaults().roundPrompts[ref] || '';
    return ROLES.find((item) => item.id === id)?.text || '';
  };
  // A pending intermediate synthesis lives only here until the canvas adds the stage.
  const virtualSynth = new WeakMap();
  const synthesisTarget = (kind, index) => {
    const state = S();
    if (kind === 'final') return state.final || null;
    const round = state.rounds?.[index];
    if (!round) return null;
    if (round.intermediateSynthesis) return round.intermediateSynthesis;
    if (!virtualSynth.has(round)) virtualSynth.set(round, { model: (state.final?.on && state.final.model) || (state.models?.includes('Claude') ? 'Claude' : state.models?.[0]) || 'Claude', task: '', discipline: {} });
    return virtualSynth.get(round);
  };

  // step: { kind, ref, label, input, order, task (round level), models: [{ name, ... }] }, target: the model's own settings.
  function stepFor(kind, index, name) {
    const state = S();
    const rounds = state.rounds || [];
    if (kind === 'round') {
      const round = rounds[index];
      if (!round) return null;
      const target = (round.models || []).find((model) => model.name === name);
      if (!target) return null;
      return { kind, index, ref: round.ref || `r${index + 1}`, label: `Раунд ${index + 1}`, input: roundInput(round, index),
        order: round.order || 'parallel', roundTask: round.task, names: round.models.filter((model) => model.enabled !== false).map((model) => model.name), target, name };
    }
    const target = synthesisTarget(kind, index);
    if (!target) return null;
    const after = kind === 'final' ? rounds.length : index + 1;
    return { kind: 'synthesis', synth: kind, index, ref: kind === 'final' ? 'final' : `synth:after-r${index + 1}`, label: `Синтез после раунда ${after}`,
      input: 'previous', order: 'parallel', roundTask: '', names: [target.model], target, name: target.model };
  }
  const taskFallback = (step) => (step.kind === 'synthesis' ? first(defaults().synthesisTask) || basic().synthesisTask : first(defaults().roundTask) || basic().roundTask);
  const inheritedTask = (step) => first(step.roundTask) || taskFallback(step);
  const inheritedDiscipline = (key) => first(defaults().discipline[key]) || basic().discipline[key];
  const wordsOf = (target) => (Number.isSafeInteger(Number(target.maxWords)) && Number(target.maxWords) > 0 ? Number(target.maxWords) : general());

  // Автоматический запрос (часть, которую можно заменить своим): как CustomEngine.previewPrompt().template.
  function automaticRequest(step, { role = step.target.role, task = first(step.target.task) || inheritedTask(step) } = {}) {
    const parts = ['Задача:\n{задача}'];
    const hasEarlierStep = step.kind === 'synthesis' || step.index > 0;
    if (step.input !== 'none' && hasEarlierStep) {
      parts.push(step.input === 'all' ? 'Принятые ответы всех предыдущих шагов:\n\nВход:\n{вход}' : 'Ответы предыдущего шага:\n\nОтвет 1:\n{вход}');
    }
    if (step.order === 'sequential' && step.names.indexOf(step.name) > 0) parts.push('Ответы участников этого раунда до тебя:\n\nОтвет 1:\n{ответы до тебя}');
    if (step.input !== 'none' && own(task)) parts.push(`Задание:\n${task.trim()}`);
    const extra = step.kind === 'synthesis' ? '' : roleText(role, step.ref);
    if (own(extra)) parts.push(`Дополнительно для тебя:\n${extra.trim()}`);
    return parts.join('\n\n');
  }
  // An intermediate synthesis without its own request follows the final synthesizer's request.
  const baseRequest = (step, options) => {
    const fin = S().final;
    if (step.synth === 'intermediate' && fin && fin.model === step.name && own(fin.request)) return fin.request;
    return automaticRequest(step, options);
  };

  // Полный запрос в порядке basic-windows.md: запрос (с ролью) → ответы владельца → особенность модели →
  // лимит → требования к содержанию (и свои строки) → метка доставки.
  function previewPrompt(kind, index, name) {
    const step = stepFor(kind, index, name);
    if (!step) return '';
    const target = step.target;
    const value = (key) => first(target.discipline?.[key]) || inheritedDiscipline(key);
    const lines = [...(defaults().discipline.lines || []), ...(target.discipline?.lines || [])].filter(own);
    return [
      own(target.request) ? target.request : baseRequest(step),
      defaults().modelNotes[step.name],
      lengthInstruction(value('limit'), wordsOf(target)),
      value('content'),
      ...lines,
      value('delivery').replace(/\{метка\}/g, '[[END_…]]')
    ].filter(own).join('\n\n');
  }

  // ---- Модальное окно карточки (как #pipeline-block-info-modal) ----
  let onKey = null;
  function cardModal() {
    let modal = document.getElementById('pipeline-block-info-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.className = 'modal pipeline-block-info-modal';
      modal.id = 'pipeline-block-info-modal';
      modal.setAttribute('aria-hidden', 'true');
      modal.innerHTML = '<div class="modal-content"></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', (event) => { if (event.target === modal) closeCard(); });
    }
    return modal;
  }
  function showCard(modal) {
    modal.style.display = 'flex';
    modal.classList.add('is-visible');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    if (!onKey) {
      onKey = (event) => { if (event.key === 'Escape') closeCard(); };
      document.addEventListener('keydown', onKey);
    }
    (modal.querySelector('#custom-card-request') || modal.querySelector('textarea'))?.focus();
  }
  function closeCard() {
    const modal = document.getElementById('pipeline-block-info-modal');
    if (modal) { modal.style.display = 'none'; modal.classList.remove('is-visible'); modal.setAttribute('aria-hidden', 'true'); }
    document.body.classList.remove('modal-open');
    if (onKey) { document.removeEventListener('keydown', onKey); onKey = null; }
  }

  const copyButton = (id, label) => `<button type="button" data-action="copy" data-copy-field="${id}" title="Копировать" aria-label="Копировать: ${esc(label)}"><i class="ti ti-copy" aria-hidden="true"></i></button>`;
  const roleOptions = (value) => [{ id: '', label: 'None' }, ...ROLES].map((item) => `<option value="${item.id}"${item.id === value ? ' selected' : ''}>${esc(item.label)}</option>`).join('');

  // One renderer for ▶ (entry) and a step's model/synthesis card, after renderCustomBlockInspector.
  function renderCard(spec) {
    const entry = Boolean(spec.entry);
    const step = entry ? null : stepFor(spec.kind, spec.index, spec.name);
    if (!entry && !step) { console.warn('ProtoCards: шаг или модель не найдены', spec); return; }
    const d = defaults();
    const target = entry ? d : step.target;
    if (!entry && !target.discipline) target.discipline = {};
    const words = general();
    const rows = entry
      ? [['roundTask', 'Задание раундов со входом (R2+)'], ['synthesisTask', 'Задание синтеза'], ...DISCIPLINE_ROWS]
      : [...(step.input !== 'none' ? [['task', step.kind === 'synthesis' ? 'Задание синтеза' : 'Задание раунда']] : []), ...DISCIPLINE_ROWS];
    const isTask = (key) => ['task', 'roundTask', 'synthesisTask'].includes(key);
    const fallbackFor = (key) => (key === 'roundTask' ? basic().roundTask : key === 'synthesisTask' ? basic().synthesisTask : basic().discipline[key]);
    const inheritedValue = (key) => (entry ? fallbackFor(key) : key === 'task' ? inheritedTask(step) : inheritedDiscipline(key));
    const rawValue = (key) => (isTask(key) ? target[key] : target.discipline?.[key]);
    const effectiveValue = (key) => first(rawValue(key)) || inheritedValue(key);
    const modelNotes = d.modelNotes;
    const canvasModels = entry ? [...new Set([...(S().rounds || []).flatMap((round) => (round.models || []).map((model) => model.name)),
      ...(S().final?.on && S().final.model ? [S().final.model] : [])])] : [];
    let role = entry ? '' : roleId(target.role);
    let baseTemplate = entry ? '' : baseRequest(step, { role });
    const name = entry ? '' : step.name;
    const icon = ICONS[name] ? `<img src="${projectUrl(`icons/models/${ICONS[name]}.svg`)}" alt="" width="26" height="26">` : '';

    const modal = cardModal();
    const content = modal.querySelector('.modal-content');
    modal.classList.add('custom-model-card');
    modal.classList.toggle('custom-defaults-card', entry);
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'pipeline-block-info-title');
    const synthModels = !entry && step.kind === 'synthesis' ? (S().models || []) : [];
    content.innerHTML = `
      <header class="custom-card-top ${entry ? 'custom-defaults-top' : ''}">
        <h3 class="custom-card-model" id="pipeline-block-info-title">${entry ? '▶ Basic' : `${icon}${esc(name)}<span class="custom-card-where">${esc(step.label)}</span>`}</h3>
        ${entry ? '' : `<div class="custom-card-length"><label for="custom-card-length">Длина ответа:</label> <input id="custom-card-length" type="number" min="1" step="1" inputmode="numeric" placeholder="${words}" aria-describedby="custom-card-length-note"> слов</div>`}
        <button type="button" class="modal-button accent" id="custom-card-save">Save</button>
      </header>
      <div class="custom-card-body">
        ${entry ? '<p class="custom-card-note">Общие значения для всех шагов. Своё значение модели имеет приоритет; пустое поле наследует значение из кода.</p>' : `
        ${synthModels.length ? `<label class="custom-card-head">Модель синтеза <select class="stage-card-role-select" id="custom-card-synth-model">${synthModels.map((item) => `<option value="${esc(item)}"${item === name ? ' selected' : ''}>${esc(item)}</option>`).join('')}</select></label>` : ''}
        ${step.kind === 'round' ? `<label class="custom-card-head">Роль <select class="stage-card-role-select" id="custom-card-role">${roleOptions(role)}</select></label>` : ''}
        <div class="custom-card-field">
          <div class="custom-card-head"><label for="custom-card-request">Запрос</label><span><code>{задача}</code> и <code>{вход}</code> подставляются при запуске. Изменённый текст используется только для этой модели в этом шаге.</span><span class="custom-card-actions">${copyButton('custom-card-request', 'Запрос')}</span></div>
          <textarea id="custom-card-request" spellcheck="false"></textarea>
          <div class="custom-card-note"><span id="custom-card-personal-note"></span> <button type="button" id="custom-card-reset">Вернуть автоматическую сборку</button></div>
        </div>`}
        ${!entry && own(modelNotes[name]) ? `<p class="custom-card-note">Особенность модели (из ▶): ${esc(modelNotes[name])}</p>` : ''}
        ${!entry ? '<p class="custom-card-note" id="custom-card-role-note" hidden>Роль не применяется: используется персональный запрос.</p>' : ''}
        <div class="custom-card-marks"><strong>${entry ? 'Общие задания и дисциплина' : 'Метки транспорта'}</strong>
          ${rows.map(([key, label]) => `<div class="custom-card-discipline" data-discipline="${key}">
            <div class="custom-card-discipline-head"><label for="custom-discipline-${key}">${label}</label>
              <div class="custom-card-actions">
                ${copyButton(`custom-discipline-${key}`, label)}
                <button type="button" data-action="inherit" title="${entry ? 'Вернуть к коду' : 'Вернуть к общему'}" aria-label="Вернуть к общему: ${label}" hidden>↶</button>
                <button type="button" data-action="clear" title="Очистить — наследовать" aria-label="Очистить: ${label}" class="custom-card-clear">×</button>
                <button type="button" data-action="save" title="Сохранить" aria-label="Сохранить: ${label}" class="custom-card-commit">✓</button>
              </div>
            </div>
            <textarea id="custom-discipline-${key}" rows="2" spellcheck="false"></textarea>
          </div>`).join('')}
          <div class="custom-card-lines"></div>
          <div class="custom-card-actions"><button type="button" id="custom-card-line-add" aria-label="Добавить строку" title="Добавить строку">+</button></div>
          <div class="custom-card-note">{от} — на 50 слов меньше предела; {слов} — предел из шапки pipeline; {метка} — новая метка; {причина} — причина повтора. Пустое поле наследуется. При повторе запрос заменяется инструкцией исправления.</div>
        </div>
        ${entry ? `<div class="custom-card-marks"><strong>Особенности моделей</strong>
          ${canvasModels.map((item) => `<div class="custom-card-discipline">
            <div class="custom-card-discipline-head"><span>${esc(item)}</span></div>
            <textarea data-model-note="${esc(item)}" aria-label="Особенность: ${esc(item)}" rows="2" spellcheck="false">${esc(modelNotes[item] || '')}</textarea>
          </div>`).join('') || '<div class="custom-card-note">На холсте нет моделей.</div>'}
          <div class="custom-card-note">Добавляется к каждому запросу модели после запроса и ответов владельца, перед лимитом. Пустое поле — ничего не добавлять.</div>
        </div>` : ''}
        ${entry ? '' : `<span id="custom-card-length-note" class="custom-card-sr-only">Пусто — общий предел pipeline (${words}).</span>`}
      </div>`;

    const request = content.querySelector('#custom-card-request');
    const length = content.querySelector('#custom-card-length');
    const reset = content.querySelector('#custom-card-reset');
    const save = content.querySelector('#custom-card-save');
    const roleSelect = content.querySelector('#custom-card-role');
    if (request) request.value = own(target.request) ? target.request : baseTemplate;
    if (length) length.value = Number(target.maxWords) > 0 ? target.maxWords : words;
    const dirty = new Set();
    const fields = {};
    const lineValues = [...(target.discipline?.lines || [])];
    const display = (key, value) => (key === 'limit' ? lengthInstruction(value, Number(length?.value || words)) : value);
    let lengthDirty = false;
    const refresh = () => {
      if (request) {
        const personal = request.value !== baseTemplate;
        reset.hidden = !personal;
        content.querySelector('#custom-card-personal-note').textContent = personal ? 'Персональный запрос: общее задание не применяется; дисциплина применяется.' : '';
        const roleNote = content.querySelector('#custom-card-role-note');
        if (roleNote) roleNote.hidden = !(personal && role);
      }
      rows.forEach(([key]) => {
        if (!dirty.has(key)) fields[key].value = display(key, effectiveValue(key));
        fields[key].placeholder = display(key, inheritedValue(key));
        const mine = dirty.has(key) ? own(fields[key].value) : own(rawValue(key));
        content.querySelector(`[data-discipline="${key}"] [data-action="inherit"]`).hidden = !mine;
      });
    };

    const saveSettings = (close) => {
      if (request && !request.value.trim()) { request.focus(); console.warn('Введите запрос.'); return false; }
      if (length && (!length.checkValidity() || (length.value !== '' && !Number.isSafeInteger(Number(length.value))))) { length.reportValidity(); return false; }
      const values = {};
      rows.forEach(([key]) => {
        let value = dirty.has(key) ? fields[key].value : (rawValue(key) || '');
        // The shown length instruction has the numbers filled in; typed unchanged it stands for its template.
        if (dirty.has(key) && key === 'limit' && value === display(key, inheritedValue(key))) value = inheritedValue(key);
        values[key] = own(value) ? value : '';
      });
      const discipline = { ...(target.discipline || {}) };
      DISCIPLINE_KEYS.forEach((key) => { if (key in values) discipline[key] = values[key]; });
      discipline.lines = lineValues.map((line) => line.trim()).filter(Boolean);
      target.discipline = discipline;
      if (entry) {
        target.roundTask = values.roundTask;
        target.synthesisTask = values.synthesisTask;
        // Notes of models that are off the canvas stay saved.
        content.querySelectorAll('[data-model-note]').forEach((field) => {
          const value = field.value.trim();
          if (value) modelNotes[field.dataset.modelNote] = value;
          else delete modelNotes[field.dataset.modelNote];
        });
      } else {
        if ('task' in values) target.task = values.task;
        // A request equal to the automatic one stays inherited; an untouched length stays as it was.
        target.request = request.value === baseTemplate ? '' : request.value;
        if (lengthDirty) target.maxWords = length.value === '' ? '' : Number(length.value);
        if (roleSelect) target.role = roleState(role);
      }
      notify();
      if (close) closeCard();
      else { renderCard(spec); modal.querySelector('textarea')?.focus(); }
      return true;
    };

    rows.forEach(([key]) => {
      const row = content.querySelector(`[data-discipline="${key}"]`);
      const field = row.querySelector('textarea');
      fields[key] = field;
      field.addEventListener('input', () => { dirty.add(key); refresh(); });
      row.querySelectorAll('button:not([data-action="copy"])').forEach((button) => button.addEventListener('click', () => {
        if (button.dataset.action === 'save') { if (dirty.has(key)) saveSettings(false); return; }
        field.value = '';
        dirty.add(key);
        refresh();
        if (button.dataset.action === 'inherit') saveSettings(false);
        else field.focus();
      }));
    });
    content.querySelectorAll('[data-copy-field]').forEach((button) => button.addEventListener('click', () => {
      const field = content.querySelector(`#${button.dataset.copyField}`);
      if (field) copyText(button, field.value);
    }));
    request?.addEventListener('input', refresh);
    length?.addEventListener('input', () => { lengthDirty = true; refresh(); });
    reset?.addEventListener('click', () => { request.value = baseTemplate; refresh(); });
    // The role changes the automatic request; a request the owner did not replace follows it.
    roleSelect?.addEventListener('change', () => {
      const automatic = request.value === baseTemplate;
      role = roleSelect.value;
      baseTemplate = baseRequest(step, { role });
      if (automatic) request.value = baseTemplate;
      refresh();
    });
    // The synthesizer list changes the model of this stage at once, as the block's list does.
    content.querySelector('#custom-card-synth-model')?.addEventListener('change', (event) => {
      target.model = event.target.value;
      notify();
      renderCard(spec);
    });

    const drawLines = () => {
      const box = content.querySelector('.custom-card-lines');
      if (!box) return;
      box.innerHTML = lineValues.map((value, index) => `<div class="custom-card-discipline" data-line="${index}">
        <div class="custom-card-discipline-head"><label for="custom-line-${index}">Строка ${index + 1}</label>
          <div class="custom-card-actions">
            ${copyButton(`custom-line-${index}`, `Строка ${index + 1}`)}
            <button type="button" data-action="remove" title="Удалить строку" aria-label="Удалить: Строка ${index + 1}" class="custom-card-clear">×</button>
            <button type="button" data-action="save" title="Сохранить" aria-label="Сохранить: Строка ${index + 1}" class="custom-card-commit">✓</button>
          </div>
        </div>
        <textarea id="custom-line-${index}" rows="2" spellcheck="false">${esc(value)}</textarea>
      </div>`).join('');
      box.querySelectorAll('[data-line]').forEach((row) => {
        const index = Number(row.dataset.line);
        const field = row.querySelector('textarea');
        field.addEventListener('input', () => { lineValues[index] = field.value; });
        row.querySelector('[data-action="copy"]').addEventListener('click', (event) => copyText(event.currentTarget, field.value));
        row.querySelector('[data-action="remove"]').addEventListener('click', () => { lineValues.splice(index, 1); drawLines(); });
        row.querySelector('[data-action="save"]').addEventListener('click', () => saveSettings(false));
      });
    };
    content.querySelector('#custom-card-line-add')?.addEventListener('click', () => {
      lineValues.push('');
      drawLines();
      content.querySelector(`#custom-line-${lineValues.length - 1}`)?.focus();
    });
    drawLines();
    save.addEventListener('click', () => saveSettings(true));
    refresh();
    showCard(modal);
  }

  // ---- Окно раунда: настоящая results/stage-card.js в <dialog class="pipeline-stage-dialog"> ----
  let stageCardReady = null;
  const loadStageCard = () => {
    if (root.StageCard) return Promise.resolve(root.StageCard);
    if (!stageCardReady) {
      stageCardReady = new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = projectUrl('results/stage-card.js');
        script.onload = () => resolve(root.StageCard || null);
        script.onerror = () => { console.error('ProtoCards: не загружен results/stage-card.js'); resolve(null); };
        document.head.appendChild(script);
      });
    }
    return stageCardReady;
  };
  function stageDialog() {
    let dialog = document.getElementById('pipeline-stage-dialog');
    if (!dialog) {
      dialog = document.createElement('dialog');
      dialog.className = 'pipeline-stage-dialog';
      dialog.id = 'pipeline-stage-dialog';
      dialog.setAttribute('aria-labelledby', 'pipeline-stage-dialog-title');
      dialog.innerHTML = '<header class="pipeline-stage-dialog-header"><h2 id="pipeline-stage-dialog-title"></h2><button type="button" data-stage-close aria-label="Закрыть">×</button></header><div class="pipeline-stage-card" id="pipeline-stage-card"></div>';
      document.body.appendChild(dialog);
      dialog.addEventListener('click', (event) => {
        if (event.target.closest?.('[data-stage-close]')) { dialog.close(); return; }
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      });
    }
    return dialog;
  }
  async function openRound(index) {
    const round = S().rounds?.[index];
    if (!round) { console.warn('ProtoCards: нет раунда', index); return; }
    const StageCard = await loadStageCard();
    const dialog = stageDialog();
    const title = dialog.querySelector('#pipeline-stage-dialog-title');
    const body = dialog.querySelector('#pipeline-stage-card');
    const ref = round.ref || `r${index + 1}`;
    if (!StageCard) { title.textContent = `Этап ${index + 1}`; body.replaceChildren(); if (!dialog.open) dialog.showModal(); return; }
    const models = round.models || [];
    const model = StageCard.buildModel({
      round: index + 1,
      participants: models.map((item) => ({ name: item.name, send: item.enabled !== false })),
      roleChoice: {
        prompts: ROLES.map(({ id, label }) => ({ id, label })),
        roles: models.map((item) => roleId(item.role)),
        disabled: false,
        roundPrompt: defaults().roundPrompts[ref] || '',
        settings: { order: round.order || '', input: round.input || '', task: round.task || '' },
        first: index === 0,
        inheritedTask: first(defaults().roundTask) || basic().roundTask
      }
    });
    title.textContent = model.title;
    StageCard.render(body, model, {
      onRole: async (select) => {
        const value = select.value;
        if (new Set(models.map((item) => roleId(item.role))).size > 1 && !root.confirm('Заменить роли моделей раунда?')) { select.value = 'mixed'; return; }
        round.role = roleState(value);
        models.forEach((item) => { item.role = roleState(value); });
        notify();
      },
      onRoundPrompt: (text) => {
        if (own(text)) defaults().roundPrompts[ref] = text;
        else delete defaults().roundPrompts[ref];
        notify();
      },
      onSetting: (field, value) => {
        round[field] = value;
        notify();
        openRound(index);
      }
    });
    if (!dialog.open) dialog.showModal();
  }

  const openEntry = () => renderCard({ entry: true });
  const openModel = (index, name) => renderCard({ kind: 'round', index, name });
  const openSynthesis = (kind, index) => {
    if (kind === 'final' && !S().final?.on) { console.warn('Включите финальный синтез кликом по Final.'); return; }
    renderCard({ kind: kind === 'final' ? 'final' : 'intermediate', index });
  };

  root.ProtoCards = { openEntry, openRound, openModel, openSynthesis, previewPrompt, close: closeCard };
  loadStageCard();
})(window);

</script>
<script>
// Холст прототипа Basic. Разметка и классы — как в pipeline_panel.html, pipeline/pipeline-runtime.js
// (buildModelBlocksHtml) и results.js (addRound, syncIntermediateSynthColumns, renderSynthesisStage);
// линии — перенос drawInputSplitConnector / drawMergeSplitConnector / updatePipelineLayout из results.js.
// Всё рисуется из window.ProtoState; render() перерисовывает холст целиком.
(function initProtoCanvas() {
    'use strict';

    const S = () => window.ProtoState;
    const cards = () => window.ProtoCards || {};
    // Список ролей блока: None + judgeSystemPrompts из prompts.json (по order) + Custom (только Basic).
    const ROLE_OPTIONS = ['None', 'Synthes', 'Critique', 'Select ideas', 'Clustering', 'Custom'];

    const esc = (value = '') => String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const $ = (id) => document.getElementById(id);
    const panel = () => $('pipeline-panel');
    const flow = () => $('pipelineFlow');

    // ---------- Разметка ----------

    const modelBlockHtml = (model, index) => {
        const isActive = model.enabled !== false;
        const send = isActive && model.send !== false;
        const options = ROLE_OPTIONS
            .map((label) => `<option value="${esc(label)}"${(model.role || 'None') === label ? ' selected' : ''}>${esc(label)}</option>`)
            .join('');
        return `
            <div class="model-block ${isActive ? 'active' : 'inactive'} with-role" data-index="${index}" data-model="${esc(model.name)}">
                <div class="model-header">
                    <span class="status-indicator" data-llm-name="${esc(model.name)}"></span>
                    <input type="checkbox" class="model-checkbox model-input-checkbox"${isActive ? ' checked' : ''} aria-label="Input" title="Input">
                    <span class="model-name">${esc(model.name)}</span>
                    <input type="checkbox" class="model-checkbox model-send-checkbox"${send ? ' checked' : ''}${isActive ? '' : ' disabled'} aria-label="Send" title="Send">
                </div>
                <select class="role-selector judge-prompt-selector"${isActive ? '' : ' disabled'}>${options}</select>
            </div>`;
    };

    const artifactsHtml = (artifacts = []) => {
        const items = artifacts.length
            ? artifacts.map((a) => `<span class="proto-artifact" title="${esc(a.title)} v${esc(a.version)}"><span class="proto-artifact-title">${esc(a.title)}</span><span class="proto-artifact-version">v${esc(a.version)}</span></span>`).join('')
            : '<span class="proto-artifacts-empty">—</span>';
        return `<div class="proto-artifacts" aria-disabled="true"><div class="proto-artifacts-label">Артефакты</div><div class="proto-artifacts-row">${items}</div></div>`;
    };

    const insertHtml = (n, isLast, hasSynth) => `<button type="button" class="pipeline-stage-insert${hasSynth ? ' has-intermediate-synthesis' : ''}" data-after-stage-id="canvas-r${n}" data-round-index="${n - 1}" aria-label="Add stage after R${n}" aria-pressed="${hasSynth}" title="${hasSynth ? 'Click to remove (double-click for its request)' : 'Click to add intermediate synthesis'}"${isLast ? ' hidden disabled' : ''}></button>`;

    const synthOptions = (selected) => S().models
        .map((name) => `<option value="${esc(name)}"${name === selected ? ' selected' : ''}>${esc(name)}</option>`).join('');

    const roundHtml = (round, i, total) => {
        const n = i + 1;
        const isLast = n === total;
        const synth = !isLast && round.intermediateSynthesis;
        const deleteHidden = !(isLast && total > 1);
        let html = `
            <div class="stage-column" id="round${n}" data-round="${n}" data-round-index="${i}" data-planned-stage-id="canvas-r${n}">
                <div class="stage-header-row"><div class="stage-label"><span class="round-badge">R${n}</span> <button type="button" class="pipeline-round-delete-btn" title="Delete round" aria-label="Delete round"${deleteHidden ? ' hidden disabled' : ''}>×</button></div>${synth ? '' : insertHtml(n, isLast, false)}</div>
                <div class="model-stack" id="r${n}-models">${(round.models || []).map(modelBlockHtml).join('')}</div>
                ${artifactsHtml(round.artifacts)}
            </div>`;
        if (isLast) return html;
        html += `<div class="connector-group" data-round="${n + 1}"><svg class="connector-svg" id="svg-r${n}-r${n + 1}"></svg></div>`;
        if (synth) {
            html += `
                <div class="stage-column pipeline-intermediate-synth" data-synth-after-round="${n}" data-round-index="${i}">
                    <div class="pipeline-intermediate-synth-header">${insertHtml(n, false, true)}</div>
                    <div class="model-stack" id="synth-r${n}-stack">
                        <div class="model-block inactive pipeline-synthesis-block selected-synthesizer">
                            <div class="model-header">
                                <span class="status-indicator" aria-hidden="true"></span>
                                <span class="model-name">Synthesis</span>
                            </div>
                            <select class="synthesis-flow-select" aria-label="Intermediate synthesis model" data-round-index="${i}">${synthOptions(synth.model)}</select>
                        </div>
                    </div>
                </div>
                <div class="connector-group pipeline-intermediate-synth" data-synth-after-round="${n}"><svg class="connector-svg" id="svg-synth-r${n}-r${n + 1}"></svg></div>`;
        }
        return html;
    };

    const finalHtml = () => {
        const final = S().final || {};
        const on = !!final.on;
        return `
            <div class="connector-group synthesis-capable" id="connectorToSynthesis"><svg class="connector-svg" id="svg-r-last-synthesis"></svg></div>
            <div class="stage-column synthesis-capable${on ? '' : ' pipeline-final-off'}" id="synthesisColumn" data-stage="synthesis">
                <div class="stage-label"><span class="round-badge" title="Click to enable/disable final synthesis; double-click for its request">Final</span></div>
                <div class="model-stack synthesis-stack" id="synthesis-stack">
                    <div class="model-block inactive pipeline-synthesis-block${on ? ' selected-synthesizer' : ''}" data-synthesis-stage="true" data-synthesis-kind="universal" title="${on ? `Final synthesizer: ${esc(final.model)}` : 'Select a synthesizer model'}">
                        <div class="model-header">
                            <span class="status-indicator" aria-hidden="true"></span>
                            <span class="model-name">Synthesis</span>
                        </div>
                        <select id="synthesis-flow-select" class="synthesis-flow-select" aria-label="Synthesis model in flow"${on ? '' : ' disabled'}>${synthOptions(on ? final.model : '')}</select>
                    </div>
                </div>
            </div>`;
    };

    // ---------- Линии (перенос из results.js) ----------

    const blockCenterY = (stack, index, container) => {
        const item = stack?.children[index];
        if (!item || !container) return 0;
        const a = item.getBoundingClientRect();
        const c = container.getBoundingClientRect();
        return (a.top + a.height / 2) - c.top;
    };
    const checkedIndices = (stackId, selector) => {
        const stack = $(stackId);
        if (!stack) return [];
        const out = [];
        Array.from(stack.children).forEach((item, i) => {
            const cb = item.querySelector(selector);
            if (cb && cb.checked && !cb.disabled) out.push(i);
        });
        return out;
    };
    const hasSelectedModels = () => S().rounds.some((r) => (r.models || []).some((m) => m.enabled !== false));
    const modeLookup = (stackId, mode) => {
        if (mode === 'input') return checkedIndices(stackId, '.model-input-checkbox');
        if (mode === 'send') return checkedIndices(stackId, '.model-send-checkbox');
        const stack = $(stackId);
        if (!stack) return [];
        if (mode === 'all') return Array.from(stack.children).map((_, i) => i);
        if (mode === 'synthesis') {
            if (!hasSelectedModels()) return [];
            return Array.from(stack.children).map((b, i) => (b.classList.contains('selected-synthesizer') ? i : -1)).filter((i) => i >= 0);
        }
        return [];
    };
    const inactiveIndices = (stack, active) => {
        if (!stack) return [];
        const set = new Set(active);
        return Array.from(stack.querySelectorAll('.model-block'))
            .map((b) => Array.from(stack.children).indexOf(b))
            .filter((i) => i >= 0 && !set.has(i));
    };
    const arrow = (y, cls) => `<polygon points="44,${y - 4} 50,${y} 44,${y + 4}" class="arrow-head ${cls}"/>`;

    const drawInputSplitConnector = (svgId, targetStackId, colorClass, targetMode = 'input') => {
        const svg = $(svgId);
        const entryPoint = $('entryPoint');
        const entryWrapper = $('entryWrapper');
        if (!svg) return;
        const targetStack = $(targetStackId);
        const active = modeLookup(targetStackId, targetMode);
        const inactive = inactiveIndices(targetStack, active);
        const all = [...active, ...inactive];
        if (!all.length) { svg.innerHTML = ''; if (entryPoint) entryPoint.style.marginTop = '26px'; return; }
        const W = 50; const splitX = W - 15;
        const ys = all.map((i) => blockCenterY(targetStack, i, svg));
        const minY = Math.min(...ys); const maxY = Math.max(...ys); const midY = (minY + maxY) / 2;
        if (entryPoint && entryWrapper) {
            const eys = all.map((i) => blockCenterY(targetStack, i, entryWrapper));
            entryPoint.style.marginTop = `${(Math.min(...eys) + Math.max(...eys)) / 2 - 9}px`;
        }
        const activePath = active.length > 0;
        const cls = activePath ? colorClass : 'inactive';
        let html = `<line x1="0" y1="${midY}" x2="${splitX}" y2="${midY}" class="connector-line ${cls}${activePath ? ' flow-anim' : ''}"/>`;
        if (ys.length > 1) html += `<line x1="${splitX}" y1="${minY}" x2="${splitX}" y2="${maxY}" class="merge-line ${cls}"/>`;
        active.forEach((i) => { const y = blockCenterY(targetStack, i, svg); html += `<line x1="${splitX}" y1="${y}" x2="${W - 6}" y2="${y}" class="connector-line ${colorClass} flow-anim"/>${arrow(y, colorClass)}`; });
        inactive.forEach((i) => { const y = blockCenterY(targetStack, i, svg); html += `<line x1="${splitX}" y1="${y}" x2="${W - 6}" y2="${y}" class="connector-line inactive"/>${arrow(y, 'inactive')}`; });
        svg.innerHTML = html;
    };

    const drawMergeSplitConnector = (svgId, sourceStackId, targetStackId, colorClass, { sourceMode = 'send', targetMode = 'input' } = {}) => {
        const svg = $(svgId);
        if (!svg) return;
        const sourceStack = $(sourceStackId);
        const targetStack = $(targetStackId);
        const src = modeLookup(sourceStackId, sourceMode);
        const tgt = modeLookup(targetStackId, targetMode);
        const srcInactive = ['send', 'input', 'synthesis'].includes(sourceMode) ? inactiveIndices(sourceStack, src) : [];
        const tgtInactive = ['input', 'synthesis'].includes(targetMode) ? inactiveIndices(targetStack, tgt) : [];
        if (!sourceStack || !targetStack || !(src.length + srcInactive.length) || !(tgt.length + tgtInactive.length)) { svg.innerHTML = ''; return; }
        const W = 50; const mergeX = 15; const splitX = W - 15;
        const aS = src.map((i) => blockCenterY(sourceStack, i, svg));
        const iS = srcInactive.map((i) => blockCenterY(sourceStack, i, svg));
        const aT = tgt.map((i) => blockCenterY(targetStack, i, svg));
        const iT = tgtInactive.map((i) => blockCenterY(targetStack, i, svg));
        const sYs = [...aS, ...iS]; const tYs = [...aT, ...iT];
        const activePath = aS.length > 0 && aT.length > 0;
        const cls = activePath ? colorClass : 'inactive';
        const anim = activePath ? ' flow-anim' : '';
        const sMin = Math.min(...sYs); const sMax = Math.max(...sYs);
        const tMin = Math.min(...tYs); const tMax = Math.max(...tYs);
        let html = '';
        aS.forEach((y) => { html += `<line x1="0" y1="${y}" x2="${mergeX}" y2="${y}" class="connector-line ${colorClass}${anim}"/>`; });
        iS.forEach((y) => { html += `<line x1="0" y1="${y}" x2="${mergeX}" y2="${y}" class="connector-line inactive"/>`; });
        if (sYs.length > 1) html += `<line x1="${mergeX}" y1="${sMin}" x2="${mergeX}" y2="${sMax}" class="merge-line ${cls}"/>`;
        html += `<line x1="${mergeX}" y1="${(sMin + sMax) / 2}" x2="${splitX}" y2="${(tMin + tMax) / 2}" class="connector-line ${cls}${anim}"/>`;
        if (tYs.length > 1) html += `<line x1="${splitX}" y1="${tMin}" x2="${splitX}" y2="${tMax}" class="merge-line ${cls}"/>`;
        aT.forEach((y) => { html += `<line x1="${splitX}" y1="${y}" x2="${W - 6}" y2="${y}" class="connector-line ${cls}${anim}"/>${arrow(y, cls)}`; });
        iT.forEach((y) => { html += `<line x1="${splitX}" y1="${y}" x2="${W - 6}" y2="${y}" class="connector-line inactive"/>${arrow(y, 'inactive')}`; });
        svg.innerHTML = html;
    };

    // Высота линий = высота самого высокого стека; стек синтеза центрируется по последнему стеку раунда.
    const updateLayout = () => {
        const root = panel();
        const styles = getComputedStyle(document.documentElement);
        const blockH = parseFloat(styles.getPropertyValue('--pipeline-block-height')) || 64;
        const stacks = Array.from(root.querySelectorAll('.model-stack'));
        let maxHeight = 0;
        stacks.forEach((stack) => {
            const last = stack.lastElementChild;
            if (!last) return;
            const h = last.getBoundingClientRect().bottom - stack.getBoundingClientRect().top;
            if (h > maxHeight) maxHeight = h;
        });
        const height = Math.max(blockH, maxHeight || blockH);
        root.querySelectorAll('.connector-svg').forEach((svg) => { svg.style.height = `${height}px`; svg.setAttribute('height', `${height}`); });
        const entryWrapper = $('entryWrapper');
        if (entryWrapper) entryWrapper.style.height = `${height}px`;
        const reference = $(`r${S().rounds.length}-models`);
        if (!reference) return;
        const rr = reference.getBoundingClientRect();
        const referenceCenter = rr.top + rr.height / 2;
        const terminals = [$('synthesisColumn'), ...root.querySelectorAll('.stage-column.pipeline-intermediate-synth')];
        terminals.forEach((column) => {
            const stack = column?.querySelector('.model-stack');
            if (!stack) return;
            const sr = stack.getBoundingClientRect();
            const current = parseFloat(column.style.getPropertyValue('--pipeline-terminal-offset')) || 0;
            const natural = (sr.top + sr.height / 2) - current;
            column.style.setProperty('--pipeline-terminal-offset', `${Math.round((referenceCenter - natural) * 100) / 100}px`);
        });
    };

    const drawAll = () => {
        if (window.ProtoStand?.active) { window.ProtoStand.draw(); return; }
        const rounds = S().rounds;
        const total = rounds.length;
        updateLayout();
        drawInputSplitConnector('svg-in-models', 'r1-models', 'active');
        for (let n = 1; n < total; n++) {
            if (rounds[n - 1].intermediateSynthesis) {
                drawMergeSplitConnector(`svg-r${n}-r${n + 1}`, `r${n}-models`, `synth-r${n}-stack`, 'brain-flow', { sourceMode: 'send', targetMode: 'all' });
                drawMergeSplitConnector(`svg-synth-r${n}-r${n + 1}`, `synth-r${n}-stack`, `r${n + 1}-models`, 'brain-flow', { sourceMode: 'all', targetMode: 'input' });
            } else {
                drawMergeSplitConnector(`svg-r${n}-r${n + 1}`, `r${n}-models`, `r${n + 1}-models`, 'brain-flow', { sourceMode: 'send', targetMode: 'input' });
            }
        }
        drawMergeSplitConnector('svg-r-last-synthesis', `r${total}-models`, 'synthesis-stack', 'brain-flow', { sourceMode: 'send', targetMode: 'synthesis' });
        // Блок синтеза выглядит активным только при выбранном синтезаторе и выбранных моделях.
        const any = hasSelectedModels();
        panel().querySelectorAll('.pipeline-synthesis-block').forEach((block) => {
            block.classList.toggle('inactive', !(any && block.classList.contains('selected-synthesizer')));
        });
    };

    // ---------- render ----------

    const syncChrome = () => {
        const state = S();
        const total = state.rounds.length;
        const value = $('debate-round-value');
        if (value) value.value = String(total);
        const unit = $('debate-round-unit');
        if (unit) unit.textContent = total === 1 ? 'round' : 'rounds';
        const minus = $('debate-round-minus-btn');
        if (minus) minus.disabled = total <= 1;
        const plus = $('pipeline-add-round-btn');
        if (plus) plus.disabled = total >= 50;
        const length = $('debate-length-select');
        if (length) length.value = String(state.run?.maxWords || 300);
        const auto = $('debate-auto-toggle-btn');
        const isAuto = state.run?.policy === 'auto';
        if (auto) { auto.checked = isAuto; auto.setAttribute('aria-pressed', String(isAuto)); auto.closest('.debate-auto-toggle')?.classList.toggle('is-active', isAuto); }
        document.querySelectorAll('#protoModelButtons .llm-button').forEach((btn) => {
            btn.classList.toggle('active', btn.dataset.model === state.selectedModel);
            btn.setAttribute('aria-pressed', String(btn.dataset.model === state.selectedModel));
        });
    };

    let frame = 0;
    const render = () => {
        const state = S();
        const root = flow();
        if (!state || !root) return;
        // Стенд схем (stand.js) рисует холст сам, пока применена схема.
        if (window.ProtoStand?.active) { window.ProtoStand.render(); return; }
        if (!state.rounds.length) state.rounds.push(newRound(1));
        const total = state.rounds.length;
        root.innerHTML = `
            <div class="stage-column entry-column">
                <div class="stage-label"><span class="entry-badge">In</span></div>
                <div class="entry-wrapper" id="entryWrapper"><div class="entry-point" id="entryPoint" title="Общие значения" style="cursor:pointer">▶</div></div>
            </div>
            <div class="connector-group"><svg class="connector-svg" id="svg-in-models"></svg></div>
            ${state.rounds.map((round, i) => roundHtml(round, i, total)).join('')}
            <div id="insertionPoint"></div>
            ${finalHtml()}`;
        syncChrome();
        drawAll();
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => { frame = 0; drawAll(); });
    };

    // ---------- Действия над состоянием ----------

    const newRound = (n) => ({
        ref: `r${n}`, order: '', input: '', task: '', role: 'None',
        models: S().models.map((name) => S().protoModel(name)),
        intermediateSynthesis: null,
        artifacts: []
    });
    const nextRef = () => 1 + Math.max(0, ...S().rounds.map((r) => Number(/^r(\d+)$/.exec(r.ref || '')?.[1]) || 0));
    const addRound = () => { if (S().rounds.length < 50) { S().rounds.push(newRound(nextRef())); render(); } };
    const removeLastRound = () => {
        const rounds = S().rounds;
        if (rounds.length <= 1) return;
        rounds.pop();
        // После последнего раунда промежуточного синтеза не бывает.
        rounds[rounds.length - 1].intermediateSynthesis = null;
        render();
    };
    const defaultSynthModel = () => {
        const { final, models } = S();
        if (final?.on && final.model) return final.model;
        return models.includes('Claude') ? 'Claude' : models[0];
    };
    const toggleIntermediate = (i) => {
        const round = S().rounds[i];
        if (!round || i >= S().rounds.length - 1) return;
        round.intermediateSynthesis = round.intermediateSynthesis
            ? null
            : { model: defaultSynthModel(), task: '', discipline: S().emptyDiscipline() };
        render();
    };
    const toggleFinal = () => {
        const final = S().final;
        final.on = !final.on;
        if (final.on && !final.model) final.model = S().models.includes('Claude') ? 'Claude' : S().models[0];
        render();
    };
    const modelOf = (block) => {
        const i = Number(block.closest('.stage-column')?.dataset.roundIndex);
        const round = S().rounds[i];
        return { i, round, model: round?.models?.[Number(block.dataset.index)] };
    };

    // ---------- События ----------

    const BLOCK_CONTROLS = 'input, select, button, .status-indicator, option';
    let intermediateTimer = null;
    let finalTimer = null;

    const bindPanel = () => {
        const root = panel();
        root.addEventListener('click', (event) => {
            const t = event.target;
            const insert = t.closest('.pipeline-stage-insert');
            if (insert) {
                if (insert.disabled) return;
                clearTimeout(intermediateTimer);
                const i = Number(insert.dataset.roundIndex);
                intermediateTimer = setTimeout(() => toggleIntermediate(i), 250);
                return;
            }
            const badge = t.closest('.round-badge');
            if (badge) {
                event.preventDefault();
                if (badge.closest('#synthesisColumn')) {
                    clearTimeout(finalTimer);
                    finalTimer = setTimeout(toggleFinal, 250);
                    return;
                }
                const i = Number(badge.closest('.stage-column')?.dataset.roundIndex);
                cards().openRound?.(i);
                return;
            }
            if (t.closest('#entryPoint')) { cards().openEntry?.(); return; }
            if (t.closest('.pipeline-round-delete-btn')) { event.preventDefault(); removeLastRound(); return; }
            if (t.closest('#pipeline-add-round-btn')) { addRound(); return; }
            if (t.closest('#debate-round-minus-btn')) { removeLastRound(); return; }
            const item = t.closest('.pipeline-item');
            if (item) { const radio = item.querySelector('.pipeline-radio'); if (radio) radio.checked = true; const name = $('currentPipelineName'); if (name) name.textContent = item.dataset.name; }
        });

        root.addEventListener('dblclick', (event) => {
            const t = event.target;
            if (t.closest('select')) return;
            const insert = t.closest('.pipeline-stage-insert');
            if (insert) {
                event.preventDefault();
                clearTimeout(intermediateTimer);
                cards().openSynthesis?.('intermediate', Number(insert.dataset.roundIndex));
                return;
            }
            const intermediate = t.closest('.pipeline-intermediate-synth .pipeline-synthesis-block');
            if (intermediate) {
                cards().openSynthesis?.('intermediate', Number(intermediate.closest('.stage-column').dataset.roundIndex));
                return;
            }
            const finalTarget = t.closest('#synthesisColumn .pipeline-synthesis-block, #synthesisColumn .stage-label');
            if (finalTarget) {
                event.preventDefault();
                clearTimeout(finalTimer);
                cards().openSynthesis?.('final');
                return;
            }
            const block = t.closest('.model-block');
            if (block && !block.classList.contains('pipeline-synthesis-block') && !t.closest(BLOCK_CONTROLS)) {
                event.preventDefault();
                const { i, model } = modelOf(block);
                if (model) cards().openModel?.(i, model.name);
            }
        });

        root.addEventListener('change', (event) => {
            const t = event.target;
            const block = t.closest('.model-block');
            if (block && !block.classList.contains('pipeline-synthesis-block')) {
                const { model } = modelOf(block);
                if (!model) return;
                if (t.classList.contains('model-input-checkbox')) {
                    model.enabled = t.checked;
                    if (t.checked && model.send === false) model.send = true;
                } else if (t.classList.contains('model-send-checkbox')) {
                    model.send = t.checked;
                } else if (t.classList.contains('role-selector')) {
                    model.role = t.value;
                }
                render();
                return;
            }
            if (t.id === 'synthesis-flow-select') { S().final.model = t.value; render(); return; }
            if (t.classList.contains('synthesis-flow-select')) {
                const synth = S().rounds[Number(t.dataset.roundIndex)]?.intermediateSynthesis;
                if (synth) synth.model = t.value;
                render();
                return;
            }
            if (t.id === 'debate-length-select') { S().run.maxWords = Number(t.value); return; }
            if (t.id === 'proto-import-input') importFile(t);
        });

        $('pipeline-add-btn')?.addEventListener('click', () => {
            const state = S();
            state.rounds = [newRound(1)];
            state.final = { on: true, model: state.models.includes('Claude') ? 'Claude' : state.models[0], task: '', discipline: state.emptyDiscipline() };
            render();
        });
        $('pipeline-export-btn')?.addEventListener('click', exportState);
        $('pipeline-import-btn')?.addEventListener('click', () => $('proto-import-input')?.click());
    };

    const DATA_KEYS = ['models', 'defaults', 'run', 'rounds', 'final', 'selectedModel'];
    const exportState = () => {
        const data = {};
        DATA_KEYS.forEach((key) => { data[key] = S()[key]; });
        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: 'proto-state.json' });
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    const importFile = (input) => {
        const file = input.files?.[0];
        if (!file) return;
        file.text().then((text) => {
            const data = JSON.parse(text);
            DATA_KEYS.forEach((key) => { if (data[key] !== undefined) S()[key] = data[key]; });
            render();
        }).catch((error) => console.warn('[proto] import failed', error)).finally(() => { input.value = ''; });
    };

    const bindTopBar = () => {
        $('protoModelButtons')?.addEventListener('click', (event) => {
            const btn = event.target.closest('.llm-button');
            if (!btn) return;
            S().selectedModel = btn.dataset.model;
            render();
        });
        $('debate-auto-toggle-btn')?.addEventListener('change', (event) => {
            S().run.policy = event.target.checked ? 'auto' : 'manual';
            syncChrome();
        });
    };

    window.ProtoCanvas = { render, syncChrome, drawInputSplitConnector, drawMergeSplitConnector };

    const start = () => {
        if (!S()) { console.warn('[proto] ProtoState is missing'); return; }
        if (!S().selectedModel) S().selectedModel = S().models[0];
        S().onChange = render;
        bindPanel();
        bindTopBar();
        window.addEventListener('resize', () => drawAll());
        render();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
})();

</script>
<script>
// Обмен схемами между стендом ({ task, steps: [{ id, block, … }] }) и Basic ({ schemaVersion, origin, steps: [{ ref, kind, models }] }).
// toBasic — экспорт со стенда: файл, который принимает кнопка Import в Basic. fromBasic — импорт файла Basic на стенд.
// Переносятся round, synthesis, gate, owner, defaults, run, description. Остальные блоки пропускаются с предупреждением.
// Повтор шага (repeats) в Basic — переход проверки назад (onFail.goto с maxLoops), поэтому повторные шаги не переносятся.
(function initBasicExport(root) {
  'use strict';

  const own = (v) => typeof v === 'string' && v.trim() !== '';
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  const list = (v) => (Array.isArray(v) ? v : []);
  const idPart = (id, fallback) => (String(id || '').replace(/[^A-Za-z0-9_-]/g, '') || fallback);
  const RUN_WORDS = [300, 500, 700, 1000];
  const MODEL_COPY = ['maxWords', 'request', 'discipline'];

  // Ссылка входа стенда ("s2" или "s3.Артефакт") → id этапа.
  const stepOf = (ref) => String(ref).split('.')[0];

  function toBasic(schema, opts = {}) {
    const roleIdOf = opts.roleIdOf || (() => '');
    const warnings = [];
    const steps = list(schema?.steps).filter(isObj);
    const pos = new Map(steps.map((st, i) => [st.id, i]));
    const repeatOf = (st) => (own(st.repeats) && pos.has(st.repeats) && pos.get(st.repeats) < pos.get(st.id) ? st.repeats : '');
    const kept = steps.filter((st) => !repeatOf(st));
    const lastSynth = kept.map((st) => st.block).lastIndexOf('synthesis');
    const finalStep = lastSynth >= 0 && !kept.slice(lastSynth + 1).some((st) => st.block === 'round') ? kept[lastSynth] : null;

    // Первый проход: ref каждого переносимого шага.
    const refs = new Map();
    let rounds = 0;
    steps.forEach((st, i) => {
      if (repeatOf(st)) return;
      if (st.block === 'round') refs.set(st.id, `r${++rounds}`);
      else if (st.block === 'synthesis') refs.set(st.id, st === finalStep ? 'final' : `synth:${idPart(st.id, `s${i + 1}`)}`);
      else if (st.block === 'gate') refs.set(st.id, `gate:${idPart(st.id, `s${i + 1}`)}`);
      else if (st.block === 'owner') refs.set(st.id, `owner:${idPart(st.id, `s${i + 1}`)}`);
    });
    const inputRefs = (st) => [...new Set(list(st.inputs).map(stepOf).filter((id) => refs.has(id) && pos.get(id) < pos.get(st.id)).map((id) => refs.get(id)).filter((ref) => ref !== 'final'))];

    const modelOf = (m) => {
      const roleId = roleIdOf(m.role);
      const roleLine = own(m.role) && !roleId ? `Роль: ${m.role.trim()}.` : '';
      const task = [roleLine, own(m.task) ? m.task.trim() : ''].filter(Boolean).join('\n\n');
      const out = { name: String(m.name) };
      if (roleId && roleId !== 'None') out.role = roleId;
      if (task) out.task = task;
      MODEL_COPY.forEach((k) => { if (m[k] !== undefined && m[k] !== '') out[k] = m[k]; });
      return out;
    };
    const firstModel = (before) => {
      for (let i = before - 1; i >= 0; i -= 1) {
        const st = steps[i];
        const name = st.block === 'synthesis' ? st.model : list(st.models)[0]?.name;
        if (own(name)) return name;
      }
      return list(steps.find((st) => st.block === 'round')?.models)[0]?.name || 'Claude';
    };

    const out = [];
