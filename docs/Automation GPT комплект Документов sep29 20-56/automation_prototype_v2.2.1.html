<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Automation — realistic offline prototype</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#fafbfc;--border:#dfe3e8;--text:#1f2933;--muted:#6b7280;
  --accent:#2563eb;--accent-soft:#eef4ff;--ok:#137333;--ok-soft:#edf8f0;--chip:#f1f3f5;--user:#f7f8fa;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.page{max-width:1760px;min-width:1180px;margin:0 auto;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;height:100vh;min-height:0;overflow:hidden}
.runbar,.column{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.runbar{padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;min-height:42px}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{font-size:12px;padding:5px 9px;border:1px solid var(--border);border-radius:999px;background:var(--chip);color:#475467}.chip.live{background:var(--accent-soft);border-color:#cddcff;color:#174ea6}.chip.ok{background:var(--ok-soft);border-color:#cbe8d2;color:var(--ok)}
button{border:0;border-radius:9px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f4;color:#2f3a45}.primary:disabled{opacity:.45;cursor:default}
.workspace{display:grid;grid-template-columns:minmax(310px,1fr) minmax(460px,1.35fr) minmax(310px,1fr);gap:8px;align-items:stretch;min-height:0;height:100%}
.column{overflow:hidden;display:flex;flex-direction:column;min-height:0;height:100%}.head{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}.head h2{font-size:16px;margin:0}.head small{font-size:12px;color:var(--muted)}
.body{padding:8px;display:grid;grid-template-rows:minmax(0,1fr) 100px;gap:8px;flex:1;min-height:0}.label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chat{height:100%;min-height:0;border:1px solid var(--border);border-radius:11px;background:var(--surface2);padding:9px;overflow:auto}.chat.empty{display:block}
.composer{height:100px;border:1px solid var(--border);border-radius:11px;background:#fff;position:relative;overflow:hidden}.composer textarea{width:100%;height:100%;border:0;outline:0;resize:none;padding:9px 88px 34px 9px;font:inherit;line-height:1.45;background:#fff}.composer button{position:absolute;right:8px;bottom:8px}.request-view{height:100px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:11px;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.45;color:#334155}.request-view.empty{display:flex;align-items:center;justify-content:center;color:#98a2b3;font-style:italic}.request-view.sending{background:#f7faff;border-color:#9ab8ff;box-shadow:inset 3px 0 0 var(--accent)}
.round{margin:0 0 10px}.round-title{font-size:12px;font-weight:800;padding:4px 0 6px;border-bottom:1px solid #d7dce2;margin-bottom:7px}.msg{margin:0 0 8px}.msg-head{font-size:12px;font-weight:800;margin-bottom:5px}.msg.user .bubble{background:var(--user);border:1px solid var(--border)}.bubble{border-radius:10px;padding:8px 9px;background:#fff;border:1px solid #e6e9ed;white-space:pre-wrap;line-height:1.5;font-size:12px}.bubble.long{max-height:210px;overflow:auto}.model-name{font-weight:800}
.structure{margin-top:8px;border-top:1px solid #edf0f3;padding-top:8px;display:grid;gap:6px}.structure-row{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:11px;line-height:1.35}.structure-key{color:var(--muted);font-weight:700}.structure-val{color:#344054}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;padding:3px 6px;border-radius:999px;background:#f1f4f8;border:1px solid #dfe5ec;color:#475467}.completion{color:var(--ok);font-weight:800}
.center-chat .msg.user .bubble{background:#f7f8fa}.center-chat .round-title{font-size:14px}.phase-note{font-size:12px;color:var(--muted);margin:8px 0}.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}.dot{width:5px;height:5px;border-radius:50%;background:#98a2b3;animation:pulse 1.2s infinite ease-in-out}.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(max-width:1180px){body{overflow:auto}.page{margin:0;min-width:1180px}.workspace{grid-template-columns:minmax(310px,1fr) minmax(460px,1.35fr) minmax(310px,1fr)}}

.model-navigation{display:flex;justify-content:flex-start;align-items:center;flex-wrap:nowrap;gap:4.65px;margin:0;padding:3px 0;background:#fff;overflow-x:auto;min-width:0;scrollbar-width:none}
.model-navigation::-webkit-scrollbar{display:none}
.model-nav-button{display:inline-flex;flex:0 0 auto;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:58px;padding:0;border:none;border-radius:0;background:transparent;color:#8c98a3;font-size:12px;font-weight:600;letter-spacing:.01em;cursor:pointer;transition:color .2s ease,transform .2s ease}
.model-nav-button:hover{color:#8c98a3;transform:translateY(-1px)}
.model-nav-icon{width:34px;height:34px;display:block;background-color:rgba(39,37,30,.446);-webkit-mask:var(--model-icon) center/contain no-repeat;mask:var(--model-icon) center/contain no-repeat;transition:background-color .2s ease,transform .2s ease}
.model-nav-label{line-height:1;text-align:center}
.model-nav-button:hover .model-nav-icon{transform:scale(1.04)}
.model-nav-button.is-active,.model-nav-button.is-active:hover{color:#27251eeb}
.model-nav-button.is-active .model-nav-icon{background-color:#27251eeb}
.run-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.runbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto}
@media(max-width:1450px){.model-nav-button{min-width:54px}.model-navigation{gap:2px}}


/* Test toolbar: only model selection + test actions. */
.runbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  min-height:66px;
  padding:6px 10px;
}
.status{display:none!important}
.model-navigation{
  min-width:0;
  overflow-x:auto;
  justify-content:flex-start;
}
.run-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  position:sticky;
  right:0;
  z-index:2;
  padding-left:10px;
  background:var(--surface);
}
.run-actions button{white-space:nowrap}
.model-nav-button:disabled{opacity:.52;cursor:default;transform:none}
.results-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(20,27,35,.28);
}
.results-modal[hidden]{display:none}
.results-panel{
  width:min(900px,92vw);
  max-height:82vh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  box-shadow:0 22px 60px rgba(15,23,42,.18);
}
.results-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
}
.results-panel-head h2{margin:0;font-size:16px}
#resultsBody{
  margin:0;
  padding:14px;
  overflow:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  background:#fafbfc;
}

</style>
</head>

function stableNormalize(v){
  if(Array.isArray(v))return v.map(stableNormalize);
  if(!v||typeof v!=='object')return v;
  return Object.keys(v).sort().reduce((o,k)=>(o[k]=stableNormalize(v[k]),o),{});
}
function stableStringify(v){return JSON.stringify(stableNormalize(v));}
async function sha256(text){
  const bytes=new TextEncoder().encode(String(text||''));
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function registryView(registry,refs){
  return refs.map(ref=>{
    const o=registry.objects[ref.object_id]||{};
    return {ref,content_hash:o.content_hash||null,source_refs:o.source_refs||[]};
  });
}
function layeredPrompt({rules,state,active,delta,task}){
  return ['RULES:',rules,'','STATE:',JSON.stringify(state),'','ACTIVE:',JSON.stringify(active),'','DELTA:',JSON.stringify(delta),'','TASK:',task].join('\n');
}

    if(selectedModels.length>=2) selectedModels.shift();
    selectedModels.push(model);
  }
  renderSelectedModels();
}
function ensureChat(id){
  const e=$(id);
  if(e.classList.contains('empty')){
    e.classList.remove('empty');
    e.innerHTML='';
  }
  return e;
}
function roundSection(chatId,n){
  const chat=ensureChat(chatId);
  const sec=document.createElement('section');
  sec.className='round';
  sec.innerHTML=`<div class="round-title">Round ${n}</div>`;
  chat.appendChild(sec);
  chat.scrollTop=chat.scrollHeight;
  return sec;
}
function addUser(section,title,text,long=false){
  const m=document.createElement('div');
  m.className='msg user';
  m.innerHTML=`<div class="msg-head">${title}</div><div class="bubble${long?' long':''}"></div>`;
  m.querySelector('.bubble').textContent=text;
  section.appendChild(m);
  return m;
}
function addThinking(section,model){
  const m=document.createElement('div');
  m.className='msg thinking-msg';
  m.innerHTML=`<div class="msg-head">${model}</div><div class="thinking"><span>формирует ответ</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  section.appendChild(m);
  return m;
}
function refLabel(r){return `${r.object_id} · ${r.code} · v${r.version}`;}
function inputKey(r){return `${r.object_id}@v${r.version}`;}
function changeLabel(ch){
  if(ch.op==='CREATE') return `${ch.op} · ${ch.object_type} · ${ch.temp_id}`;
  return [ch.op,ch.object_type,ch.target_id].filter(Boolean).join(' · ');
}
function structureHtml(o){
  const ann=(o.annotations||[]).map(x=>`<span class="tag">${x.type}</span>`).join('');
  const fate=(o.input_fate||[]).map(x=>`${x.input_id} → ${x.disposition}`).join(' · ');
  const trace=(o.trace||[]).flatMap(x=>x.source_ids||[]).join(' + ')||'—';
  const outputs=(o.outputs||[]).map(x=>`${x.id} · ${x.type} · v${x.version}`).join(' · ')||'—';
  const inputs=(o.passport?.input_refs||[]).map(refLabel).join(' · ')||'—';
  const changes=(o.changes||[]).map(changeLabel).join(' · ')||'—';
  const n=Number(o.completion?.output_count||0);
  return `<div class="structure">
    <div class="structure-row"><div class="structure-key">Snapshot</div><div class="structure-val">${o.passport?.input_snapshot_id||'—'}</div></div>
    <div class="structure-row"><div class="structure-key">Snapshot hash</div><div class="structure-val">${o.passport?.input_snapshot_hash||'—'}</div></div>
    <div class="structure-row"><div class="structure-key">Inputs</div><div class="structure-val">${inputs}</div></div>
    <div class="structure-row"><div class="structure-key">Output</div><div class="structure-val">${outputs}</div></div>
    <div class="structure-row"><div class="structure-key">Annotations</div><div class="structure-val tags">${ann||'<span class="tag">none</span>'}</div></div>
    <div class="structure-row"><div class="structure-key">Trace</div><div class="structure-val">${trace}</div></div>
    <div class="structure-row"><div class="structure-key">Input fate</div><div class="structure-val">${fate||'—'}</div></div>
    <div class="structure-row"><div class="structure-key">Changes</div><div class="structure-val">${changes}</div></div>
    <div class="structure-row"><div class="structure-key">Completion</div><div class="structure-val completion">${o.completion?.status||'—'} · ${n} output${n===1?'':'s'}${o.completion?.empty_by_design?' · EMPTY_BY_DESIGN':''}</div></div>
  </div>`;
}
function addModel(section,model,o){
  const m=document.createElement('div');
  m.className='msg model';
  m.innerHTML=`<div class="msg-head model-name">${model}</div><div class="bubble"><div class="answer-text"></div>${structureHtml(o)}</div>`;
  m.querySelector('.answer-text').textContent=(o.outputs||[]).find(x=>x.type==='ANSWER')?.content || (o.completion?.empty_by_design?'Empty by design':'');
  section.appendChild(m);
  section.parentElement.scrollTop=section.parentElement.scrollHeight;
  return m;
}
function setReq(id,text){
  const e=$(id);
  e.className='request-view sending';
  e.textContent=text;
}
function clearReq(id){
  const e=$(id);
  e.className='request-view empty';
  e.textContent='';
}
function schemaExample(stage,snapshot,snapshotHash,inputRefs){
  return {
    role:'schema_example',
    response:{
      passport:{contract:'AL-STRUCT-1',stage,input_snapshot_id:snapshot,input_snapshot_hash:snapshotHash,input_refs:inputRefs},
      outputs:[{id:'OUT-1',type:'ANSWER',version:1,content:'Краткий содержательный ответ'}],
      annotations:[],
      trace:[{output_id:'OUT-1',source_ids:inputRefs.map(inputKey)}],
      input_fate:inputRefs.map(x=>({input_id:inputKey(x),disposition:'CONSUMED',output_ids:['OUT-1']})),
      changes:[],
      completion:{status:'COMPLETE',output_ids:['OUT-1'],output_count:1,empty_by_design:false,anomalies:[]}
    }
  };
}
function contractText(stage,snapshot,snapshotHash,inputRefs){
  return [
    'Верни только один JSON-объект по AL-STRUCT-1; без markdown и текста вне JSON.',
    'Обязательные поля: passport, outputs, annotations, trace, input_fate, changes, completion.',
    `output.type: ${OUTPUT_TYPES.join('|')}; annotations[].type: ${ANNOTATION_TYPES.join('|')}; input_fate.disposition: ${INPUT_FATES.join('|')}; completion.status: ${COMPLETION.join('|')}; completion.reason (если есть): NO_MATERIAL_DELTA; changes[].op: ${CHANGE_OPS.join('|')}.`,
    'CONSUMED означает только «вход обработан»; это НЕ означает «решён», «проверен» или «закрыт».',
    'Существующие IDEA/PD/REQ/CON/FCT/ASM/UNK/RSK/EVD/AD/FND/CHG IDs и версии копируй только из passport.input_refs; canonical IDs не придумывай.',
    'Для нового domain object используй changes[].op="CREATE" и response-local temp_id вида "tmp-pd-1"; canonical ID назначит orchestrator.',
    'Не цитируй существующий объект только для ссылки на него: используй canonical ID.',
    'Роль ограничивает ожидаемый output, но не даёт права оценивать или отменять другие модели.',
    'input_snapshot_hash копируй без изменений из ACTIVE; формат — только 64 lowercase hex без префикса sha256:.',
    'annotations — только диагностика/UI; они не управляют status, validation, gates или commit.',
    'Для status/blocking/authority_class используй changes[].state_patch; domain payload оставляй в changes[].payload.',
    'Пример корректного формата помечен как schema_example; wrapper не копируй, верни только объект response:',
    JSON.stringify(schemaExample(stage,snapshot,snapshotHash,inputRefs))
  ].join('\n');
}
function round1Prompt(user,snapshotHash,registry){
  const inputRefs=[IDEA_REF];
  return layeredPrompt({
    rules:contractText('ROUND_1',SNAP_R1,snapshotHash,inputRefs),
    state:{original_request:user,registry_objects:registryView(registry,inputRefs)},
    active:{input_refs:inputRefs,input_snapshot_id:SNAP_R1,input_snapshot_hash:snapshotHash},
    delta:[],
    task:'Выполни исходный запрос пользователя. Верни только response-object AL-STRUCT-1.'
  });
}
function makeR1(model,index,snapshotHash){
  const common={
    passport:{contract:'AL-STRUCT-1',stage:'ROUND_1',input_snapshot_id:SNAP_R1,input_snapshot_hash:snapshotHash,input_refs:[IDEA_REF]},
    outputs:[{id:'OUT-1',type:'ANSWER',version:1,content:''}],
    annotations:[],
    trace:[{output_id:'OUT-1',source_ids:[inputKey(IDEA_REF)]}],
    input_fate:[{input_id:inputKey(IDEA_REF),disposition:'CONSUMED',output_ids:['OUT-1']}],
    changes:[],
    completion:{status:'COMPLETE',output_ids:['OUT-1'],output_count:1,empty_by_design:false,anomalies:[]}
  };
  if(index===0){
    common.outputs[0].content=`${model}: надёжная схема — Automation Controller управляет двухраундовым процессом, а существующий MyOrchestrator остаётся владельцем Web transport, DOM и extraction. После двух валидных ответов Round 1 контроллер автоматически формирует общий input для Round 2.`;
    common.annotations=[{type:'DECISION'},{type:'RISK'}];
    common.changes=[{op:'CREATE',object_type:'PD',temp_id:'tmp-pd-1',source_output_id:'OUT-1'}];
  }else{
    common.outputs[0].content=`${model}: transport и semantic orchestration должны быть разделены. Модели работают независимо в Round 1, затем оба структурированных результата входят в детерминированный fan-in и автоматически отправляются на Round 2.`;
    common.annotations=[{type:'CONSTRAINT'},{type:'FINDING'}];
    common.changes=[{op:'CREATE',object_type:'RSK',temp_id:'tmp-rsk-1',source_output_id:'OUT-1'}];
  }
  return common;
}
function priorOutput(model,ref,response){
  return {role:'prior_output',source_ref:ref,model,contract:'AL-STRUCT-1',response};
}
function round2Prompt(user,modelA,a,modelB,b,snapshotHash,registry){
  const refA=resultRef(modelA), refB=resultRef(modelB);
  const inputRefs=[IDEA_REF,refA,refB];
  return layeredPrompt({
    rules:contractText('ROUND_2',SNAP_R2,snapshotHash,inputRefs),
    state:{original_request:user,registry_objects:registryView(registry,inputRefs)},
    active:{
      input_refs:inputRefs,
      input_snapshot_id:SNAP_R2,
      input_snapshot_hash:snapshotHash,
      prior_outputs:[priorOutput(modelA,refA,a),priorOutput(modelB,refB,b)]
    },
    delta:[refA,refB],
    task:'Проанализируй оба полученных ответа на исходный запрос и сформируй собственный улучшенный итоговый ответ. Учитывай сильные стороны обоих ответов, устраняй ошибки и противоречия, не своди задачу к голосованию между ними.'
  });
}
function makeR2(model,index,modelA,modelB,snapshotHash){
  const refs=[IDEA_REF,resultRef(modelA),resultRef(modelB)];
  return {
    passport:{contract:'AL-STRUCT-1',stage:'ROUND_2',input_snapshot_id:SNAP_R2,input_snapshot_hash:snapshotHash,input_refs:refs},
    outputs:[{
      id:'OUT-1',
      type:'ANSWER',
      version:1,
      content:index===0
        ? `${model}: итоговая рабочая схема — event-driven controller поверх существующего Web runtime. Оба Round 1 results проходят AL-STRUCT-1 validation, объединяются и автоматически формируют Round 2.`
        : `${model}: итог — MyOrchestrator остаётся владельцем transport, Automation Layer — владельцем межэтапного состояния; IDEA и оба Round 1 model results явно участвуют в provenance Round 2.`
    }],
    annotations:index===0?[{type:'DECISION'},{type:'FINDING'}]:[{type:'FINDING'},{type:'RISK'}],
    trace:[{output_id:'OUT-1',source_ids:refs.map(inputKey)}],
    input_fate:[
      {input_id:inputKey(refs[0]),disposition:'CONSUMED',output_ids:['OUT-1']},
      {input_id:inputKey(refs[1]),disposition:'TRANSFORMED',output_ids:['OUT-1']},
      {input_id:inputKey(refs[2]),disposition:'TRANSFORMED',output_ids:['OUT-1']}
    ],
    changes:[],
    completion:{status:'COMPLETE',output_ids:['OUT-1'],output_count:1,empty_by_design:false,anomalies:[]}
  };
}
function recordRound(n,prompt,responses){
  if(!runData)return;
  runData.rounds.push({round:n,prompt,responses});
  setActions();
}
function buildResultsText(){
  if(!runData)return 'Нет результатов.';
  const lines=[
    `Automation Layer v${PRODUCT_VERSION} — test run`,
    `Run: ${runData.run_id}`,
    `Models: ${runData.models.join(' + ')}`,
    `Idea: ${runData.idea.object_id} · v${runData.idea.version}`,
    ''
  ];
  for(const r of runData.rounds){
    lines.push(`===== ROUND ${r.round} =====`);
    for(const item of r.responses){
      const answer=(item.response.outputs||[]).find(o=>o.type==='ANSWER')?.content || 'Empty by design';
      lines.push('',`--- ${item.model} ---`,answer);
    }
    lines.push('');
  }
  return lines.join('\n');
}
function showResults(){
  $('resultsBody').textContent=buildResultsText();
  $('resultsModal').hidden=false;
}
function saveRun(){
  if(!runData)return;
  const blob=new Blob([JSON.stringify(runData,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`automation-${runData.run_id}-audit.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
}
async function run(){
  if(busy)return;
  const user=userText();
  if(!user || selectedModels.length!==2)return;
  busy=true;cancelled=false;
  renderSelectedModels();

  const [modelA,modelB]=selectedModels;
  runData={
    schema_version:5,
    product_version:PRODUCT_VERSION,
    controller_version:CORE_VERSION,
    run_id:RUN_ID,
    models:[modelA,modelB],
    idea:IDEA_REF,
    original_request:user,
    context_policy:CONTEXT_POLICY,
    registry:{objects:{
      [IDEA_REF.object_id]:{...IDEA_REF,content:user,content_hash:null,source_refs:[]}
    }},
    accepted_message_ids:[],
    context_audit:[],
    rounds:[],
    started_at:new Date().toISOString()
  };
  setActions();
  $('gptStatus').textContent='ожидание';
  $('claudeStatus').textContent='ожидание';
  $('userPrompt').value='';

  const centerR1=roundSection('centerChat',1);
  addUser(centerR1,'Moderator',user);
  await sleep(1200); if(cancelled)return;

  runData.registry.objects[IDEA_REF.object_id].content_hash=await sha256(user);
  const snapshot1={
    state:{original_request:user,registry_objects:registryView(runData.registry,[IDEA_REF])},
    active:{input_refs:[IDEA_REF]},
    delta:[]
  };
  const snapshotHash1=await sha256(stableStringify(snapshot1));
  const p1=round1Prompt(user,snapshotHash1,runData.registry);
  runData.context_audit.push({
    round:1,input_snapshot_id:SNAP_R1,input_snapshot_hash:snapshotHash1,
    layers:['RULES','STATE','ACTIVE','DELTA','TASK'],
    included_refs:[IDEA_REF.object_id],omitted_refs:[],
    budget:{limit_chars:CONTEXT_POLICY.maxPromptChars,used_chars:p1.length}
  });
  const aR1=roundSection('gptChat',1);
  const bR1=roundSection('claudeChat',1);
  setReq('gptRequest',p1); setReq('claudeRequest',p1);
  $('gptStatus').textContent='получает запрос';
  $('claudeStatus').textContent='получает запрос';
  await sleep(2600); if(cancelled)return;

  addUser(aR1,'Moderator',p1,true); addUser(bR1,'Moderator',p1,true);
  clearReq('gptRequest'); clearReq('claudeRequest');

  $('gptStatus').textContent='генерация';
  $('claudeStatus').textContent='генерация';
  const at=addThinking(aR1,modelA), bt=addThinking(bR1,modelB);
  const act=addThinking(centerR1,modelA), bct=addThinking(centerR1,modelB);

  await sleep(3200); if(cancelled)return;
  const outA1=makeR1(modelA,0,snapshotHash1);
  at.remove();act.remove();
  addModel(aR1,modelA,outA1); addModel(centerR1,modelA,outA1);
  $('gptStatus').textContent='принят';

  await sleep(1800); if(cancelled)return;
  const outB1=makeR1(modelB,1,snapshotHash1);
  bt.remove();bct.remove();
  addModel(bR1,modelB,outB1); addModel(centerR1,modelB,outB1);
  $('claudeStatus').textContent='принят';
  const refA=resultRef(modelA), refB=resultRef(modelB);
  runData.registry.objects[refA.object_id]={...refA,content:outA1,content_hash:await sha256(stableStringify(outA1)),source_refs:[IDEA_REF.object_id]};
  runData.registry.objects[refB.object_id]={...refB,content:outB1,content_hash:await sha256(stableStringify(outB1)),source_refs:[IDEA_REF.object_id]};
  runData.accepted_message_ids.push(`demo|1|${modelA}`,`demo|1|${modelB}`);
  recordRound(1,p1,[{model:modelA,response:outA1},{model:modelB,response:outB1}]);

  await sleep(2200); if(cancelled)return;

  const refs2=[IDEA_REF,refA,refB];
  const snapshot2={
    state:{original_request:user,registry_objects:registryView(runData.registry,refs2)},
    active:{input_refs:refs2,prior_outputs:[priorOutput(modelA,refA,outA1),priorOutput(modelB,refB,outB1)]},
    delta:[refA,refB]
  };
  const snapshotHash2=await sha256(stableStringify(snapshot2));
  const p2=round2Prompt(user,modelA,outA1,modelB,outB1,snapshotHash2,runData.registry);
  runData.context_audit.push({
    round:2,input_snapshot_id:SNAP_R2,input_snapshot_hash:snapshotHash2,
    layers:['RULES','STATE','ACTIVE','DELTA','TASK'],
    included_refs:refs2.map(inputKey),omitted_refs:[],
    budget:{limit_chars:CONTEXT_POLICY.maxPromptChars,used_chars:p2.length}
  });
  const aR2=roundSection('gptChat',2);
  const bR2=roundSection('claudeChat',2);
  const centerR2=roundSection('centerChat',2);

  setReq('gptRequest',p2); setReq('claudeRequest',p2);
  $('gptStatus').textContent='получает запрос';
  $('claudeStatus').textContent='получает запрос';
  await sleep(3200); if(cancelled)return;

  addUser(aR2,'Moderator',p2,true); addUser(bR2,'Moderator',p2,true);
  clearReq('gptRequest'); clearReq('claudeRequest');
  $('gptStatus').textContent='генерация';
  $('claudeStatus').textContent='генерация';

  const at2=addThinking(aR2,modelA), bt2=addThinking(bR2,modelB);
  const act2=addThinking(centerR2,modelA), bct2=addThinking(centerR2,modelB);

  await sleep(3400); if(cancelled)return;
  const outA2=makeR2(modelA,0,modelA,modelB,snapshotHash2);
  at2.remove();act2.remove();
  addModel(aR2,modelA,outA2); addModel(centerR2,modelA,outA2);
  $('gptStatus').textContent='принят';

  await sleep(1900); if(cancelled)return;
  const outB2=makeR2(modelB,1,modelA,modelB,snapshotHash2);
  bt2.remove();bct2.remove();
  addModel(bR2,modelB,outB2); addModel(centerR2,modelB,outB2);
  $('claudeStatus').textContent='принят';
  runData.accepted_message_ids.push(`demo|2|${modelA}`,`demo|2|${modelB}`);
  recordRound(2,p2,[{model:modelA,response:outA2},{model:modelB,response:outB2}]);

  runData.completed_at=new Date().toISOString();
  busy=false;
  renderSelectedModels();
  setActions();
}
function reset(){
  cancelled=true;
  busy=false;
  runData=null;
  renderSelectedModels();
  setActions();
  $('userPrompt').value='Сравни два подхода к автоматизации архитектурного процесса и предложи наиболее надёжную рабочую схему.';
  for(const id of ['gptChat','claudeChat']){
    const e=$(id); e.className='chat empty'; e.textContent='';
  }
  const c=$('centerChat'); c.className='chat center-chat empty'; c.textContent='';
  clearReq('gptRequest'); clearReq('claudeRequest');
  $('gptStatus').textContent='ожидание';
  $('claudeStatus').textContent='ожидание';
}
document.querySelectorAll('.model-nav-button').forEach(btn=>{
  btn.addEventListener('click',()=>toggleModel(btn.dataset.model));
});
$('runBtn').addEventListener('click',run);
$('resetBtn').addEventListener('click',reset);
$('resultsBtn').addEventListener('click',showResults);
$('saveBtn').addEventListener('click',saveRun);
$('closeResultsBtn').addEventListener('click',()=>{$('resultsModal').hidden=true;});
$('resultsModal').addEventListener('click',e=>{if(e.target===$('resultsModal'))$('resultsModal').hidden=true;});

renderSelectedModels();
setActions();
</script>
