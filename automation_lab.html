<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation</title>
  <link rel="stylesheet" href="automation/lab.css">
  <link rel="stylesheet" href="automation/diagnostics-view.css">
</head>
<body>
  <div class="page">
    <section class="runbar">
      <nav class="model-navigation" id="modelNav" aria-label="Модели"></nav>
      <div class="run-actions">
        <button class="secondary" id="resultsBtn" disabled>Results</button>
        <button class="secondary" id="saveBtn" disabled>Save</button>
        <button class="secondary" id="resetBtn">Cancel</button>
        <button class="icon-btn" id="diagBtn" title="Диагностика" aria-label="Диагностика">⚙<span class="alert-dot" id="diagDot" hidden></span></button>
      </div>
    </section>

    <section class="workspace">
      <article class="column">
        <div class="head"><div class="col-tabs" id="leftTabs"></div><small id="leftStatus">ожидание</small></div>
        <div class="body">
          <div id="leftChat" class="chat"></div>
          <div id="leftRequest" class="request-view empty"></div>
        </div>
      </article>

      <section class="column">
        <div class="head"><h2>Automation</h2><small id="centerStatus"></small></div>
        <div class="body">
          <div id="centerChat" class="chat center-chat"></div>
          <form class="composer" id="composer">
            <textarea id="ideaInput" placeholder="Идея продукта"></textarea>
            <label class="sim" title="Ответы генерирует встроенный симулятор"><input type="checkbox" id="simToggle"> Симулятор</label>
            <button id="sendBtn" class="primary" type="submit">Send</button>
          </form>
        </div>
      </section>

      <article class="column">
        <div class="head"><div class="col-tabs" id="rightTabs"></div><small id="rightStatus">ожидание</small></div>
        <div class="body">
          <div id="rightChat" class="chat"></div>
          <div id="rightRequest" class="request-view empty"></div>
        </div>
      </article>
    </section>
  </div>

  <div id="resultsModal" class="results-modal" hidden>
    <div class="results-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="results-panel-head">
        <h2 id="modalTitle">Results</h2>
        <div class="run-actions">
          <button class="secondary" id="reportBtn" hidden>Отчёт для Claude</button>
          <button class="secondary" id="closeModalBtn">Close</button>
        </div>
      </div>
      <div id="modalBody" class="results-body"></div>
    </div>
  </div>

  <script src="tos-consent.js"></script>
  <script src="automation/al-canonical.js"></script>
  <script src="automation/al-schema.js"></script>
  <script src="automation/al-response-parser.js"></script>
  <script src="automation/al-spec.js"></script>
  <script src="automation/al-store.js"></script>
  <script src="automation/al-snapshot.js"></script>
  <script src="automation/al-prompt-compiler.js"></script>
  <script src="automation/al-validator.js"></script>
  <script src="automation/al-committer.js"></script>
  <script src="automation/al-engine.js"></script>
  <script src="automation/al-simulator.js"></script>
  <script src="automation/al-transport.js"></script>
  <script src="automation/al-diagnostics.js"></script>
  <script src="automation/al-diagnostics-view.js"></script>
  <script src="automation/model-icons.js"></script>
  <script src="automation/lab-ui.js"></script>
</body>
</html>
